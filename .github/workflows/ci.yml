name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show toolchain
        run: |
          python --version
          cc --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI (interpreter + VM)
        run: |
          python -m sandy examples/hello.sy
          python -m sandy --vm examples/fizzbuzz.sy

      - name: Smoke-test the native backend
        run: |
          python -m sandy build examples/native.sy -o /tmp/native_ex --run
