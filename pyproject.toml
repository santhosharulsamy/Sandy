[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandy-lang"
version = "0.1.0"
description = "Sandy — a small, friendly scripting language (.sy files)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["language", "interpreter", "scripting", "sandy"]

[project.scripts]
sandy = "sandy.cli:main"

[tool.setuptools]
packages = ["sandy"]

[tool.setuptools.package-data]
# Ship the standard-library modules (written in Sandy) with the package.
sandy = ["stdlib/*.sy"]
