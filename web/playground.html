<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandy Playground</title>
<style>
  :root {
    --bg: #0f1720; --panel: #16212e; --edge: #24313f; --ink: #e6edf3;
    --muted: #8aa0b3; --accent: #ffb454; --accent2: #4cc38a; --err: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .beach { font-size: 20px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  select, button {
    font: inherit; color: var(--ink); background: #1c2836;
    border: 1px solid var(--edge); border-radius: 8px; padding: 7px 12px;
    cursor: pointer;
  }
  button.run {
    background: var(--accent); color: #23150a; border-color: var(--accent);
    font-weight: 650;
  }
  button.run:disabled { opacity: .55; cursor: default; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--edge); }
  .label {
    padding: 8px 16px; color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--edge);
  }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; padding: 16px;
    background: transparent; color: var(--ink); font-family: var(--mono);
    font-size: 14px; line-height: 1.55; tab-size: 4;
  }
  pre#out {
    flex: 1; margin: 0; padding: 16px; overflow: auto; white-space: pre-wrap;
    font-family: var(--mono); font-size: 14px; line-height: 1.55; color: var(--ink);
  }
  pre#out .err { color: var(--err); }
  pre#out .ok { color: var(--accent2); }
  .status { padding: 6px 16px; color: var(--muted); font-size: 12px;
            border-top: 1px solid var(--edge); }
</style>
</head>
<body>
<header>
  <span class="beach">&#127958;</span>
  <h1>Sandy Playground</h1>
  <span class="sub">runs entirely in your browser</span>
  <span class="spacer"></span>
  <select id="examples" title="Load an example"></select>
  <button class="run" id="run" disabled>Run &#9654;</button>
</header>
<main>
  <section class="pane">
    <div class="label">program.sy</div>
    <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
  </section>
  <section class="pane">
    <div class="label">output</div>
    <pre id="out"></pre>
    <div class="status" id="status">Loading Python runtime&hellip;</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const SOURCES = {"/sandy/__init__.py": "\"\"\"Sandy — a small, friendly scripting language.\n\nPublic API:\n    from sandy import run_source, run_file, Interpreter, tokenize, parse\n\"\"\"\n\nfrom .lexer import tokenize\nfrom .parser import parse\nfrom .interpreter import Interpreter\nfrom .runtime import run_source, run_file\nfrom .errors import SandyError, LexError, ParseError, RuntimeErrorSandy\n\n__version__ = \"0.1.0\"\n\n__all__ = [\n    \"tokenize\", \"parse\", \"Interpreter\", \"run_source\", \"run_file\",\n    \"SandyError\", \"LexError\", \"ParseError\", \"RuntimeErrorSandy\", \"__version__\",\n]\n", "/sandy/__main__.py": "\"\"\"Enable `python -m sandy`.\"\"\"\n\nimport sys\n\nfrom .cli import main\n\nif __name__ == \"__main__\":\n    sys.setrecursionlimit(10000)\n    raise SystemExit(main())\n", "/sandy/builtins.py": "\"\"\"Built-in functions and type methods for Sandy.\n\nGlobal builtins (print, len, range, ...) are created by make_builtins().\nMethod-style calls (text.upper(), list.push(x), ...) are resolved by\nresolve_method(), which returns a bound BuiltinFunction.\n\"\"\"\n\nimport math\n\nfrom .errors import RuntimeErrorSandy\nfrom .values import BuiltinFunction, to_str, type_name, is_truthy\n\n# Names of all global builtins (kept in sync with the @reg registrations in\n# make_builtins below). Used by tooling — completion and the compiler.\nBUILTIN_NAMES = frozenset({\n    \"print\", \"input\", \"len\", \"type\", \"str\", \"int\", \"float\", \"bool\", \"range\",\n    \"abs\", \"min\", \"max\", \"sum\", \"round\", \"sqrt\", \"floor\", \"ceil\", \"pow\",\n    \"push\", \"pop\", \"keys\", \"values\", \"has\", \"upper\", \"lower\", \"trim\", \"split\",\n    \"join\", \"read_file\", \"read_lines\", \"write_file\", \"append_file\",\n})\n\n\ndef _is_int(v):\n    return isinstance(v, int) and not isinstance(v, bool)\n\n\ndef _is_num(v):\n    return isinstance(v, (int, float)) and not isinstance(v, bool)\n\n\ndef make_builtins(interp):\n    B = {}\n\n    def reg(name, arity):\n        def deco(fn):\n            B[name] = BuiltinFunction(name, fn, arity)\n            return fn\n        return deco\n\n    @reg(\"print\", None)\n    def _print(args, line):\n        text = \" \".join(to_str(a) for a in args)\n        if interp.out is not None:\n            interp.out.write(text + \"\\n\")\n        else:\n            print(text)\n        return None\n\n    @reg(\"input\", (0, 1))\n    def _input(args, line):\n        prompt = to_str(args[0]) if args else \"\"\n        try:\n            return input(prompt)\n        except EOFError:\n            return \"\"\n\n    @reg(\"len\", 1)\n    def _len(args, line):\n        v = args[0]\n        if isinstance(v, (str, list, dict)):\n            return len(v)\n        raise RuntimeErrorSandy(f\"cannot take len of a {type_name(v)}\", line)\n\n    @reg(\"type\", 1)\n    def _type(args, line):\n        return type_name(args[0])\n\n    @reg(\"str\", 1)\n    def _str(args, line):\n        return to_str(args[0])\n\n    @reg(\"int\", 1)\n    def _int(args, line):\n        v = args[0]\n        if isinstance(v, bool):\n            return 1 if v else 0\n        if isinstance(v, int):\n            return v\n        if isinstance(v, float):\n            return int(v)\n        if isinstance(v, str):\n            try:\n                return int(v.strip())\n            except ValueError:\n                raise RuntimeErrorSandy(f\"cannot convert {v!r} to int\", line)\n        raise RuntimeErrorSandy(f\"cannot convert {type_name(v)} to int\", line)\n\n    @reg(\"float\", 1)\n    def _float(args, line):\n        v = args[0]\n        if isinstance(v, bool):\n            return 1.0 if v else 0.0\n        if isinstance(v, (int, float)):\n            return float(v)\n        if isinstance(v, str):\n            try:\n                return float(v.strip())\n            except ValueError:\n                raise RuntimeErrorSandy(f\"cannot convert {v!r} to float\", line)\n        raise RuntimeErrorSandy(f\"cannot convert {type_name(v)} to float\", line)\n\n    @reg(\"bool\", 1)\n    def _bool(args, line):\n        return is_truthy(args[0])\n\n    @reg(\"range\", (1, 3))\n    def _range(args, line):\n        for a in args:\n            if not _is_int(a):\n                raise RuntimeErrorSandy(\"range() arguments must be ints\", line)\n        if len(args) == 1:\n            return list(range(args[0]))\n        if len(args) == 2:\n            return list(range(args[0], args[1]))\n        if args[2] == 0:\n            raise RuntimeErrorSandy(\"range() step cannot be zero\", line)\n        return list(range(args[0], args[1], args[2]))\n\n    @reg(\"abs\", 1)\n    def _abs(args, line):\n        v = args[0]\n        if not _is_num(v):\n            raise RuntimeErrorSandy(f\"abs() needs a number, got {type_name(v)}\", line)\n        return abs(v)\n\n    @reg(\"min\", None)\n    def _min(args, line):\n        return _reduce_minmax(args, line, min, \"min\")\n\n    @reg(\"max\", None)\n    def _max(args, line):\n        return _reduce_minmax(args, line, max, \"max\")\n\n    def _reduce_minmax(args, line, fn, name):\n        if len(args) == 1 and isinstance(args[0], list):\n            items = args[0]\n        else:\n            items = args\n        if not items:\n            raise RuntimeErrorSandy(f\"{name}() needs at least one value\", line)\n        for it in items:\n            if not _is_num(it):\n                raise RuntimeErrorSandy(f\"{name}() needs numbers\", line)\n        return fn(items)\n\n    @reg(\"sum\", 1)\n    def _sum(args, line):\n        v = args[0]\n        if not isinstance(v, list):\n            raise RuntimeErrorSandy(\"sum() needs a list\", line)\n        total = 0\n        for it in v:\n            if not _is_num(it):\n                raise RuntimeErrorSandy(\"sum() needs a list of numbers\", line)\n            total += it\n        return total\n\n    @reg(\"round\", (1, 2))\n    def _round(args, line):\n        v = args[0]\n        if not _is_num(v):\n            raise RuntimeErrorSandy(\"round() needs a number\", line)\n        if len(args) == 2:\n            if not _is_int(args[1]):\n                raise RuntimeErrorSandy(\"round() digits must be an int\", line)\n            return round(v, args[1])\n        return round(v)\n\n    @reg(\"sqrt\", 1)\n    def _sqrt(args, line):\n        v = args[0]\n        if not _is_num(v):\n            raise RuntimeErrorSandy(\"sqrt() needs a number\", line)\n        if v < 0:\n            raise RuntimeErrorSandy(\"sqrt() of a negative number\", line)\n        return math.sqrt(v)\n\n    @reg(\"floor\", 1)\n    def _floor(args, line):\n        if not _is_num(args[0]):\n            raise RuntimeErrorSandy(\"floor() needs a number\", line)\n        return math.floor(args[0])\n\n    @reg(\"ceil\", 1)\n    def _ceil(args, line):\n        if not _is_num(args[0]):\n            raise RuntimeErrorSandy(\"ceil() needs a number\", line)\n        return math.ceil(args[0])\n\n    @reg(\"pow\", 2)\n    def _pow(args, line):\n        a, b = args\n        if not (_is_num(a) and _is_num(b)):\n            raise RuntimeErrorSandy(\"pow() needs numbers\", line)\n        return a ** b\n\n    # -- list helpers as globals too --\n    @reg(\"push\", 2)\n    def _push(args, line):\n        lst, val = args\n        if not isinstance(lst, list):\n            raise RuntimeErrorSandy(\"push() needs a list\", line)\n        lst.append(val)\n        return lst\n\n    @reg(\"pop\", (1, 2))\n    def _pop(args, line):\n        lst = args[0]\n        if not isinstance(lst, list):\n            raise RuntimeErrorSandy(\"pop() needs a list\", line)\n        if not lst:\n            raise RuntimeErrorSandy(\"pop() from empty list\", line)\n        if len(args) == 2:\n            if not _is_int(args[1]):\n                raise RuntimeErrorSandy(\"pop() index must be an int\", line)\n            idx = args[1]\n            if idx < 0 or idx >= len(lst):\n                raise RuntimeErrorSandy(f\"pop() index {idx} out of range\", line)\n            return lst.pop(idx)\n        return lst.pop()\n\n    @reg(\"keys\", 1)\n    def _keys(args, line):\n        m = args[0]\n        if not isinstance(m, dict):\n            raise RuntimeErrorSandy(\"keys() needs a map\", line)\n        return list(m.keys())\n\n    @reg(\"values\", 1)\n    def _values(args, line):\n        m = args[0]\n        if not isinstance(m, dict):\n            raise RuntimeErrorSandy(\"values() needs a map\", line)\n        return list(m.values())\n\n    @reg(\"has\", 2)\n    def _has(args, line):\n        container, item = args\n        if isinstance(container, dict):\n            return item in container\n        if isinstance(container, (list, str)):\n            return item in container\n        raise RuntimeErrorSandy(f\"has() cannot search a {type_name(container)}\", line)\n\n    @reg(\"upper\", 1)\n    def _upper(args, line):\n        return _need_str(args[0], \"upper\", line).upper()\n\n    @reg(\"lower\", 1)\n    def _lower(args, line):\n        return _need_str(args[0], \"lower\", line).lower()\n\n    @reg(\"trim\", 1)\n    def _trim(args, line):\n        return _need_str(args[0], \"trim\", line).strip()\n\n    @reg(\"split\", (1, 2))\n    def _split(args, line):\n        s = _need_str(args[0], \"split\", line)\n        if len(args) == 2:\n            sep = _need_str(args[1], \"split\", line)\n            return s.split(sep)\n        return s.split()\n\n    @reg(\"join\", 2)\n    def _join(args, line):\n        lst, sep = args\n        if not isinstance(lst, list):\n            raise RuntimeErrorSandy(\"join() needs a list\", line)\n        sep = _need_str(sep, \"join\", line)\n        return sep.join(to_str(x) for x in lst)\n\n    # -- file input / output --\n    @reg(\"read_file\", 1)\n    def _read_file(args, line):\n        path = _need_str(args[0], \"read_file\", line)\n        try:\n            with open(path, \"r\", encoding=\"utf-8\") as f:\n                return f.read()\n        except OSError as e:\n            raise RuntimeErrorSandy(f\"cannot read {path!r}: {e.strerror}\", line)\n\n    @reg(\"read_lines\", 1)\n    def _read_lines(args, line):\n        path = _need_str(args[0], \"read_lines\", line)\n        try:\n            with open(path, \"r\", encoding=\"utf-8\") as f:\n                return f.read().splitlines()\n        except OSError as e:\n            raise RuntimeErrorSandy(f\"cannot read {path!r}: {e.strerror}\", line)\n\n    @reg(\"write_file\", 2)\n    def _write_file(args, line):\n        path = _need_str(args[0], \"write_file\", line)\n        try:\n            with open(path, \"w\", encoding=\"utf-8\") as f:\n                f.write(to_str(args[1]))\n        except OSError as e:\n            raise RuntimeErrorSandy(f\"cannot write {path!r}: {e.strerror}\", line)\n        return None\n\n    @reg(\"append_file\", 2)\n    def _append_file(args, line):\n        path = _need_str(args[0], \"append_file\", line)\n        try:\n            with open(path, \"a\", encoding=\"utf-8\") as f:\n                f.write(to_str(args[1]))\n        except OSError as e:\n            raise RuntimeErrorSandy(f\"cannot append {path!r}: {e.strerror}\", line)\n        return None\n\n    return B\n\n\ndef _need_str(v, name, line):\n    if not isinstance(v, str):\n        raise RuntimeErrorSandy(f\"{name}() needs a string, got {type_name(v)}\", line)\n    return v\n\n\n# ---- method-style dispatch (obj.method(...)) ----\n\ndef resolve_method(interp, target, name, line):\n    \"\"\"Return a BuiltinFunction bound to `target` for `target.name(...)`.\"\"\"\n    methods = _METHODS.get(_kind(target))\n    if methods and name in methods:\n        impl = methods[name]\n\n        def bound(args, line, _impl=impl, _t=target):\n            return _impl(_t, args, line)\n\n        return BuiltinFunction(f\"{name}\", bound, None)\n    raise RuntimeErrorSandy(\n        f\"{type_name(target)} has no method '{name}'\", line)\n\n\ndef _kind(v):\n    if isinstance(v, str):\n        return \"string\"\n    if isinstance(v, list):\n        return \"list\"\n    if isinstance(v, dict):\n        return \"map\"\n    return type_name(v)\n\n\ndef _m_arity(args, n, name, line):\n    if len(args) != n:\n        raise RuntimeErrorSandy(\n            f\"{name}() expects {n} argument(s), got {len(args)}\", line)\n\n\n_METHODS = {\n    \"string\": {\n        \"upper\": lambda t, a, l: t.upper(),\n        \"lower\": lambda t, a, l: t.lower(),\n        \"trim\": lambda t, a, l: t.strip(),\n        \"length\": lambda t, a, l: len(t),\n        \"split\": lambda t, a, l: (t.split(_need_str(a[0], \"split\", l)) if a else t.split()),\n        \"starts_with\": lambda t, a, l: t.startswith(_need_str(a[0], \"starts_with\", l)),\n        \"ends_with\": lambda t, a, l: t.endswith(_need_str(a[0], \"ends_with\", l)),\n        \"replace\": lambda t, a, l: t.replace(_need_str(a[0], \"replace\", l), _need_str(a[1], \"replace\", l)),\n        \"has\": lambda t, a, l: _need_str(a[0], \"has\", l) in t,\n    },\n    \"list\": {\n        \"push\": lambda t, a, l: (t.append(a[0]), t)[1],\n        \"pop\": lambda t, a, l: (t.pop() if t else _err(\"pop() from empty list\", l)),\n        \"length\": lambda t, a, l: len(t),\n        \"has\": lambda t, a, l: a[0] in t,\n        \"reverse\": lambda t, a, l: t[::-1],\n        \"sort\": lambda t, a, l: _sorted(t, l),\n    },\n    \"map\": {\n        \"keys\": lambda t, a, l: list(t.keys()),\n        \"values\": lambda t, a, l: list(t.values()),\n        \"has\": lambda t, a, l: a[0] in t,\n        \"length\": lambda t, a, l: len(t),\n        \"remove\": lambda t, a, l: (t.pop(a[0], None), t)[1],\n    },\n}\n\n\ndef _err(msg, line):\n    raise RuntimeErrorSandy(msg, line)\n\n\ndef _sorted(t, line):\n    try:\n        return sorted(t)\n    except TypeError:\n        raise RuntimeErrorSandy(\"sort() needs comparable items\", line)\n", "/sandy/bytecode.py": "\"\"\"Bytecode instruction set and code objects for the Sandy VM.\n\nOpcodes are small integers for fast dispatch. Each instruction is a\n(op, arg) pair; a parallel `lines` list records the source line of each\ninstruction for error reporting.\n\"\"\"\n\n# --- opcodes ---\nLOAD_CONST = 0\nLOAD_NAME = 1\nSTORE_NAME = 2          # assign: update nearest binding, else define here\nDEFINE_NAME = 3         # define in the current scope (params, funcs, for-var)\nPOP = 4\n\nBUILD_LIST = 5\nBUILD_MAP = 6\nBUILD_INTERP = 7        # concatenate N string parts\nSTR_COERCE = 8          # convert top of stack to its display string\n\nBINARY_ADD = 10\nBINARY_SUB = 11\nBINARY_MUL = 12\nBINARY_DIV = 13\nBINARY_MOD = 14\nBINARY_POW = 15\n\n# Type-specialized numeric ops: the compiler emits these only when it has\n# *proven* both operands are numbers, so they skip all runtime type checks.\nBINARY_ADD_NUM = 16\nBINARY_SUB_NUM = 17\nBINARY_MUL_NUM = 18\n\nCMP_EQ = 20\nCMP_NE = 21\nCMP_LT = 22\nCMP_GT = 23\nCMP_LE = 24\nCMP_GE = 25\n\nCMP_LT_NUM = 26\nCMP_GT_NUM = 27\nCMP_LE_NUM = 28\nCMP_GE_NUM = 29\n\nUNARY_NEG = 30\nUNARY_NOT = 31\n\nJUMP = 40\nJUMP_IF_FALSE = 41\nJUMP_IF_FALSE_OR_POP = 42   # short-circuit 'and'\nJUMP_IF_TRUE_OR_POP = 43    # short-circuit 'or'\n\nGET_ITER = 50\nFOR_ITER = 51           # arg = jump target when the iterator is exhausted\n\nDUP_TWO = 60\nINDEX_GET = 61\nINDEX_SET = 62\nGET_ATTR = 63\n\nMAKE_FUNCTION = 70\nCALL = 71               # arg = number of arguments\nRETURN = 72\n\nSETUP_TRY = 73          # arg = handler ip; push an exception handler\nPOP_TRY = 74            # remove the innermost handler (try body finished)\nTHROW = 75              # raise a Sandy error with the message on the stack\n\nSET_ATTR = 76           # arg = field name; pop value, obj; set obj.field\nDUP_TOP = 77            # duplicate the top of the stack\nIMPORT = 78             # arg = module path string; push the loaded Module\n\nOPNAMES = {v: k for k, v in list(globals().items()) if isinstance(v, int)}\n\n# Binary operator token-string -> opcode.\nBINARY_OPS = {\n    \"+\": BINARY_ADD, \"-\": BINARY_SUB, \"*\": BINARY_MUL,\n    \"/\": BINARY_DIV, \"%\": BINARY_MOD, \"**\": BINARY_POW,\n    \"==\": CMP_EQ, \"!=\": CMP_NE, \"<\": CMP_LT, \">\": CMP_GT,\n    \"<=\": CMP_LE, \">=\": CMP_GE,\n}\n\n\nclass CodeObject:\n    \"\"\"A compiled chunk of Sandy code (a program or a function body).\"\"\"\n    __slots__ = (\"name\", \"params\", \"param_types\", \"ops\", \"consts\", \"lines\")\n\n    def __init__(self, name, params, ops, consts, lines, param_types=None):\n        self.name = name\n        self.params = params\n        self.param_types = param_types  # None means no annotations (no checks)\n        self.ops = ops        # list of (op, arg)\n        self.consts = consts  # list of constant values (incl. nested CodeObjects)\n        self.lines = lines    # parallel to ops\n\n    def __repr__(self):\n        return f\"<code {self.name} ({len(self.ops)} ops)>\"\n\n\ndef disassemble(code, indent=0):\n    \"\"\"Return a human-readable listing of a CodeObject (for debugging).\"\"\"\n    pad = \"  \" * indent\n    out = [f\"{pad}code {code.name}({', '.join(code.params)}):\"]\n    for i, (op, arg) in enumerate(code.ops):\n        name = OPNAMES.get(op, str(op))\n        if arg is None:\n            out.append(f\"{pad}  {i:3} {name}\")\n        elif isinstance(arg, int) and op == LOAD_CONST:\n            out.append(f\"{pad}  {i:3} {name} {arg} ({code.consts[arg]!r})\")\n        else:\n            out.append(f\"{pad}  {i:3} {name} {arg!r}\")\n    for c in code.consts:\n        if isinstance(c, CodeObject):\n            out.append(disassemble(c, indent + 1))\n    return \"\\n\".join(out)\n", "/sandy/cbackend.py": "\"\"\"Native backend: transpile the typed scalar core of Sandy to C.\n\nThis is Stage 4 of the roadmap in miniature. A full native compiler for all\nof Sandy (closures, dynamic `any`, lists/maps) is a large project; this\nbackend deliberately handles the *statically typed scalar subset* — exactly\nwhere types make native code generation sound and worthwhile:\n\n    * types int, float, bool, string\n    * homogeneous typed lists list<int>/list<float>/list<string>/list<bool>:\n      literals, indexing, index-assignment, len(), push(), for-iteration,\n      and printing — compiled to unboxed growable C arrays (no tagging)\n    * homogeneous typed maps map<K,V> (K int/string, V scalar): literals,\n      indexing (get), index-assignment (set), has(), len(), keys(), values(),\n      for-iteration (over keys), and printing — an unboxed open-addressing\n      hash table that also tracks insertion order so output/iteration match\n      the interpreter\n    * structs with typed fields (scalar/string/struct fields): construction,\n      field access and mutation, value equality, printing, and nesting —\n      heap-allocated so they keep Sandy's reference semantics (aliasing and\n      mutation-through-calls behave identically to the interpreter)\n    * functions with typed parameters and a return type, incl. recursion\n    * arithmetic, comparisons, and/or/not, unary minus\n    * strings: concatenation (+), repetition (*), ordering, len(), str(),\n      and the .upper()/.lower()/.trim()/.length() methods\n    * if / elif / else, while, for i in range(...), break, continue, return\n    * print(...) of scalars, lists, and interpolated strings\n\nAnything outside this subset raises NativeUnsupported with a clear message,\npointing the user back to the `--vm` engine. The generated C is compiled with\nthe system C compiler at -O2, so typed programs run at native speed.\n\nSemantics are matched to the interpreter on purpose: `/` is always float,\n`%` is Python-style floor modulo, floats print as the interpreter shows them\n(integral values as `N.0`), string ordering is lexicographic (strcmp), and\nlists print as `[a, b, c]` with strings quoted.\n\nHeap values (strings, lists, maps, structs) are allocated through a small set\nof macros. By default they are never freed — fine for the short-lived _gc_rehash(size_t newcap) {\n    SyGCEntry* old = sy_gc_tab; size_t oc = sy_gc_cap;\n    sy_gc_tab = (SyGCEntry*)calloc(newcap, sizeof(SyGCEntry));\n    sy_gc_cap = newcap; sy_gc_count = 0;\n    for (size_t i = 0; i < oc; i++) if (old[i].ptr) sy_gc_put(old[i].ptr, old[i].size);\n    free(old);\n}\nstatic void sy_gc_put(void* p, size_t size) {\n    if (sy_gc_cap == 0) sy_gc_rehash(1024);\n    else if ((sy_gc_count + 1) * 10 >= sy_gc_cap * 7) sy_gc_rehash(sy_gc_cap * 2);\n    size_t h = sy_gc_hash(p) & (sy_gc_cap - 1);\n    while (sy_gc_tab[h].ptr) {\n        if (sy_gc_tab[h].ptr == p) { sy_gc_tab[h].size = size; return; }\n        h = (h + 1) & (sy_gc_cap - 1);\n    }\n    sy_gc_tab[h].ptr = p; sy_gc_tab[h].size = size; sy_gc_tab[h].mark = 0;\n    sy_gc_count++;\n}\nstatic SyGCEntry* sy_gc_find(void* p) {\n    if (!sy_gc_cap || !p) return NULL;\n    size_t h = sy_gc_hash(p) & (sy_gc_cap - 1);\n    while (sy_gc_tab[h].ptr) {\n        if (sy_gc_tab[h].ptr == p) return &sy_gc_tab[h];\n        h = (h + 1) & (sy_gc_cap - 1);\n    }\n    return NULL;\n}\nstatic void sy_gc_mark(char* lo, char* hi) {\n    uintptr_t a = ((uintptr_t)lo + sizeof(void*) - 1) & ~(uintptr_t)(sizeof(void*) - 1);\n    for (char* pp = (char*)a; pp + sizeof(void*) <= hi; pp += sizeof(void*)) {\n        SyGCEntry* e = sy_gc_find(*(void**)pp);\n        if (e && !e->mark) { e->mark = 1; sy_gc_mark((char*)e->ptr, (char*)e->ptr + e->size); }\n    }\n}\nstatic void sy_gc_collect(void) {\n    jmp_buf jb; setjmp(jb);              /* flush callee-saved registers to stack */\n    char anchor; char* cur = &anchor;\n    char* lo = cur < (char*)sy_gc_bottom ? cur : (char*)sy_gc_bottom;\n    char* hi = cur < (char*)sy_gc_bottom ? (char*)sy_gc_bottom : cur;\n    for (size_t i = 0; i < sy_gc_cap; i++) sy_gc_tab[i].mark = 0;\n    sy_gc_mark(lo, hi);\n    for (size_t i = 0; i < sy_gc_cap; i++)\n        if (sy_gc_tab[i].ptr && !sy_gc_tab[i].mark) {\n            free(sy_gc_tab[i].ptr); sy_gc_tab[i].ptr = NULL; sy_gc_count--;\n        }\n    sy_gc_bytes = 0;\n}\nstatic void* sy_gc_alloc(size_t n) {\n    if (sy_gc_bytes > sy_gc_threshold) sy_gc_collect();\n    void* p = malloc(n ? n : 1);\n    sy_gc_put(p, n); sy_gc_bytes += n; return p;\n}\nstatic void* sy_gc_calloc(size_t a, size_t b) {\n    void* p = sy_gc_alloc(a * b); memset(p, 0, a * b); return p;\n}\nstatic void* sy_gc_realloc(void* old, size_t n) {\n    void* p = sy_gc_alloc(n);\n    if (old) { SyGCEntry* e = sy_gc_find(old);\n               size_t os = e ? e->size : 0; memcpy(p, old, os < n ? os : n); }\n    return p;\n}\n#define SY_ALLOC(n) sy_gc_alloc(n)\n#define SY_CALLOC(a, b) sy_gc_calloc(a, b)\n#define SY_REALLOC(p, n) sy_gc_realloc(p, n)\n#define SY_FREE(p) ((void)0)\n#else\n#define SY_ALLOC(n) malloc(n)\n#define SY_CALLOC(a, b) calloc(a, b)\n#define SY_REALLOC(p, n) realloc(p, n)\n#define SY_FREE(p) free(p)\n#endif\n\"\"\"\n\n_HELPERS = r\"\"\"\nstatic long long sy_ipow(long long base, long long exp) {\n    long long r = 1;\n    while (exp > 0) { if (exp & 1) r *= base; base *= base; exp >>= 1; }\n    return r;\n}\nstatic long long sy_imod(long long a, long long b) {\n    long long m = a % b;\n    if (m != 0 && ((m < 0) != (b < 0))) m += b;\n    return m;\n}\nstatic double sy_fmod(double a, double b) {\n    double m = fmod(a, b);\n    if (m != 0 && ((m < 0) != (b < 0))) m += b;\n    return m;\n}\nstatic double sy_divf(double a, double b, int line) {\n    if (b == 0) { fprintf(stderr, \"RuntimeError (line %d): division by zero\\n\", line); exit(1); }\n    return a / b;\n}\nstatic long long sy_ckz(long long b, int line) {\n    if (b == 0) { fprintf(stderr, \"RuntimeError (line %d): modulo by zero\\n\", line); exit(1); }\n    return b;\n}\nstatic void sy_pf(double v) {\n    if (v == (long long)v && v < 1e16 && v > -1e16) printf(\"%.1f\", v);\n    else printf(\"%g\", v);\n}\n/* String runtime. Sandy strings are immutable; these helpers return freshly\n   heap-allocated buffers. Memory is not reclaimed yet (a garbage collector is\n   a later roadmap item), which is fine for the short-lived programs the native\n   backend currently targets. */\nstatic char* sy_concat(const char* a, const char* b) {\n    size_t la = strlen(a), lb = strlen(b);\n    char* r = (char*)SY_ALLOC(la + lb + 1);\n    memcpy(r, a, la); memcpy(r + la, b, lb + 1);\n    return r;\n}\nstatic char* sy_repeat(const char* s, long long n) {\n    if (n < 0) n = 0;\n    size_t ls = strlen(s);\n    char* r = (char*)SY_ALLOC(ls * (size_t)n + 1);\n    char* p = r;\n    for (long long i = 0; i < n; i++) { memcpy(p, s, ls); p += ls; }\n    *p = 0;\n    return r;\n}\nstatic char* sy_from_ll(long long v) {\n    char* r = (char*)SY_ALLOC(24);\n    snprintf(r, 24, \"%lld\", v);\n    return r;\n}\nstatic char* sy_from_double(double v) {\n    char* r = (char*)SY_ALLOC(32);\n    if (v == (long long)v && v < 1e16 && v > -1e16) snprintf(r, 32, \"%.1f\", v);\n    else snprintf(r, 32, \"%g\", v);\n    return r;\n}\nstatic long long sy_slen(const char* s) { return (long long)strlen(s); }\nstatic char* sy_upper(const char* s) {\n    size_t n = strlen(s); char* r = (char*)SY_ALLOC(n + 1);\n    for (size_t i = 0; i < n; i++) r[i] = (char)toupper((unsigned char)s[i]);\n    r[n] = 0; return r;\n}\nstatic char* sy_lower(const char* s) {\n    size_t n = strlen(s); char* r = (char*)SY_ALLOC(n + 1);\n    for (size_t i = 0; i < n; i++) r[i] = (char)tolower((unsigned char)s[i]);\n    r[n] = 0; return r;\n}\nstatic char* sy_trim(const char* s) {\n    while (*s && isspace((unsigned char)*s)) s++;\n    size_t n = strlen(s);\n    while (n > 0 && isspace((unsigned char)s[n - 1])) n--;\n    char* r = (char*)SY_ALLOC(n + 1);\n    memcpy(r, s, n); r[n] = 0; return r;\n}\nstatic void sy_prepr(const char* s) {  /* quoted form used inside lists */\n    putchar('\"');\n    for (; *s; s++) { if (*s == '\\\\' || *s == '\"') putchar('\\\\'); putchar(*s); }\n    putchar('\"');\n}\n\"\"\"\n\n\ndef _int_literal(node):\n    \"\"\"Return the value of an integer literal (allowing a unary minus), or\n    None if the node isn't a compile-time integer constant.\"\"\"\n    if isinstance(node, N.IntLit):\n        return node.value\n    if isinstance(node, N.UnaryOp) and node.op == \"-\" \\\n            and isinstance(node.operand, N.IntLit):\n        return -node.operand.value\n    return None\n\n\ndef _cstr(s):\n    out = ['\"']\n    for ch in s:\n        if ch == \"\\\\\":\n            out.append(\"\\\\\\\\\")\n        elif ch == '\"':\n            out.append('\\\\\"')\n        elif ch == \"\\n\":\n            out.append(\"\\\\n\")\n        elif ch == \"\\t\":\n            out.append(\"\\\\t\")\n        elif ch == \"\\r\":\n            out.append(\"\\\\r\")\n        else:\n            out.append(ch)\n    out.append('\"')\n    return \"\".join(out)\n\n\n# Element sandy type -> (struct suffix, element C type) for native lists.\n_ELEM = {\"int\": (\"i\", \"long long\"), \"float\": (\"d\", \"double\"),\n         \"string\": (\"s\", \"const char*\"), \"bool\": (\"b\", \"int\")}\n\n# Map key types we support natively (values use _ELEM).\n_KEY = {\"string\": (\"s\", \"const char*\"), \"int\": (\"i\", \"long long\")}\n\n\ndef _list_base(t):\n    \"\"\"'list' base of a type, or None if it isn't a list type.\"\"\"\n    if isinstance(t, str) and t.startswith(\"list<\") and t.endswith(\">\"):\n        return t[5:-1]\n    return None\n\n\ndef _map_kv(t):\n    \"\"\"(key, value) types of a map<K,V>, or None if `t` isn't a map type.\"\"\"\n    if isinstance(t, str) and t.startswith(\"map<\") and t.endswith(\">\"):\n        inner = t[4:-1]\n        depth, comma = 0, -1\n        for i, ch in enumerate(inner):\n            if ch == \"<\":\n                depth += 1\n            elif ch == \">\":\n                depth -= 1\n            elif ch == \",\" and depth == 0:\n                comma = i\n                break\n        if comma != -1:\n            return inner[:comma].strip(), inner[comma + 1:].strip()\n    return None\n\n\ndef _list_runtime( SY_REALLOC(m->order, (size_t)m->ocap * sizeof({kc})); }}\n    m->order[m->len] = k; m->len++;\n}}\nstatic {vc} sy_mget_{ks}_{vs}({mt}* m, {kc} k, int line) {{\n    unsigned long h = sy_hash_{ks}(k) & (unsigned long)(m->cap - 1);\n    while (m->used[h]) {{ if (sy_keq_{ks}(m->keys[h], k)) return m->vals[h]; h = (h + 1) & (unsigned long)(m->cap - 1); }}\n    {notfound} exit(1);\n}}\nstatic int sy_mhas_{ks}_{vs}({mt}* m, {kc} k) {{\n    unsigned long h = sy_hash_{ks}(k) & (unsigned long)(m->cap - 1);\n    while (m->used[h]) {{ if (sy_keq_{ks}(m->keys[h], k)) return 1; h = (h + 1) & (unsigned long)(m->cap - 1); }}\n    return 0;\n}}\n\"\"\"\n\n\nclass _Sig:\n    __slots__ = (\"params\", \"ptypes\", \"ret\")\n\n    def __init__(self, params, ptypes, ret):\n        self.params = params\n        self.ptypes = ptypes\n        self.ret = ret  # sandy type name or None (void)\n\n\nclass CBackend:\n    def __init__(self):\n        self.funcs = {}\n        self.structs = {}          # name -> (fields, field_types)\n        self.structs_needed = []   # struct names used, in definition order\n        self.lists_needed = set()  # element types of lists used (for runtime)\n        self.maps_needed = set()   # (key, value) type pairs of maps used\n        self._tmp = 0\n\n    # -- entry --\n    def compile(self, program):\n        structdefs = [s for s in program.statements if isinstance(s, N.StructDef)]\n        funcdefs = [s for s in program.statements if isinstance(s, N.FuncDef)]\n        topstmts = [s for s in program.statements\n                    if not isinstance(s, (N.FuncDef, N.StructDef))]\n        for sd in structdefs:\n            self.structs[sd.name] = (list(sd.fields), list(sd.field_types))\n        for sd in structdefs:\n            self._validate_struct(sd)\n        for fd in funcdefs:\n            self._register(fd)\n        sections = [self._emit_function(fd) for fd in funcdefs]\n        main_body = self._emit_main(topstmts)\n        return self._assemble(sections, main_body)\n\n    def _validate_struct(self, sd):\n        # Fields must be typed as a scalar, a string, or another struct.\n        for fname, ft in zip(sd.fields, sd.field_types):\n            if ft is None:\n                raise NativeUnsupported(\n                    f\"native struct '{sd.name}' needs a type on field \"\n                    f\"'{fname}' (e.g. `{fname}: int`)\", sd.line)\n            if ft not in C_TYPE and ft not in self.structs:\n                raise NativeUnsupported(\n                    f\"native struct field '{sd.name}.{fname}' must be a scalar, \"\n                    f\"string, or struct type, not '{ft}' (list/map fields aren't \"\n                    f\"supported by the native backend yet)\", sd.line)\n\n    # C type / zero-value for a (possibly list/map) Sandy type.\n    def _cty(self, t):\n        et = _list_base(t)\n        if et is not None:\n            if et not in _ELEM:\n                raise NativeUnsupported(\n                    f\"native lists support element types int/float/bool/\"\n                    f\"string, not '{et}'\", None)\n            self.lists_needed.add(et)\n            return f\"SyList_{_ELEM[et][0]}*\"\n        kv = _map_kv(t)\n        if kv is not None:\n            kt, vt = kv\n            if kt not in _KEY or vt not in _ELEM:\n                raise NativeUnsupported(\n                    f\"native maps support key int/string and scalar values, \"\n                    f\"not map<{kt},{vt}>\", None)\n            self.maps_needed.add((kt, vt))\n            return f\"SyMap_{_KEY[kt][0]}_{_ELEM[vt][0]}*\"\n        if t in self.structs:\n            if t not in self.structs_needed:\n                self.structs_needed.append(t)\n            return f\"SyStruct_{t}*\"\n        if t not in C_TYPE:\n            raise NativeUnsupported(f\"unsupported native type '{t or 'any'}'\", None)\n        return C_TYPE[t]\n\n    def _czero(self, t):\n        if (_list_base(t) is not None or _map_kv(t) is not None\n                or t in self.structs):\n            return \"NULL\"\n        return _ZERO[t]\n\n    def _is_native_type(self, t):\n        return (t in C_TYPE or t in self.structs\n                or _list_base(t) is not None or _map_kv(t) is not None)\n\n    def _newtmp(self):\n        self._tmp += 1\n        return f\"_t{self._tmp}\"\n\n    def _register(self, fd):\n        for pt in fd.param_types:\n            if not self._is_native_type(pt):\n                raise NativeUnsupported(\n                    f\"native function '{fd.name}' needs typed parameters \"\n                    f\"(int/float/bool/string/list<T>/map<K,V>/struct); got \"\n                    f\"'{pt or 'any'}'\", fd.line)\n        ret = fd.ret_type\n        if ret is not None and not self._is_native_type(ret):\n            raise NativeUnsupported(\n                f\"native function '{fd.name}' has unsupported return type \"\n                f\"'{ret}'\", fd.line)\n        self.funcs[fd.name] = _Sig(fd.params, list(fd.param_types), ret)\n\n    # -- functions --\n    def _emit_function(self, fd):\n        sig = self.funcs[fd.name]\n        scope = dict(zip(sig.params, sig.ptypes))\n        locals_ = self._infer_locals(fd.body, scope, sig)\n        params = \", \".join(f\"{self._cty(t)} {n}\"\n                           for n, t in zip(sig.params, sig.ptypes))\n        ret_c = self._cty(sig.ret) if sig.ret else \"void\"\n        lines = [f\"{ret_c} {fd.name}({params or 'void'}) {{\"]\n        for n, t in locals_:\n            lines.append(f\"    {self._cty(t)} {n} = {self._czero(t)};\")\n        lines += self._emit_block(fd.body, scope, sig, 1)\n        lines.append(\"}\")\n        return \"\\n\".join(lines)\n\n    def _emit_main(self, stmts):\n        scope = {}\n        pseudo = _Sig([], [], None)\n        block = N.Block(stmts)\n        locals_ = self._infer_locals(block, scope, pseudo)\n        lines = [\"int main(void) {\"]\n        lines.append(\"#ifdef SANDY_GC\")\n        lines.append(\"    sy_gc_init(__builtin_frame_address(0));\")\n        lines.append(\"#endif\")\n        for n, t in locals_:\n            lines.append(f\"    {self._cty(t)} {n} = {self._czero(t)};\")\n        lines += self._emit_block(block, scope, pseudo, 1)\n        lines.append(\"    return 0;\")\n        lines.append(\"}\")\n        return \"\\n\".join(lines)\n\n    # -- local hoisting / type inference --\n    def _infer_locals(self, block, scope, sig):\n        found = []\n\n        def visit(b):\n            for s in b.statements:\n                t = type(s)\n                if t is N.Assign:\n                    if isinstance(s.target, (N.Index, N.Attribute)):\n                        continue  # field/index assignment declares no new variable\n                    if not isinstance(s.target, N.Identifier):\n                        raise NativeUnsupported(\n                            \"native mode supports only simple variable \"\n                            \"assignment\", s.line)\n                    name = s.target.name\n                    if s.annotation is not None:\n                        vt = s.annotation\n                        if not self._is_native_type(vt):\n                            raise NativeUnsupported(\n                                f\"unsupported native type '{vt}'\", s.line)\n                    elif s.op != \"=\":  # compound needs existing var\n                        if name not in scope:\n                            raise NativeUnsupported(\n                                f\"'{name}' used before assignment\", s.line)\n                        vt = scope[name]\n                    else:\n                        vt = self._type(s.value, scope, sig)\n                    if name not in scope:\n                        scope[name] = vt\n                        found.append((name, vt))\n                    else:\n                        self._check_assignable(scope[name], vt, s.line, name)\n                elif t is N.If:\n                    for _, blk in s.branches:\n                        visit(blk)\n                    if s.else_block is not None:\n                        visit(s.else_block)\n                elif t is N.While:\n                    visit(s.body)\n                elif t is N.For:\n                    if s.var not in scope:\n                        vt = self._forvar_type(s, scope, sig)\n                        scope[s.var] = vt\n                        found.append((s.var, vt))\n                    visit(s.body)\n                elif t is N.FuncDef:\n                    raise NativeUnsupported(\n                        \"nested functions are not supported in native mode yet\",\n                        s.line)\n        visit(block)\n        return found\n\n    # -- statements --\n    def _emit_block(self, block, scope, sig, indent):\n        lines = []\n        for s in block.statements:\n            lines += self._emit_stmt(s, scope, sig, indent)\n        return lines\n\n    def _emit_stmt(self, s, scope, sig, indent):\n        ind = \"    \" * indent\n        t = type(s)\n        if t is N.ExprStmt:\n            e = s.expr\n            if isinstance(e, N.Call) and isinstance(e.callee, N.Identifier) \\\n                    and e.callee.name == \"print\":\n                return self._emit_print(e.args, scope, sig, ind)\n            code, _ = self._expr(e, scope, sig, allow_void=True)\n            return [f\"{ind}{code};\"]\n        if t is N.Assign:\n            if isinstance(s.target, N.Index):\n                return self._emit_index_set(s, scope, sig, ind)\n            if isinstance(s.target, N.Attribute):\n                return self._emit_field_set(s, scope, sig, ind)\n            name = s.target.name\n            declared = scope[name]\n            if s.op == \"=\":\n                value = s.value\n            else:\n                value = N.BinaryOp(s.op[0], s.target, s.value, s.line)\n            if isinstance(value, N.ListLit):\n                code, vt = self._list_literal(value, scope, sig, declared)\n            elif isinstance(value, N.MapLit):\n                code, vt = self._map_literal(value, scope, sig, declared)\n            else:\n                code, vt = self._expr(value, scope, sig)\n            self._check_assignable(declared, vt, s.line, name)\n            if declared == \"float\" and vt == \"int\":\n                code = f\"(double)({code})\"\n            return [f\"{ind}{name} = {code};\"]\n        if t is N.If:\n            lines = []\n            for i, (cond, blk) in enumerate(s.branches):\n                cc = self._bool(cond, scope, sig)\n                kw = \"if\" if i == 0 else \"} else if\"\n                lines.append(f\"{ind}{kw} ({cc}) {{\")\n                lines += self._emit_block(blk, scope, sig, indent + 1)\n            if s.else_block is not None:\n                lines.append(f\"{ind}}} else {{\")\n                lines += self._emit_block(s.else_block, scope, sig, indent + 1)\n            lines.append(f\"{ind}}}\")\n            return lines\n        if t is N.While:\n            cc = self._bool(s.cond, scope, sig)\n            lines = [f\"{ind}while ({cc}) {{\"]\n            lines += self._emit_block(s.body, scope, sig, indent + 1)\n            lines.append(f\"{ind}}}\")\n            return lines\n        if t is N.For:\n            return self._emit_for(s, scope, sig, indent)\n        if t is N.Return:\n            if s.value is None:\n                return [f\"{ind}return;\"]\n            if sig.ret is None:\n                raise NativeUnsupported(\n                    \"this native function returns a value but has no return \"\n                    \"type annotation\", s.line)\n            code, vt = self._expr(s.value, scope, sig)\n            self._check_assignable(sig.ret, vt, s.line, \"return value\")\n            if sig.ret == \"float\" and vt == \"int\":\n                code = f\"(double)({code})\"\n            return [f\"{ind}return {code};\"]\n        if t is N.Break:\n            return [f\"{ind}break;\"]\n        if t is N.Continue:\n            return [f\"{ind}continue;\"]\n        if t is N.Try or t is N.Throw:\n            raise NativeUnsupported(\n                \"try/catch/throw is dynamic control flow and is not supported \"\n                \"by the native backend; run it with the interpreter or `--vm`\",\n                getattr(s, \"line\", None))\n        if t is N.StructDef:\n            return []   # declarations are emitted from compile(), not inline\n        if t is N.Import:\n            raise NativeUnsupported(\n                \"import is not supported by the native backend; run with the \"\n                \"interpreter or `--vm`\", getattr(s, \"line\", None))\n        raise NativeUnsupported(\n            f\"{type(s).__name__} is not supported in native mode\",\n            getattr(s, \"line\", None))\n\n    def _emit_field_set(self, s, scope, sig, ind):\n        target = s.target\n        tc, tt = self._expr(target.target, scope, sig)\n        if tt not in self.structs:\n            raise NativeUnsupported(\n                f\"cannot set field '{target.name}' on a {tt}\", s.line)\n        fields, ftypes = self.structs[tt]\n        if target.name not in fields:\n            raise NativeUnsupported(f\"{tt} has no field '{target.name}'\", s.line)\n        ft = ftypes[fields.index(target.name)]\n        lhs = f\"({tc})->{target.name}\"\n        if s.op == \"=\":\n            vc, vt = self._expr(s.value, scope, sig)\n        else:\n            vc, vt = self._binary(\n                N.BinaryOp(s.op[0], target, s.value, s.line), scope, sig)\n        self._check_assignable(ft, vt, s.line, f\"field '{target.name}'\")\n        if ft == \"float\" and vt == \"int\":\n            vc = f\"(double)({vc})\"\n        return [f\"{ind}{lhs} = {vc};\"]\n\n    def _emit_index_set(self, s, scope, sig, ind):\n        target = s.target\n        tc, tt = self._expr(target.target, scope, sig)\n        et = _list_base(tt)\n        kv = _map_kv(tt)\n        if et is None and kv is None:\n            raise NativeUnsupported(\n                f\"cannot index-assign into a {tt} in native mode\", s.line)\n        if s.op == \"=\":\n            value = s.value\n        else:\n            value = N.BinaryOp(s.op[0], target, s.value, s.line)\n        if et is not None:\n            ic, it = self._expr(target.index, scope, sig)\n            if it != \"int\":\n                raise NativeUnsupported(\"list index must be an int\", s.line)\n            vc, vt = self._expr(value, scope, sig)\n            self._check_assignable(et, vt, s.line, \"list element\")\n            if et == \"float\" and vt == \"int\":\n                vc = f\"(double)({vc})\"\n            return [f\"{ind}sy_lset_{_ELEM[et][0]}({tc}, {ic}, {vc}, {s.line});\"]\n        # map index-assignment\n        kt, mvt = kv\n        kc, kct = self._expr(target.index, scope, sig)\n        self._check_assignable(kt, kct, s.line, \"map key\")\n        vc, vt = self._expr(value, scope, sig)\n        self._check_assignable(mvt, vt, s.line, \"map value\")\n        if mvt == \"float\" and vt == \"int\":\n            vc = f\"(double)({vc})\"\n        ks, vs = _KEY[kt][0], _ELEM[mvt][0]\n        return [f\"{ind}sy_mput_{ks}_{vs}({tc}, {kc}, {vc});\"]\n\n    def _forvar_type(self, s, scope, sig):\n        it = s.iterable\n        if isinstance(it, N.Call) and isinstance(it.callee, N.Identifier) \\\n                and it.callee.name == \"range\":\n            return \"int\"\n        _, itt = self._expr(it, scope, sig)\n        et = _list_base(itt)\n        if et is not None:\n            return et\n        kv = _map_kv(itt)\n        if kv is not None:\n            return kv[0]  # iterating a map yields its keys\n        raise NativeUnsupported(\n            \"native for-loops iterate over range(...), a list, or a map\",\n            s.line)\n\n    def _emit_for(self, s, scope, sig, indent):\n        ind = \"    \" * indent\n        it = s.iterable\n        if not (isinstance(it, N.Call) and isinstance(it.callee, N.Identifier)\n                and it.callee.name == \"range\"):\n            return self._emit_for_list(s, scope, sig, indent)\n        args = it.args\n        if not 1 <= len(args) <= 3:\n            raise NativeUnsupported(\"range expects 1 to 3 arguments\", s.line)\n        for a in args:\n            if self._type(a, scope, sig) != \"int\":\n                raise NativeUnsupported(\"range arguments must be int\", s.line)\n        v = s.var\n        if len(args) == 1:\n            start, stop, step = \"0\", self._expr(args[0], scope, sig)[0], \"1\"\n        elif len(args) == 2:\n            start = self._expr(args[0], scope, sig)[0]\n            stop = self._expr(args[1], scope, sig)[0]\n            step = \"1\"\n        else:\n            start = self._expr(args[0], scope, sig)[0]\n            stop = self._expr(args[1], scope, sig)[0]\n            step_val = _int_literal(args[2])\n            if step_val is None or step_val == 0:\n                raise NativeUnsupported(\n                    \"native range step must be a non-zero integer literal\",\n                    s.line)\n            step = str(step_val)\n        cmp = \">\" if step.startswith(\"-\") else \"<\"\n        lines = [f\"{ind}for ({v} = {start}; {v} {cmp} {stop}; {v} += {step}) {{\"]\n        lines += self._emit_block(s.body, scope, sig, indent + 1)\n        lines.append(f\"{ind}}}\")\n        return lines\n\n    def _emit_for_list(self, s, scope, sig, indent):\n        ind = \"    \" * indent\n        code, itt = self._expr(s.iterable, scope, sig)\n        et = _list_base(itt)\n        if et is not None:\n            sfx = _ELEM[et][0]\n            lst, i = self._newtmp(), self._newtmp()\n            elem = f\"{lst}->data[{i}]\"\n            head = f\"SyList_{sfx}* {lst} = {code};\"\n            length = f\"{lst}->len\"\n        else:\n            kv = _map_kv(itt)\n            if kv is None:\n                raise NativeUnsupported(\n                    \"native for-loops iterate over range(...), a list, or a \"\n                    \"map\", s.line)\n            ks, vs = _KEY[kv[0]][0], _ELEM[kv[1]][0]\n            m, i = self._newtmp(), self._newtmp()\n            elem = f\"{m}->order[{i}]\"    # iterating a map yields its keys\n            head = f\"SyMap_{ks}_{vs}* {m} = {code};\"\n            length = f\"{m}->len\"\n        lines = [\n            f\"{ind}{{ {head}\",\n            f\"{ind}for (long long {i} = 0; {i} < {length}; {i}++) {{\",\n            f\"{ind}    {s.var} = {elem};\",\n        ]\n        lines += self._emit_block(s.body, scope, sig, indent + 1)\n        lines.append(f\"{ind}}} }}\")\n        return lines\n\n    def _emit_print(self, args, scope, sig, ind):\n        lines = []\n        for i, arg in enumerate(args):\n            if i > 0:\n                lines.append(f'{ind}fputs(\" \", stdout);')\n            lines += self._emit_value(arg, scope, sig, ind)\n        lines.append(f'{ind}fputs(\"\\\\n\", stdout);')\n        return lines\n\n    def _emit_value(self, expr, scope, sig, ind):\n        if isinstance(expr, N.InterpStr):\n            out = []\n            for kind, payload in expr.parts:\n                if kind == \"lit\":\n                    out.append(f\"{ind}fputs({_cstr(payload)}, stdout);\")\n                else:\n                    out += self._emit_scalar(payload, scope, sig, ind)\n            return out\n        return self._emit_scalar(expr, scope, sig, ind)\n\n    def _emit_scalar(self, expr, scope, sig, ind):\n        code, t = self._expr(expr, scope, sig)\n        if t == \"int\":\n            return [f'{ind}printf(\"%lld\", (long long)({code}));']\n        if t == \"float\":\n            return [f\"{ind}sy_pf({code});\"]\n        if t == \"bool\":\n            return [f'{ind}fputs(({code}) ? \"true\" : \"false\", stdout);']\n        if t == \"string\":\n            return [f\"{ind}fputs({code}, stdout);\"]\n        if _list_base(t) is not None:\n            return self._emit_list_print(code, t, ind)\n        if _map_kv(t) is not None:\n            return self._emit_map_print(code, t, ind)\n        if t in self.structs:\n            return [f\"{ind}sy_print_{t}({code});\"]\n        raise NativeUnsupported(f\"cannot print a {t} value in native mode\",\n                                getattr(expr, \"line\", None))\n\n    def _scalar_repr(self, code, typ):\n        \"\"\"A C statement that prints `code` in the interpreter's `to_repr`\n        form (strings quoted) — used inside list/map output.\"\"\"\n        if typ == \"int\":\n            return f'printf(\"%lld\", (long long)({code}));'\n        if typ == \"float\":\n            return f\"sy_pf({code});\"\n        if typ == \"bool\":\n            return f'fputs(({code}) ? \"true\" : \"false\", stdout);'\n        if typ == \"string\":\n            return f\"sy_prepr({code});\"\n        raise NativeUnsupported(f\"cannot format a {typ} value natively\", None)\n\n    def _emit_list_print(self, code, t, ind):\n        et = _list_base(t)\n        sfx = _ELEM[et][0]\n        lst, i = self._newtmp(), self._newtmp()\n        show = self._scalar_repr(f\"{lst}->data[{i}]\", et)\n        return [\n            f\"{ind}{{ SyList_{sfx}* {lst} = {code};\",\n            f'{ind}fputs(\"[\", stdout);',\n            f\"{ind}for (long long {i} = 0; {i} < {lst}->len; {i}++) {{\",\n            f'{ind}    if ({i}) fputs(\", \", stdout);',\n            f\"{ind}    {show}\",\n            f\"{ind}}}\",\n            f'{ind}fputs(\"]\", stdout);',\n            f\"{ind}}}\",\n        ]\n\n    def _emit_map_print(self, code, t, ind):\n        kt, vt = _map_kv(t)\n        ks, vs = _KEY[kt][0], _ELEM[vt][0]\n        m, i = self._newtmp(), self._newtmp()\n        key = f\"{m}->order[{i}]\"\n        show_k = self._scalar_repr(key, kt)\n        show_v = self._scalar_repr(f\"sy_mget_{ks}_{vs}({m}, {key}, 0)\", vt)\n        return [\n            f\"{ind}{{ SyMap_{ks}_{vs}* {m} = {code};\",\n            f'{ind}fputs(\"{{\", stdout);',\n            f\"{ind}for (long long {i} = 0; {i} < {m}->len; {i}++) {{\",\n            f'{ind}    if ({i}) fputs(\", \", stdout);',\n            f\"{ind}    {show_k}\",\n            f'{ind}    fputs(\": \", stdout);',\n            f\"{ind}    {show_v}\",\n            f\"{ind}}}\",\n            f'{ind}fputs(\"}}\", stdout);',\n            f\"{ind}}}\",\n        ]\n\n    # -- expressions: return (c_code, sandy_type) --\n    def _expr(self, e, scope, sig, allow_void=False):\n        t = type(e)\n        if t is N.IntLit:\n            return (f\"{e.value}LL\", \"int\")\n        if t is N.FloatLit:\n            return (repr(float(e.value)), \"float\")\n        if t is N.BoolLit:\n            return (\"1\" if e.value else \"0\", \"bool\")\n        if t is N.StrLit:\n            return (_cstr(e.value), \"string\")\n        if t is N.Identifier:\n            if e.name not in scope:\n                raise NativeUnsupported(\n                    f\"'{e.name}' is not a supported native value here \"\n                    f\"(only parameters, locals, and typed globals)\", e.line)\n            return (e.name, scope[e.name])\n        if t is N.UnaryOp:\n            code, ct = self._expr(e.operand, scope, sig)\n            if e.op == \"-\":\n                self._need_num(ct, e.line, \"negate\")\n                return (f\"(-{code})\", ct)\n            # not\n            self._need_bool(ct, e.line)\n            return (f\"(!{code})\", \"bool\")\n        if t is N.LogicalOp:\n            lc = self._bool(e.left, scope, sig)\n            rc = self._bool(e.right, scope, sig)\n            op = \"&&\" if e.op == \"and\" else \"||\"\n            return (f\"({lc} {op} {rc})\", \"bool\")\n        if t is N.BinaryOp:\n            return self._binary(e, scope, sig)\n        if t is N.Call:\n            return self._call(e, scope, sig, allow_void)\n        if t is N.ListLit:\n            return self._list_literal(e, scope, sig, None)\n        if t is N.MapLit:\n            return self. rted(\n                f\"{name}() expects 1 argument in native mode\", e.line)\n        ac, at = self._expr(e.args[0], scope, sig)\n        if name == \"len\":\n            if at == \"string\":\n                return (f\"((long long)strlen({ac}))\", \"int\")\n            if _list_base(at) is not None:\n                return (f\"({ac}->len)\", \"int\")\n            if _map_kv(at) is not None:\n                return (f\"({ac}->len)\", \"int\")\n            raise NativeUnsupported(\n                f\"native len() supports strings, lists and maps, got {at}\",\n                e.line)\n        # str(x): convert a scalar to its Sandy string form\n        if at == \"string\":\n            return (ac, \"string\")\n        if at == \"int\":\n            return (f\"sy_from_ll({ac})\", \"string\")\n        if at == \"float\":\n            return (f\"sy_from_double({ac})\", \"string\")\n        if at == \"bool\":\n            return (f\"(({ac}) ? \\\"true\\\" : \\\"false\\\")\", \"string\")\n        raise NativeUnsupported(f\"cannot str() a {at} in native mode\", e.line)\n\n    def _method_call(self, e, scope, sig):\n        method = e.callee.name\n        if method not in _STRING_METHODS:\n            raise NativeUnsupported(\n                f\"native mode supports string methods {sorted(_STRING_METHODS)}, \"\n                f\"not '.{method}()'\", e.line)\n        tc, tt = self._expr(e.callee.target, scope, sig)\n        if tt != \"string\":\n            raise NativeUnsupported(\n                f\"'.{method}()' is a string method, but the target is {tt}\",\n                e.line)\n        if e.args:\n            raise NativeUnsupported(\n                f\"native '.{method}()' takes no arguments\", e.line)\n        helper, rtype = _STRING_METHODS[method]\n        return (f\"{helper}({tc})\", rtype)\n\n    # -- helpers --\n    def _bool(self, expr, scope, sig):\n        code, t = self._expr(expr, scope, sig)\n        if t != \"bool\":\n            raise NativeUnsuppor urn f\"(strcmp({a}, {b}) == 0)\"\n        return f\"({a} == {b})\"\n\n    def _struct_helpers(self, name):\n        fields, ftypes = self.structs[name]\n        out = [f\"static void sy_print_{name}(SyStruct_{name}* v) {{\",\n               f'    fputs(\"{name}(\", stdout);']\n        for i, (fn, ft) in enumerate(zip(fields, ftypes)):\n            if i:\n                out.append('    fputs(\", \", stdout);')\n            out.append(f'    fputs(\"{fn}=\", stdout);')\n            out.append(\"    \" + self._field_repr(f\"v->{fn}\", ft))\n        out.append('    fputs(\")\", stdout);')\n        out.append(\"}\")\n        conds = \" && \".join(self._field_eq(f\"a->{fn}\", f\"b->{fn}\", ft)\n                            for fn, ft in zip(fields, ftypes)) or \"1\"\n        out.append(f\"static int sy_eq_{name}(SyStruct_{name}* a, \"\n                   f\"SyStruct_{name}* b) {{ return {conds}; }}\")\n        return \"\\n\".join(out) + \"\\n\"\n\n\ndef to_c(program):\n    return CBackend().compile(program)\n", "/sandy/cli.py": "\"\"\"Command-line entry point for Sandy.\n\nUsage:\n  sandy               start the interactive REPL\n  sandy <file.sy>     run a Sandy program\n  sandy run <file.sy> run a Sandy program (explicit)\n  sandy --version     print version\n  sandy --help        show this help\n\"\"\"\n\nimport sys\n\nfrom .runtime import run_file, build_file\nfrom .repl import repl\n\nVERSION = \"0.1.0\"\n\nHELP = \"\"\"Sandy — a small, friendly scripting language (.sy)\n\nusage:\n  sandy                 start the interactive REPL\n  sandy FILE.sy         run a Sandy program\n  sandy run FILE.sy     run a Sandy program (explicit)\n  sandy build FILE.sy   compile to a native executable (typed scalar core)\n  sandy check FILE.sy   type-check a program without running it\n  sandy fmt FILE.sy     format a program in place (--check to just verify)\n  sandy lsp             start the language server (stdio, for editors)\n  sandy --vm FILE.sy    run on the bytecode VM engine (experimental, faster)\n  sandy --no-check FILE.sy  skip the static type checker\n  sandy --version       print the version\n  sandy --help          show this help\n\"\"\"\n\n\ndef main(argv=None):\n    argv = list(sys.argv[1:] if argv is None else argv)\n\n    # Optional flags, anywhere in the arguments.\n    engine = \"walk\"\n    check_types = True\n    if \"--vm\" in argv:\n        argv.remove(\"--vm\")\n        engine = \"vm\"\n    if \"--walk\" in argv:\n        argv.remove(\"--walk\")\n        engine = \"walk\"\n    if \"--no-check\" in argv:\n        argv.remove(\"--no-check\")\n        check_types = False\n\n    if not argv:\n        repl()\n        return 0\n\n    first = argv[0]\n    if first in (\"-h\", \"--help\", \"help\"):\n        print(HELP)\n        return 0\n    if first in (\"-v\", \"--version\", \"version\"):\n        print(f\"Sandy {VERSION}\")\n        return 0\n    if first == \"build\":\n        files = [a for a in argv[1:] if not a.startswith(\"-\")]\n        if not files:\n            print(\"sandy: 'build' needs a file argument\", file=sys.stderr)\n            return 2\n        output = None\n        if \"-o\" in argv:\n            i = argv.index(\"-o\")\n            if i + 1 < len(argv):\n                output = argv[i + 1]\n                files = [f for f in files if f != output]\n        return build_file(files[0], output=output,\n                          run=\"--run\" in argv, emit_c=\"--emit-c\" in argv,\n                          gc=\"--gc\" in argv)\n    if first == \"lsp\":\n        from .lsp import main as lsp_main\n        return lsp_main()\n    if first == \"fmt\":\n        files = [a for a in argv[1:] if not a.startswith(\"-\")]\n        if not files:\n            print(\"sandy: 'fmt' needs a file argument\", file=sys.stderr)\n            return 2\n        return fmt_files(files, check=\"--check\" in argv)\n    if first == \"check\":\n        if len(argv) < 2:\n            print(\"sandy: 'check' needs a file argument\", file=sys.stderr)\n            return 2\n        return check_only(argv[1])\n    if first == \"run\":\n        if len(argv) < 2:\n            print(\"sandy: 'run' needs a file argument\", file=sys.stderr)\n            return 2\n        return run_file(argv[1], engine=engine, check_types=check_types)\n\n    # Otherwise treat the first argument as a filename.\n    return run_file(first, engine=engine, check_types=check_types)\n\n\ndef fmt_files(paths, check=False):\n    \"\"\"Format each file in place, or with --check verify they are formatted.\"\"\"\n    from .formatter import format_source\n    from .errors import SandyError\n    rc = 0\n    for path in paths:\n        try:\n            with open(path, \"r\", encoding=\"utf-8\") as f:\n                source = f.read()\n        except OSError as e:\n            print(f\"sandy: cannot open {path}: {e.strerror}\", file=sys.stderr)\n            rc = 1\n            continue\n        try:\n            formatted = format_source(source)\n        except SandyError as e:\n            print(f\"{path}: {e.format('SyntaxError')}\", file=sys.stderr)\n            rc = 1\n            continue\n        if check:\n            if formatted != source:\n                print(f\"{path}: not formatted\")\n                rc = 1\n        elif formatted != source:\n            with open(path, \"w\", encoding=\"utf-8\") as f:\n                f.write(formatted)\n            print(f\"formatted {path}\")\n    return rc\n\n\ndef check_only(path):\n    \"\"\"Type-check a file and report, without running it.\"\"\"\n    from .runtime import type_check_source\n    from .errors import SandyError\n    try:\n        with open(path, \"r\", encoding=\"utf-8\") as f:\n            source = f.read()\n    except OSError as e:\n        print(f\"sandy: cannot open {path}: {e.strerror}\", file=sys.stderr)\n        return 1\n    try:\n        import os\n        errors = type_check_source(\n            source, base_dir=os.path.dirname(os.path.abspath(path)))\n    except SandyError as e:\n        print(f\"{path}: {e.format('SyntaxError')}\", file=sys.stderr)\n        return 1\n    if not errors:\n        print(f\"{path}: no type errors ✓\")\n        return 0\n    from .runtime import _report_type_errors\n    _report_type_errors(errors, path, source)\n    return 1\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "/sandy/compiler.py": "\"\"\"Compile a Sandy AST into bytecode CodeObjects for the VM.\"\"\"\n\nfrom .errors import ParseError\nfrom .values import StructType\nfrom . import nodes as N\nfrom . import bytecode as B\n\n\nclass _Loop:\n    \"\"\"Tracks jump targets for break/continue while compiling a loop.\"\"\"\n    __slots__ = (\"kind\", \"continue_target\", \"break_sites\", \"try_depth\")\n\n    def __init__(self, kind, continue_target, try_depth):\n        self.kind = kind                 # \"while\" or \"for\"\n        self.continue_target = continue_target\n        self.break_sites = []            # indices of JUMP ops to patch to end\n        self.try_depth = try_depth       # open try-handlers when the loop began\n\n\n# Arithmetic operators whose result is numeric when both operands are.\n_ARITH = {\"+\", \"-\", \"*\", \"/\", \"%\", \"**\"}\n\n# Generic op -> type-specialized (numeric) op.\n_NUMERIC_FAST = {\n    B.BINARY_ADD: B.BINARY_ADD_NUM,\n    B.BINARY_SUB: B.BINARY_SUB_NUM,\n    B.BINARY_MUL: B.BINARY_MUL_NUM,\n    B.CMP_LT: B.CMP_LT_NUM,\n    B.CMP_GT: B.CMP_GT_NUM,\n    B.CMP_LE: B.CMP_LE_NUM,\n    B.CMP_GE: B.CMP_GE_NUM,\n}\n\n\nclass Compiler:\n    def __init__(self, name=\"<main>\", params=(), param_types=None, numeric=None):\n        self.name = name\n        self.params = list(params)\n        self.param_types = list(param_types) if param_types is not None else [None] * len(params)\n        self.numeric = numeric or set()  # names proven to hold numbers\n        self.ops = []\n        self.lines = []\n        self.consts = []\n        self.loops = []\n        self.try_depth = 0   # op == \"-\" and self._numeric(node.operand)\n        return False\n\n    def _binary_opcode(self, op, left, right):\n        base = B.BINARY_OPS[op]\n        if self._numeric(left) and self._numeric(right):\n            return _NUMERIC_FAST.get(base, base)\n        return base\n\n    def _compile_block(self, block):\n        for stmt in block.statements:\n            self._compile_stmt(stmt)\n\n    # -- statements --\n    def _compile_stmt(self, node):\n        m = self._STMT.get(type(node))\n        if m is None:\n            raise ParseError(\n                f\"cannot compile {type(node).__name__}\", getattr(node, \"line\", None))\n        m(self, node)\n\n    def _c_expr_stmt(self, node):\n        self._compile_expr(node.expr)\n        self._emit(B.POP, None, node.line)\n\n    def _c_assign(self, node):\n        target = node.target\n        if isinstance(target, N.Identifier):\n            if node.op == \"=\":\n                self._compile_expr(node.value)\n            else:\n                self._emit(B.LOAD_NAME, target.name, node.line)\n                self._compile_expr(node.value)\n                self._emit(self._binary_opcode(node.op[0], target, node.value),\n                           None, node.line)\n            self._emit(B.STORE_NAME, target.name, node.line)\n        elif isinstance(target, N.Index):\n            if node.op == \"=\":\n                self._compile_expr(target.target)\n                self._compile_expr(target.index)\n                self._compile_expr(node.value)\n            else:\n                self._compile_expr(target.target)\n                self._compile_expr(target.index)\n                self._emit(B.DUP_TWO, None, node.line)\n                self._emit(B.INDEX_GET, None, node.line)\n                self._compile_expr(node.value)\n                self._emit(B.BINARY_OPS[node.op[0]], None, node.line)\n            self._emit(B.INDEX_SET, None, node.line)\n        elif isinstance(target, N.Attribute):\n            if node.op == \"=\":\n                self._compile_expr(target.target)\n                self._compile_expr(node.value)\n            else:\n                self._compile_expr(target.target)\n                self._emit(B.DUP_TOP, None, node.line)\n                self._emit(B.GET_ATTR, target.name, node.line)\n                self._compile_expr(node.value)\n                self._emit(B.BINARY_OPS[node.op[0]], None, node.line)\n            self._emit(B.SET_ATTR, target.name, node.line)\n        else:\n            raise ParseError(\"invalid assignment target\", node.line)\n\n    def _c_if(self, node):\n        end_sites = []\n        for cond, block in node.branches:\n            self._compile_expr(cond)\n            skip = self._emit_jump(B.JUMP_IF_FALSE, node.line)\n            self._compile_block(block)\n            end_sites.append(self._emit_jump(B.JUMP, node.line))\n            self._patch(skip, self._here())\n        if node.else_block is not None:\n            self._compile_block(node.else_block)\n        for s in end_sites:\n            self._patch(s, self._here())\n\n    def _c_while(self, node):\n        start = self._here()\n        self._compile_expr(node.cond)\n        exit_jump = self._emit_jump(B.JUMP_IF_FALSE, node.line)\n        loop = _Loop(\"while\", start, self.try_depth)\n        self.loops.append(loop)\n        self._compile_block(node.body)\n        self.loops.pop()\n        self._emit(B.JUMP, start, node.line)\n        end = self._here()\n        self._patch(exit_jump, end)\n        for site in loop.break_sites:\n            self._patch(site, end)\n\n    def _c_for(self, node):\n        self._compile_expr(node.iterable)\n        self._emit(B.GET_ITER, None, node.line)\n        iter_ip = self._here()\n        for_iter = self._emit_jump(B.FOR_ITER, node.line)\n        self._emit(B.DEFINE_NAME, node.var, node.line)\n        loop = _Loop(\"for\", iter_ip, self.try_depth)\n        self.loops.append(loop)\n        self._compile_block(node.body)\n        self.loops.pop()\n        self._emit(B.JUMP, iter_ip, node.line)\n        end = self._here()\n        self._patch(for_iter, end)\n        for site in loop.break_sites:\n            self._patch(site, end)\n\n    def _c_funcdef(self, node):\n        code = _compile_function(node)\n        self._emit(B.MAKE_FUNCTION, self._const(code), node.line)\n        self._emit(B.DEFINE_NAME, node.name, node.line)\n\n    def _c_return(self, node):\n        if node.value is None:\n            self._emit(B.LOAD_CONST, self._const(None), node.line)\n        else:\n            self._compile_expr(node.value)\n        # Leaving the function unwinds every open try-handler in it.\n        for _ in range(self.try_depth):\n            self._emit(B.POP_TRY, None, node.line)\n        self._emit(B.RETURN, None, node.line)\n\n    def _c_break(self, node):\n        if not self.loops:\n            raise ParseError(\"'break' outside a loop\", node.line)\n        loop = self.loops[-1]\n        for _ in range(self.try_depth - loop.try_depth):\n            self._emit(B.POP_TRY, None, node.line)\n        if loop.kind == \"for\":\n            self._emit(B.POP, None, node.line)  # discard the iterator\n        loop.break_sites.append(self._emit_jump(B.JUMP, node.line))\n\n    def _c_continue(self, node):\n        if not self.loops:\n            raise ParseError(\"'continue' outside a loop\", node.line)\n        loop = self.loops[-1]\n        for _ in range(self.try_depth - loop.try_depth):\n            self._emit(B.POP_TRY, None, node.line)\n        self._emit(B.JUMP, loop.continue_target, node.line)\n\n    def _c_try(self, node):\n        setup = self._emit_jump(B.SETUP_TRY, node.line)   # arg patched to handler\n        self.try_depth += 1\n        self._compile_block(node.body)\n        self.try_depth -= 1\n        self._emit(B.POP_TRY, None, node.line)            # body ran cleanly\n        skip = self._emit_jump(B.JUMP, node.line)         # skip the handler\n        self._patch(setup, self._here())                  # handler starts here\n        # On entry the VM has pushed the error message; bind it to the catch var.\n        self._emit(B.DEFINE_NAME, node.catch_var, node.line)\n        self._compile_block(node.handler)\n        self._patch(skip, self._here())\n\n    def _c_throw(self, node):\n        self._compile_expr(node.value)\n        self._emit(B.THROW, None, node.line)\n\n    def _c_structdef(self, node):\n        # A struct type is an immutable value; bake it into the constants pool.\n        st = StructType(node.name, node.fields, node.field_types)\n        self._emit(B.LOAD_CONST, self._const(st), node.line)\n        self._emit(B.DEFINE_NAME, node.name, node.line)\n\n    def _c_import(self, node):\n        self._emit(B.IMPORT, node.path, node.line)   # pushes the Module\n        self._emit(B.DEFINE_NAME, node.alias, node.line)\n\n    # -- expressions --\n    def _compile_expr(self, node):\n        m = self._EXPR.get(type(node))\n        if m is None:\n            raise ParseError(\n                f\"cannot compile {type(node).__name__}\", getattr(node, \"line\", None))\n        m(self, node)\n\n    def _c_const(self, node):\n        self._emit(B.LOAD_CONST, self._const(node.value), node.line)\n\n    def _c_nil(self, node):\n        self._emit(B.LOAD_CONST, self._const(None), node.line)\n\n    def _c_interp(self, node):\n        for kind, payload in node.parts:\n            if kind == \"lit\":\n                self._emit(B.LOAD_CONST, self._const(payload), node.line)\n            else:\n                self._compile_expr(payload)\n                self._emit(B.STR_COERCE, None, node.line)\n        self._emit(B.BUILD_INTERP, len(node.parts), node.line)\n\n    def _c_list(self, node):\n        for item in node.items:\n            self._compile_expr(item)\n        self._emit(B.BUILD_LIST, len(node.items), node.line)\n\n    def _c_map(self, node):\n        for key, value in node.pairs:\n            self._compile_expr(key)\n            self._compile_expr(value)\n        self._emit(B.BUILD_MAP, len(node.pairs), node.line)\n\n    def _c_identifier(self, node):\n        self._emit(B.LOAD_NAME, node.name, node.line)\n\n    def _c_binary(self, node):\n        self._compile_expr(node.left)\n        self._compile_expr(node.right)\n        self._emit(self._binary_opcode(node.op, node.left, node.right),\n                   None, node.line)\n\n    def _c_unary(self, node):\n        self._compile_expr(node.operand)\n        self._emit(B.UNARY_NOT if node.op == \"not\" else B.UNARY_NEG, None, node.line)\n\n    def _c_logical(self, node):\n        self._compile_expr(node.left)\n        if node.op == \"and\":\n            jump = self._emit_jump(B.JUMP_IF_FALSE_OR_POP, node.line)\n        else:\n            jump = self._emit_jump(B.JUMP_IF_TRUE_OR_POP, node.line)\n        self._compile_expr(node.right)\n        self._patch(jump, self._here())\n\n    def _c_call(self, node):\n        self._compile_expr(node.callee)\n        for arg in node.args:\n            self._compile_expr(arg)\n        self._emit(B.CALL, len(node.args), node.line)\n\n    def _c_index(self, node):\n        self._compile_expr(node.target)\n        self._compile_expr(node.index)\n        self._emit(B.INDEX_GET, None, node.line)\n\n    def _c_attribute(self, node):\n        self._compile_expr(node.target)\n        self._emit(B.GET_ATTR, node.name, node.line)\n\n\ndef _compile_function(node):\n    numeric = analyze_numeric(node.params, node.param_types, node.body)\n    c = Compiler(node.name, node.params, node.param_types, numeric)\n    c._compile_block(node.body)\n    # implicit `return nil` if control falls off the end\n    c._emit(B.LOAD_CONST, c._const(None), node.line)\n    c._emit(B.RETURN, None, node.line)\n    return c._code()\n\n\n# ---- numeric-locals analysis (sound across loops via a fixpoint) ----\n\ndef _numeric_under(node, names):\n    t = type(node)\n    if t is N.IntLit or t is N.FloatLit:\n        return True\n    if t is N.Identifier:\n        return
