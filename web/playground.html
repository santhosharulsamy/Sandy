s}\n    names = (numeric_params | assigned) - forvars\n    changed = True\n    while changed:\n        changed = False\n        for a in assigns:\n            name = a.target.name\n            if name in names and not _numeric_under(a.value, names):\n                names.discard(name)\n                changed = True\n    return names\n\n\nCompiler._STMT = {\n    N.ExprStmt: Compiler._c_expr_stmt,\n    N.Assign: Compiler._c_assign,\n    N.If: Compiler._c_if,\n    N.While: Compiler._c_while,\n    N.For: Compiler._c_for,\n    N.FuncDef: Compiler._c_funcdef,\n    N.Return: Compiler._c_return,\n    N.Break: Compiler._c_break,\n    N.Continue: Compiler._c_continue,\n    N.Try: Compiler._c_try,\n    N.Throw: Compiler._c_throw,\n    N.StructDef: Compiler._c_structdef,\n    N.Import: Compiler._c_import,\n}\n\nCompiler._EXPR = {\n    N.IntLit: Compiler._c_const,\n    N.FloatLit: Compiler._c_const,\n    N.StrLit: Compiler._c_const,\n    N.BoolLit: Compiler._c_const,\n    N.NilLit: Compiler._c_nil,\n    N.InterpStr: Compiler._c_interp,\n    N.ListLit: Compiler._c_list,\n    N.MapLit: Compiler._c_map,\n    N.Identifier: Compiler._c_identifier,\n    N.BinaryOp: Compiler._c_binary,\n    N.UnaryOp: Compiler._c_unary,\n    N.LogicalOp: Compiler._c_logical,\n    N.Call: Compiler._c_call,\n    N.Index: Compiler._c_index,\n    N.Attribute: Compiler._c_attribute,\n}\n\n\ndef compile_program(program):\n    return Compiler().compile_program(program)\n", "/sandy/errors.py": "\"\"\"Error types for the Sandy language.\n\nEvery user-facing error carries a line number so we can point at the\noffending source line with a friendly message.\n\"\"\"\n\n\nclass SandyError(Exception):\n    \"\"\"Base class for all Sandy errors (lexing, parsing, runtime).\"\"\"\n\n    def __init__(self, message, line=None, col=None):\n        self.message = message\n        self.line = line\n        self.col = col  # 1-based column, when known (enables a source caret)\n        super().__init__(message)\n\n    def format(self, kind):\n        where = f\" (line {self.line})\" if self.line is not None else \"\"\n        return f\"{kind}{where}: {self.message}\"\n\n\nclass LexError(SandyError):\n    def format(self, kind=\"SyntaxError\"):\n        return super().format(kind)\n\n\nclass ParseError(SandyError):\n    def format(self, kind=\"SyntaxError\"):\n        return super().format(kind)\n\n\nclass RuntimeErrorSandy(SandyError):\n    def format(self, kind=\"RuntimeError\"):\n        return super().format(kind)\n\n\nclass TypeCheckError(SandyError):\n    def format(self, kind=\"TypeError\"):\n        return super().format(kind)\n", "/sandy/formatter.py": "\"\"\"Canonical source formatter for Sandy (`sandy fmt`).\n\nRe-emits a program in a single canonical style by pretty-printing the AST.\nComments and blank lines between statements are preserved by consulting a\nline -> comment map from the lexer and the `end_line` recorded on blocks.\n\"\"\"\n\nfrom . import nodes as N\nfrom .lexer import tokenize, scan_comments\nfrom .parser import parse\n\nINDENT = \"    \"\n\n_ASSIGN_OPS = {\"=\", \"+=\", \"-=\", \"*=\", \"/=\"}\n\n\ndef _prec(node):\n    \"\"\"Expression precedence (higher binds tighter), matching the parser.\"\"\"\n    t = type(node)\n    if t is N.LogicalOp:\n        return 1 if node.op == \"or\" else 2\n    if t is N.UnaryOp:\n        # `not` sits below comparison; arithmetic `-` sits between `*` and `**`\n        # (so `-x ** 2` parses as `-(x ** 2)`), matching the parser.\n        return 3 if node.op == \"not\" else 7\n    if t is N.BinaryOp:\n        op = node.op\n        if op in (\"==\", \"!=\", \"<\", \">\", \"<=\", \">=\"):\n            return 4\n        if op in (\"+\", \"-\"):\n            return 5\n        if op in (\"*\", \"/\", \"%\"):\n            return 6\n        return 8  # ** (right-associative, tighter than unary minus)\n    if t in (N.Call, N.Index, N.Attribute):\n        return 9\n    return 10\n\n\ndef format_source(source):\n    \"\"\"Return the canonically formatted form of Sandy source text.\"\"\"\n    program = parse(tokenize(source))\n    return Formatter(source).format(program)\n\n\nclass Formatter:\n    def __init__(self, source):\n        self.comments = scan_comments(source)\n        self.blanks = {i + 1 for i, line in enumerate(source.splitlines())\n                       if line.strip() == \"\"}\n        self.total = len(source.splitlines())\n        self.out = []\n        self.cursor = 1   # next unconsumed source line\n\n    def format(self, program):\n        self._emit_body(program, 0)\n        self._emit_gap(self.total + 1, 0)\n        return \"\\n\".join(self.out).rstrip(\"\\n\") + \"\\n\"\n\n    # -- comment / blank preservation --\n    def _blank(self):\n        if self.out and self.out[-1] != \"\" \\\n                and not self.out[-1].rstrip().endswith(\"{\"):\n            self.out.append(\"\")\n\n    def _emit_gap(self, target_line, indent):\n        \"\"\"Emit standalone comments and collapsed blank lines for the source\n        lines in [cursor, target_line).\"\"\"\n        pad = INDENT * indent\n        pending_blank = False\n        for line in range(self.cursor, target_line):\n            if line in self.comments:\n                if pending_blank:\n                    self._blank()\n                self.out.append(pad + self.comments[line])\n                pending_blank = False\n            elif line in self.blanks:\n                pending_blank = True\n        if pending_blank:\n            self._blank()\n        if target_line > self.cursor:\n            self.cursor = target_line\n\n    def _header(self, text, indent, line):\n        s = INDENT * indent + text\n        if line in self.comments:      # trailing comment on the header line\n            s += \"  \" + self.comments[line]\n        self.out.append(s)\n        self.cursor = line + 1\n\n    # -- statements --\n    def _emit_body(self, block, indent):\n        for stmt in block.statements:\n            self._emit_gap(stmt.line, indent)\n            self._emit_stmt(stmt, indent)\n\n    def _emit_stmt(self, node, indent):\n        t = type(node)\n        handler = self._STMT.get(t)\n        if handler is not None:\n            handler(self, node, indent)\n        else:\n            self._line(self._simple_text(node), indent, node.line)\n\n    def _line(self, text, indent, line):\n        s = INDENT * indent + text\n        if line in self.comments:\n            s += \"  \" + self.comments[line]\n        self.out.append(s)\n        self.cursor = line + 1\n\n    def _simple_text(self, node):\n        t = type(node)\n        if t is N.ExprStmt:\n            return self._expr(node.expr, 0)\n        if t is N.Assign:\n            return self._assign_text(node)\n        if t is N.Return:\n            return \"return\" if node.value is None else \"return \" + self._expr(node.value, 0)\n        if t is N.Break:\n            return \"break\"\n        if t is N.Continue:\n            return \"continue\"\n        if t is N.Throw:\n            return \"throw \" + self._expr(node.value, 0)\n        if t is N.Import:\n            return f'import \"{node.path}\" as {node.alias}'\n        return \"?\"\n\n    def _assign_text(self, node):\n        target = self._expr(node.target, 9)\n        if node.annotation is not None:\n            return f\"{target}: {node.annotation} = {self._expr(node.value, 0)}\"\n        return f\"{target} {node.op} {self._expr(node.value, 0)}\"\n\n    def _emit_if(self, node, indent):\n        for i, (cond, block) in enumerate(node.branches):\n            head = (\"if \" if i == 0 else \"} elif \") + self._expr(cond, 0) + \" {\"\n            if i == 0:\n                self._header(head, indent, node.line)\n            else:\n                self.out.append(INDENT * indent + head)\n            self._emit_body(block, indent + 1)\n            self._emit_gap(block.end_line, indent + 1)\n            self.cursor = block.end_line + 1\n        if node.else_block is not None:\n            self.out.append(INDENT * indent + \"} else {\")\n            self._emit_body(node.else_block, indent + 1)\n            self._emit_gap(node.else_block.end_line, indent + 1)\n            self.out.append(INDENT * indent + \"}\")\n            self.cursor = node.else_block.end_line + 1\n        else:\n            self.out.append(INDENT * indent + \"}\")\n\n    def _emit_braced(self, header, block, indent, node_line):\n        self._header(header, indent, node_line)\n        self._emit_body(block, indent + 1)\n        self._emit_gap(block.end_line, indent + 1)\n        self.out.append(INDENT * indent + \"}\")\n        self.cursor = block.end_line + 1\n\n    def _emit_while(self, node, indent):\n        self._emit_braced(\"while \" + self._expr(node.cond, 0) + \" {\",\n                          node.body, indent, node.line)\n\n    def _emit_for(self, node, indent):\n        self._emit_braced(\n            f\"for {node.var} in \" + self._expr(node.iterable, 0) + \" {\",\n            node.body, indent, node.line)\n\n    def _emit_funcdef(self, node, indent):\n        params = []\n        for name, ann in zip(node.params, node.param_types):\n            params.append(f\"{name}: {ann}\" if ann is not None else name)\n        head = f\"fn {node.name}(\" + \", \".join(params) + \")\"\n        if node.ret_type is not None:\n            head += f\" -> {node.ret_type}\"\n        self._emit_braced(head + \" {\", node.body, indent, node.line)\n\n    def _emit_try(self, node, indent):\n        self._header(\"try {\", indent, node.line)\n        self._emit_body(node.body, indent + 1)\n        self._emit_gap(node.body.end_line, indent + 1)\n        self.out.append(INDENT * indent + \"} catch \" + node.catch_var + \" {\")\n        self.cursor = node.body.end_line + 1\n        self._emit_body(node.handler, indent + 1)\n        self._emit_gap(node.handler.end_line, indent + 1)\n        self.out.append(INDENT * indent + \"}\")\n        self.cursor = node.handler.end_line + 1\n\n    def _emit_structdef(self, node, indent):\n        self._header(f\"struct {node.name} {{\", indent, node.line)\n        for name, ann in zip(node.fields, node.field_types):\n            field = f\"{name}: {ann}\" if ann is not None else name\n            self.out.append(INDENT * (indent + 1) + field)\n        self.out.append(INDENT * indent + \"}\")\n        if node.end_line is not None:\n            self.cursor = node.end_line + 1\n\n    # -- expressions --\n    def _expr(self, node, min_prec):\n        s = self._fmt(node)\n        return f\"({s})\" if _prec(node) < min_prec else s\n\n    def _fmt(self, node):\n        t = type(node)\n        if t is N.IntLit:\n            return str(node.value)\n        if t is N.FloatLit:\n            return repr(node.value)\n        if t is N.StrLit:\n            return self._string(node.value)\n        if t is N.BoolLit:\n            return \"true\" if node.value else \"false\"\n        if t is N.NilLit:\n            return \"nil\"\n        if t is N.InterpStr:\n            return self._interp(node)\n        if t is N.ListLit:\n            return \"[\" + \", \".join(self._expr(i, 0) for i in node.items) + \"]\"\n        if t is N.MapLit:\n            inner = \", \".join(f\"{self._expr(k, 0)}: {self._expr(v, 0)}\"\n                              for k, v in node.pairs)\n            return \"{\" + inner + \"}\"\n        if t is N.Identifier:\n            return node.name\n        if t is N.BinaryOp:\n            if node.op == \"**\":\n                # left operand is parsed at postfix level; right at unary level\n                left = self._expr(node.left, 9)\n                right = self._expr(node.right, 7)\n            else:\n                p = _prec(node)\n                left, right = self._expr(node.left, p), self._expr(node.right, p + 1)\n            return f\"{left} {node.op} {right}\"\n        if t is N.LogicalOp:\n            p = _prec(node)\n            return f\"{self._expr(node.left, p)} {node.op} {self._expr(node.right, p + 1)}\"\n        if t is N.UnaryOp:\n            if node.op == \"not\":\n                return \"not \" + self._expr(node.operand, 3)\n            return \"-\" + self._expr(node.operand, 7)\n        if t is N.Call:\n            args = \", \".join(self._expr(a, 0) for a in node.args)\n            return f\"{self._expr(node.callee, 9)}({args})\"\n        if t is N.Index:\n            return f\"{self._expr(node.target, 9)}[{self._expr(node.index, 0)}]\"\n        if t is N.Attribute:\n            return f\"{self._expr(node.target, 9)}.{node.name}\"\n        return \"?\"\n\n    def _string(self, value):\n        return '\"' + _escape(value, quote_only=True) + '\"'\n\n    def _interp(self, node):\n        out = ['\"']\n        for kind, payload in node.parts:\n            if kind == \"lit\":\n                out.append(_escape(payload, quote_only=False))\n            else:\n                out.append(\"{\" + self._expr(payload, 0) + \"}\")\n        out.append('\"')\n        return \"\".join(out)\n\n\ndef _escape(text, quote_only):\n    out = []\n    for ch in text:\n        if ch == \"\\\\\":\n            out.append(\"\\\\\\\\\")\n        elif ch == '\"':\n            out.append('\\\\\"')\n        elif ch == \"\\n\":\n            out.append(\"\\\\n\")\n        elif ch == \"\\t\":\n            out.append(\"\\\\t\")\n        elif ch == \"\\r\":\n            out.append(\"\\\\r\")\n        elif not quote_only and ch == \"{\":\n            out.append(\"{{\")\n        elif not quote_only and ch == \"}\":\n            out.append(\"}}\")\n        else:\n            out.append(ch)\n    return \"\".join(out)\n\n\nFormatter._STMT = {\n    N.If: Formatter._emit_if,\n    N.While: Formatter._emit_while,\n    N.For: Formatter._emit_for,\n    N.FuncDef: Formatter._emit_funcdef,\n    N.Try: Formatter._emit_try,\n    N.StructDef: Formatter._emit_structdef,\n}\n", "/sandy/interpreter.py": "\"\"\"Tree-walking evaluator for Sandy.\"\"\"\n\nimport os\n\nfrom .errors import RuntimeErrorSandy\nfrom . import nodes as N\nfrom .values import (\n    Function, BuiltinFunction, StructType, StructInstance, Module,\n    is_truthy, type_name, to_str,\n)\nfrom .builtins import make_builtins\nfrom .suggest import closest_name\n\n# Sentinel marking a module that is mid-load (used to detect circular imports).\n_LOADING = object()\n\n\n# -- control-flow signals (not user errors) --\nclass _Return(Exception):\n    def __init__(self, value):\n        self.value = value\n\n\nclass _Break(Exception):\n    pass\n\n\nclass _Continue(Exception):\n    pass\n\n\nclass Environment:\n    __slots__ = (\"vars\", \"parent\")\n\n    def __init__(self, parent=None):\n        self.vars = {}\n        self.parent = parent\n\n    def get(self, name, line):\n        env = self\n        while env is not None:\n            if name in env.vars:\n                return env.vars[name]\n            env = env.parent\n        msg = f\"undefined variable '{name}'\"\n        guess = closest_name(name, self._all_names())\n        if guess is not None:\n            msg += f\" (did you mean '{guess}'?)\"\n        raise RuntimeErrorSandy(msg, line)\n\n    def _all_names(self):\n        names = set()\n        env = self\n        while env is not None:\n            names.update(env.vars.keys())\n            env = env.parent\n        return names\n\n    def assign(self, name, value):\n        # Update the nearest existing binding; otherwise define here.\n        env = self\n        while env is not None:\n            if name in env.vars:\n                env.vars[name] = value\n                return\n            env = env.parent\n        self.vars[name] = value\n\n    def define(self, name, value):\n        self.vars[name] = value\n\n\nclass Interpreter:\n    def __init__(self, out=None):\n        self.globals = Environment()\n        for name, fn in make_builtins(self).items():\n            self.globals.define(name, fn)\n        self._builtin_names = set(self.globals.vars)  # to filter module exports\n        self.out = out  # optional writer override for print (tests)\n        self.base_dir = None       # directory for resolving relative imports\n        self.module_cache = {}     # abspath -> Module (shared across imports)\n        self.module_loader = None  # engine-specific runner for imported files\n\n    def user_names(self):\n        \"\"\"Top-level names defined by user code (excludes builtins).\"\"\"\n        return [k for k in self.globals.vars if k not in self._builtin_names]\n\n    # -- public API --\n    def run(self, program):\n        self._exec_block(program, self.globals)\n\n    # -- statement execution --\n    def _exec_block(self, block, env):\n        for stmt in block.statements:\n            self._exec(stmt, env)\n\n    def _exec(self, node, env):\n        method = self._STMT_DISPATCH.get(type(node))\n        if method is None:\n            # expression used as a statement path handled below\n            raise RuntimeErrorSandy(\n                f\"cannot execute node {type(node).__name__}\", getattr(node, \"line\", None))\n        return method(self, node, env)\n\n    def _exec_expr_stmt(self, node, env):\n        self._eval(node.expr, env)\n\n    def _exec_assign(self, node, env):\n        value = self._eval(node.value, env)\n        target = node.target\n        if isinstance(target, N.Identifier):\n            if node.op != \"=\":\n                current = env.get(target.name, node.line)\n                value = self._apply_compound(node.op, current, value, node.line)\n            env.assign(target.name, value)\n        elif isinstance(target, N.Index):\n            container = self._eval(target.target, env)\n            key = self._eval(target.index, env)\n            if node.op != \"=\":\n                current = self._index_get(container, key, node.line)\n                value = self._apply_compound(node.op, current, value, node.line)\n            self._index_set(container, key, value, node.line)\n        elif isinstance(target, N.Attribute):\n            obj = self._eval(target.target, env)\n            if node.op != \"=\":\n                current = self._get_field(obj, target.name, node.line)\n                value = self._apply_compound(node.op, current, value, node.line)\n            self._set_field(obj, target.name, value, node.line)\n        else:\n            raise RuntimeErrorSandy(\"invalid assignment target\", node.line)\n\n    def _get_field(self, obj, name, line):\n        if isinstance(obj, StructInstance):\n            if name not in obj.values:\n                raise RuntimeErrorSandy(\n                    f\"{obj.struct.name} has no field '{name}'\", line)\n            return obj.values[name]\n        raise RuntimeErrorSandy(\n            f\"cannot read field '{name}' of a {type_name(obj)}\", line)\n\n    def _set_field(self, obj, name, value, line):\n        if isinstance(obj, StructInstance):\n            if name not in obj.values:\n                raise RuntimeErrorSandy(\n                    f\"{obj.struct.name} has no field '{name}'\", line)\n            obj.values[name] = value\n            return\n        raise RuntimeErrorSandy(\n            f\"cannot set field '{name}' on a {type_name(obj)}\", line)\n\n    def _apply_compound(self, op, current, value, line):\n        return self._binary(op[0], current, value, line)\n\n    def _exec_if(self, node, env):\n        # Sandy uses function-level scoping: blocks share the enclosing\n        # scope rather than creating a new one (like Python/JS locals).\n        for cond, block in node.branches:\n            if is_truthy(self._eval(cond, env)):\n                self._exec_block(block, env)\n                return\n        if node.else_block is not None:\n            self._exec_block(node.else_block, env)\n\n    def _exec_while(self, node, env):\n        while is_truthy(self._eval(node.cond, env)):\n            try:\n                self._exec_block(node.body, env)\n            except _Break:\n                break\n            except _Continue:\n                continue\n\n    def _exec_for(self, node, env):\n        iterable = self._eval(node.iterable, env)\n        items = self._as_iterable(iterable, node.line)\n        for item in items:\n            env.define(node.var, item)\n            try:\n                self._exec_block(node.body, env)\n            except _Break:\n                break\n            except _Continue:\n                continue\n\n    def _exec_funcdef(self, node, env):\n        fn = Function(node.name, node.params, node.body, env, node.param_types)\n        env.define(node.name, fn)\n\n    def _exec_return(self, node, env):\n        value = None if node.value is None else self._eval(node.value, env)\n        raise _Return(value)\n\n    def _exec_break(self, node, env):\n        raise _Break()\n\n    def _exec_continue(self, node, env):\n        raise _Continue()\n\n    def _exec_try(self, node, env):\n        try:\n            self._exec_block(node.body, env)\n        except RuntimeErrorSandy as e:\n            # Bind the error message to the catch variable and run the handler.\n            # Control-flow signals (_Return/_Break/_Continue) are not caught.\n            env.define(node.catch_var, e.message)\n            self._exec_block(node.handler, env)\n\n    def _exec_throw(self, node, env):\n        value = self._eval(node.value, env)\n        raise RuntimeErrorSandy(to_str(value), node.line)\n\n    def _exec_structdef(self, node, env):\n        env.define(node.name,\n                   StructType(node.name, node.fields, node.field_types))\n\n    def _exec_import(self, node, env):\n        abspath = self._resolve_import(node.path, node.line)\n        env.define(node.alias, self._load_module(abspath, node.line))\n\n    def _resolve_import(self, path, line):\n        rel = path if path.endswith(\".sy\") else path + \".sy\"\n        base = self.base_dir or os.getcwd()\n        candidate = os.path.abspath(os.path.join(base, rel))\n        if os.path.exists amespace:\n                return obj.namespace[name]\n            raise RuntimeErrorSandy(\n                f\"module '{obj.name}' has no member '{name}'\", line)\n        from .builtins import resolve_method\n        return resolve_method(self, obj, name, line)\n\n    # -- expression evaluation --\n    def _eval(self, node, env):\n        method = self._EXPR_DISPATCH.get(type(node))\n        if method is None:\n            raise RuntimeErrorSandy(\n                f\"cannot evaluate node {type(node).__name__}\", getattr(node, \"line\", None))\n        return method(self, node, env)\n\n    def _eval_int(self, node, env):\n        return node.value\n\n    def _eval_float(self, node, env):\n        return node.value\n\n    def _eval_str(self, node, env):\n        return node.value\n\n    def _eval_interp(self, node, env):\n        out = []\n        for kind, payload in node.parts:\n            if kind == \"lit\":\n                out.append(payload)\n            else:\n                out.append(to_str(self._eval(payload, env)))\n        return \"\".join(out)\n\n    def _eval_bool(self, node, env):\n        return node.value\n\n    def _eval_nil(self, node, env):\n        return None\n\n    def _eval_list(self, node, env):\n        return [self._eval(item, env) for item in node.items]\n\n    def _eval_map(self, node, env):\n        result = {}\n        for key_node, val_node in node.pairs:\n            key = self._eval(key_node, env)\n            if isinstance(key, (list, dict)):\n                raise RuntimeErrorSandy(\n                    f\"map key cannot be a {type_name(key)}\", node.line)\n            result[key] = self._eval(val_node, env)\n        return result\n\n    def _eval_identifier(self, node, env):\n        return env.get(node.name, node.line)\n\n    def _eval_binary(self, node, env):\n        left = self._eval(node.left, env)\n        right = self._eval(node.right, env)\n        return self._binary(node.op, left, right, node.line)\n\n    def _eval_un eft, right, \"subtract\", line)\n            return left - right\n        if op == \"*\":\n            if isinstance(left, str) and self._is_int(right):\n                return left * right\n            if isinstance(right, str) and self._is_int(left):\n                return right * left\n            if isinstance(left, list) and self._is_int(right):\n                return left * right\n            if isinstance(right, list) and self._is_int(left):\n                return right * left\n            self._need_num(left, right, \"multiply\", line)\n            return left * right\n        if op == \"/\":\n            self._need_num(left, right, \"divide\", line)\n            if right == 0:\n                raise RuntimeErrorSandy(\"division by zero\", line)\n            return left / right\n        if op == \"%\":\n            self._need_num(left, right, \"take modulo of\", line)\n            if right == 0:\n                raise RuntimeErrorSandy(\"modulo by zero\", line)\n            return left % right\n        if op == \"**\":\n            self._need_num(left, right, \"raise to a power\", line)\n            return left ** right\n        if op == \"==\":\n            return self._equals(left, right)\n        if op == \"!=\":\n            return not self._equals(left, right)\n        if op in (\"<\", \">\", \"<=\", \">=\"):\n            return self._compare(op, left, right, line)\n        raise RuntimeErrorSandy(f\"unknown operator {op}\", line)\n\n    def _equals(self, a, b):\n        # bool is a subclass of int in Python; keep true==1 out of surprises\n        if isinstance(a, bool) or isinstance(b, bool):\n            return a is b\n        if self._is_num(a) and self._is_num(b):\n            return a == b\n        if isinstance(a, StructInstance) and isinstance(b, StructInstance):\n            return (a.struct.name == b.struct.name\n                    and a.values.keys() == b.values.keys()\n                    and all(self._equals(a.values[k], b.values[k])\n                            for k in a.values))\n        if type(a) is type(b):\n            return a == b\n        return False\n\n    def _compare(self, op, a, b, line):\n        ok = (self._is_num(a) and self._is_num(b)) or \\\n             (isinstance(a, str) and isinstance(b, str))\n        if not ok:\n            raise RuntimeErrorSandy(\n                f\"cannot compare {type_name(a)} and {type_name(b)}\", line)\n        if op == \"<\":\n            return a < b\n        if op == \">\":\n            return a > b\n        if op == \"<=\":\n            return a <= b\n        return a >= b\n\n    # -- indexing --\n    def _index_get(self, container, key, line):\n        if isinstance(container, (list, str)):\n            if not self._is_int(key):\n                raise RuntimeErrorSandy(\n                    f\"{type_name(container)} index must be an int, \"\n                    f\"got {type_name(key)}\", line)\n            length = len(container)\n            idx = key + length if key < 0 else key\n            if idx < 0 or idx >= length:\n                raise RuntimeErrorSandy(\n                    f\"index {key} out of range (length {length})\", line)\n            return container[idx]\n        if isinstance(container, dict):\n            if key not in container:\n                raise RuntimeErrorSandy(f\"key {key!r} not found in map\", line)\n            return container[key]\n        raise RuntimeErrorSandy(\n            f\"cannot index a {type_name(container)}\", line)\n\n    def _index_set(self, container, key, value, line):\n        if isinstance(container, list):\n            if not self._is_int(key):\n                raise RuntimeErrorSandy(\n                    f\"list index must be an int, got {type_name(key)}\", line)\n            length = len(container)\n            idx = key + length if key < 0 else key\n            if idx < 0 or idx >= length:\n                raise RuntimeErrorSandy(\n                    f\"index {key} out of range (length {length})\", line)\n            container[idx] = value\n        elif isinstance(container, dict):\n            if isinstance(key, (list, dict)):\n                raise RuntimeErrorSandy(\n                    f\"map key cannot be a {type_name(key)}\", line)\n            container[key] = value\n        elif isinstance(container, str):\n            raise RuntimeErrorSandy(\"strings are immutable\", line)\n        else:\n            raise RuntimeErrorSandy(\n                f\"cannot index-assign a {type_name(container)}\", line)\n\n    # -- iteration --\n    def _as_iterable(self, value, line):\n        if isinstance(value, list):\n            return value\n        if isinstance(value, str):\n            return list(value)\n        if isinstance(value, dict):\n            return list(value.keys())\n        raise RuntimeErrorSandy(\n            f\"cannot iterate over a {type_name(value)}\", line)\n\n    # -- helpers --\n    @staticmethod\n    def _is_num(v):\n        return isinstance(v, (int, float)) and not isinstance(v, bool)\n\n    @staticmethod\n    def _is_int(v):\n        return isinstance(v, int) and not isinstance(v, bool)\n\n    def _need_num(self, left, right, verb, line):\n        if not (self._is_num(left) and self._is_num(right)):\n            raise RuntimeErrorSandy(\n                f\"cannot {verb} {type_name(left)} and {type_name(right)}\", line)\n\n\n# Dispatch tables (filled after class body).\nInterpreter._STMT_DISPATCH = {\n    N.ExprStmt: Interpreter._exec_expr_stmt,\n    N.Assign: Interpreter._exec_assign,\n    N.If: Interpreter._exec_if,\n    N.While: Interpreter._exec_while,\n    N.For: Interpreter._exec_for,\n    N.FuncDef: Interpreter._exec_funcdef,\n    N.Return: Interpreter._exec_return,\n    N.Break: Interpreter._exec_break,\n    N.Continue: Interpreter._exec_continue,\n    N.Try: Interpreter._exec_try,\n    N.Throw: Interpreter._exec_throw,\n    N.StructDef: Interpreter._exec_structdef,\n    N.Import: Interpreter._exec_import,\n}\n\nInterpreter._EXPR_DISPATCH = {\n    N.IntLit: Interpreter._eval_int,\n    N.FloatLit: Interpreter._eval_float,\n    N.StrLit: Interpreter._eval_str,\n    N.InterpStr: Interpreter._eval_interp,\n    N.BoolLit: Interpreter._eval_bool,\n    N.NilLit: Interpreter._eval_nil,\n    N.ListLit: Interpreter._eval_list,\n    N.MapLit: Interpreter._eval_map,\n    N.Identifier: Interpreter._eval_identifier,\n    N.BinaryOp: Interpreter._eval_binary,\n    N.UnaryOp: Interpreter._eval_unary,\n    N.LogicalOp: Interpreter._eval_logical,\n    N.Call: Interpreter._eval_call,\n    N.Index: Interpreter._eval_index,\n    N.Attribute: Interpreter._eval_attribute,\n}\n", "/sandy/lexer.py": "\"\"\"The Sandy lexer: turns source text into a list of tokens.\n\nNewlines are significant (they separate statements), but the lexer is\nsmart about line continuations:\n\n  * newlines inside ( ) and [ ] are ignored,\n  * a newline right after an operator / comma / open-delimiter is ignored,\n\nso lists, maps and long expressions can span multiple lines naturally.\n\"\"\"\n\nfrom .errors import LexError\nfrom .tokens import Token, TokenType, KEYWORDS, CONTINUATION_TYPES\n\n_SINGLE = {\n    \"+\": TokenType.PLUS,\n    \"-\": TokenType.MINUS,\n    \"%\": TokenType.PERCENT,\n    \"(\": TokenType.LPAREN,\n    \")\": TokenType.RPAREN,\n    \"{\": TokenType.LBRACE,\n    \"}\": TokenType.RBRACE,\n    \"[\": TokenType.LBRACKET,\n    \"]\": TokenType.RBRACKET,\n    \",\": TokenType.COMMA,\n    \":\": TokenType.COLON,\n    \".\": TokenType.DOT,\n}\n\n_ESCAPES = {\n    \"n\": \"\\n\",\n    \"t\": \"\\t\",\n    \"r\": \"\\r\",\n    \"\\\\\": \"\\\\\",\n    '\"': '\"',\n    \"'\": \"'\",\n    \"0\": \"\\0\",\n}\n\n\nclass Lexer:\n    def __init__(self, source):\n        self.src = source\n        self.pos = 0\n        self.line = 1\n        self.line_start = 0   # index in src where the current line begins\n        self.tok_start = 0    # index where the token being scanned begins\n        self.tokens = []\n        self.comments = {}    # line number -> comment text (for tooling)\n\n    def error(self, msg):\n        raise LexError(msg, self.line, self.pos - self.line_start + 1)\n\n    def _peek(self, offset=0):\n        i = self.pos + offset\n        return self.src[i] if i < len(self.src) else \"\"\n\n    def _add(self, type_, value):\n        col = self.tok_start - self.line_start + 1\n        self.tokens.append(Token(type_, value, self.line, col))\n\n    def tokenize(self):\n        src = self.src\n        n = len(src)\n        while self.pos < n:\n            self.tok_start = self.pos\n            c = src[self.pos]\n\n            # Whitespace (not newline).\n            if c in \" \\t\\r\":\n                self.pos += 1\n                continue\n\n            # Comments run to end of line.\n            if c == \"#\":\n                start = self.pos\n                while self.pos < n and src[self.pos] != \"\\n\":\n                    self.pos += 1\n                self.comments[self.line] = src[start:self.pos].rstrip()\n                continue\n\n            if c == \"\\n\":\n                self._add(TokenType.NEWLINE, \"\\n\")\n                self.pos += 1\n                self.line += 1\n                self.line_start = self.pos\n                continue\n\n            if c.isdigit() or (c == \".\" and self._peek(1).isdigit()):\n                self._number()\n                continue\n\n            if c.isalpha() or c == \"_\":\n                self._identifier()\n                continue\n\n            if c == '\"' or c == \"'\":\n                self._string(c)\n                continue\n\n            self._operator()\n\n        self.tok_start = self.pos\n        self._add(TokenType.NEWLINE, \"\\n\")\n        self._add(TokenType.EOF, None)\n        return self._post_process()\n\n    def _number(self):\n        start = self.pos\n        src = self.src\n        n = len(src)\n        is_float = False\n        while self.pos < n and src[self.pos].isdigit():\n            self.pos += 1\n        if self.pos < n and src[self.pos] == \".\" and self._peek(1) != \".\":\n            is_float = True\n            self.pos += 1\n            while self.pos < n and src[self.pos].isdigit():\n                self.pos += 1\n        text = src[start:self.pos]\n        if is_float:\n            self._add(TokenType.FLOAT, float(text))\n        else:\n            self._add(TokenType.INT, int(text))\n\n    def _identifier(self):\n        start = self.pos\n        src = self.src\n        n = len(src)\n        while self.pos < n and (src[self.pos].isalnum() or src[self.pos] == \"_\"):\n            self.pos += 1\n        text = src[start:self.pos]\n        kw = KEYWORDS.get(text)\n        if kw:\n            self._add(kw, text)\n        else:\n            self._add(TokenType.IDENT, text)\n\n    def _string(self, quote):\n        \"\"\"Scan a string literal, supporting {expr} interpolation.\n\n        `{{` and `}}` produce literal `{` and `}`. A string with no\n        interpolation becomes a plain STRING token; otherwise it becomes an\n        FSTRING token whose value is a list of parts, each either\n        (\"lit\", text) or (\"expr\", raw_source, line).\n        \"\"\"\n        src = self.src\n        n = len(src)\n        self.pos += 1  # opening quote\n        parts = []\n        buf = []\n        has_interp = False\n\n        def flush_lit():\n            if buf:\n                parts.append((\"lit\", \"\".join(buf)))\n                buf.clear()\n\n        while self.pos < n and src[self.pos] != quote:\n            ch = src[self.pos]\n            if ch == \"\\n\":\n                self.error(\"unterminated string literal\")\n            if ch == \"\\\\\":\n                self.pos += 1\n                if self.pos >= n:\n                    self.error(\"unterminated string literal\")\n                buf.append(_ESCAPES.get(src[self.pos], src[self.pos]))\n                self.pos += 1\n                continue\n            if ch == \"{\":\n                if self._peek(1) == \"{\":  # escaped brace\n                    buf.append(\"{\")\n                    self.pos += 2\n                    continue\n                has_interp = True\n                flush_lit()\n                self.pos += 1  # consume '{'\n                raw, line = self._scan_interp()\n                if raw.strip() == \"\":\n                    self.error(\"empty interpolation in string\")\n                parts.append((\"expr\", raw, line))\n                continue\n            if ch == \"}\":\n                if self._peek(1) == \"}\":  # escaped brace\n                    buf.append(\"}\")\n                    self.pos += 2\n                    continue\n                buf.append(\"}\")\n                self.pos += 1\n                continue\n            buf.append(ch)\n            self.pos += 1\n\n        if self.pos >= n:\n            self.error(\"unterminated string literal\")\n        self.pos += 1  # closing quote\n        flush_lit()\n\n        if has_interp:\n            self._add(TokenType.FSTRING, parts)\n        else:\n            text = parts[0][1] if parts else \"\"\n            self._add(TokenType.STRING, text)\n\n    def _scan_interp(self):\n        \"\"\"Read the raw source of a `{ ... }` interpolation (self.pos is just\n        past the '{'). Tracks brace depth and skips nested strings so that\n        maps and quoted braces inside the expression don't end it early.\n        Returns (raw_source, line) and leaves self.pos just past the '}'.\n        \"\"\"\n        src = self.src\n        n = len(src)\n        start = self.pos\n        line = self.line\n        depth = 1\n        while self.pos < n:\n            c = src[self.pos]\n            if c == \"\\n\":\n                self.error(\"unterminated interpolation in string\")\n            if c == '\"' or c == \"'\":\n                self._skip_nested_string(c)\n                continue\n            if c == \"{\":\n                depth += 1\n            elif c == \"}\":\n                depth -= 1\n                if depth == 0:\n                    raw = src[start:self.pos]\n                    self.pos += 1  # consume '}'\n                    return raw, line\n            self.pos += 1\n        self.error(\"unterminated interpolation in string\")\n\n    def _skip_nested_string(self, quote):\n        \"\"\"Advance past a nested string literal inside an interpolation.\"\"\"\n        src = self.src\n        n = len(src)\n        self.pos += 1  # opening quote\n        while self.pos < n and src[self.pos] != quote:\n            if src[self.pos] == \"\\\\\":\n                self.pos += 2\n                continue\n            if src[self.pos] == \"\\n\":\n                self.error(\"unterminated string in interpolation\")\n            self.pos += 1\n        if self.pos >= n:\n            self.error(\"unterminated string in interpolation\")\n        self.pos += 1  # closing quote\n\n    def _operator(self):\n        src = self.src\n        c = src[self.pos]\n        two = src[self.pos:self.pos + 2]\n\n        two_map = {\n            \"**\": TokenType.STARSTAR,\n            \"==\": TokenType.EQ,\n            \"!=\": TokenType.NEQ,\n            \"<=\": TokenType.LE,\n            \">=\": TokenType.GE,\n            \"->\": TokenType.ARROW,\n            \"+=\": TokenType.PLUS_EQ,\n            \"-=\": TokenType.MINUS_EQ,\n            \"*=\": TokenType.STAR_EQ,\n            \"/=\": TokenType.SLASH_EQ,\n        }\n        if two in two_map:\n            self._add(two_map[two], two)\n            self.pos += 2\n            return\n\n        if c == \"*\":\n            self._add(TokenType.STAR, c)\n        elif c == \"/\":\n            self._add(TokenType.SLASH, c)\n        elif c == \"=\":\n            self._add(TokenType.ASSIGN, c)\n        elif c == \"<\":\n            self._add(TokenType.LT, c)\n        elif c == \">\":\n            self._add(TokenType.GT, c)\n        elif c in _SINGLE:\n            self._add(_SINGLE[c], c)\n        else:\n            self.error(f\"unexpected character {c!r}\")\n        self.pos += 1\n\n    def _post_process(self):\n        \"\"\"Drop newlines that are really line-continuations, collapse runs,\n        and strip leading newlines. Newlines inside ( ) [ ] are suppressed.\n        \"\"\"\n        result = []\n        depth = 0  # only () and [] count as grouping for newlines\n        prev_significant = None\n        for tok in self.tokens:\n            t = tok.type\n            if t in (TokenType.LPAREN, TokenType.LBRACKET):\n                depth += 1\n            elif t in (TokenType.RPAREN, TokenType.RBRACKET):\n                depth = max(0, depth - 1)\n\n            if t == TokenType.NEWLINE:\n                if depth > 0:\n                    continue\n                if prev_significant is None:\n                    continue  # leading blank lines\n                if prev_significant in CONTINUATION_TYPES:\n                    continue  # continuation after operator/comma/open\n                if result and result[-1].type == TokenType.NEWLINE:\n                    continue  # collapse consecutive newlines\n                result.append(tok)\n            else:\n                result.append(tok)\n                prev_significant = t\n        return result\n\n\ndef tokenize(source):\n    return Lexer(source).tokenize()\n\n\ndef scan_comments(source):\n    \"\"\"Return {line_number: comment_text} for a source string (for tooling).\"\"\"\n    lx = Lexer(source)\n    lx.tokenize()\n    return lx.comments\n", "/sandy/lsp.py": "\"\"\"A minimal Language Server for Sandy (`sandy lsp`).\n\nSpeaks LSP over stdio (JSON-RPC with Content-Length framing) and reuses the\nexisting lexer, parser, type checker, and formatter to provide:\n\n  * diagnostics (syntax + type errors) on open/change\n  * whole-document formatting\n  * completion (keywords, builtins, and the file's own definitions)\n  * a document-symbol outline (functions, structs, top-level variables)\n\nThe analysis is exposed as pure functions (compute_diagnostics, completions,\ndocument_symbols) so it can be unit-tested without the stdio loop.\n\"\"\"\n\nimport json\nimport os\nimport sys\n\nfrom . import nodes as N\nfrom .errors import SandyError, LexError, ParseError\nfrom .lexer import tokenize\nfrom .parser import parse\nfrom .tokens import TokenType\nfrom .typecheck import TypeChecker\nfrom .formatter import format_source\nfrom .builtins import BUILTIN_NAMES\n\n# One-line signatures shown on hover for builtins.\nBUILTIN_SIGS = {\n    \"print\": \"print(...) — print values, then a newline\",\n    \"input\": \"input(prompt?) -> string\",\n    \"len\": \"len(x) -> int — length of a string, list, or map\",\n    \"type\": \"type(x) -> string — the value's type name\",\n    \"str\": \"str(x) -> string\", \"int\": \"int(x) -> int\",\n    \"float\": \"float(x) -> float\", \"bool\": \"bool(x) -> bool\",\n    \"range\": \"range(n) / range(a, b) / range(a, b, step) -> list\",\n    \"abs\": \"abs(x) -> number\", \"min\": \"min(list) -> value\",\n    \"max\": \"max(list) -> value\", \"sum\": \"sum(list) -> number\",\n    \"round\": \"round(x, ndigits?) -> number\", \"pow\": \"pow(a, b) -> number\",\n    \"sqrt\": \"sqrt(x) -> float\", \"floor\": \"floor(x) -> int\",\n    \"ceil\": \"ceil(x) -> int\",\n    \"push\": \"push(list, x) -> list\", \"pop\": \"pop(list) -> value\",\n    \"keys\": \"keys(map) -> list\", \"values\": \"values(map) -> list\",\n    \"has\": \"has(container, x) -> bool\",\n    \"upper\": \"upper(s) -> string\", \"lower\": \"lower(s) -> string\",\n    \"trim\": \"trim(s) -> string\", \"split\": \"split(s, sep?) -> list\",\n    \"join\": \"join(list, sep) -> string\",\n    \"read_file\": \"read_file(path) -> string\",\n    \"read_lines\": \"read_lines(path) -> list\",\n    \"write_file\": \"write_file(path, text)\",\n    \"append_file\": \"append_file(path, text)\",\n}\n\n_SEVERITY_ERROR = 1\n\nKEYWORDS = [\n    \"fn\", \"return\", \"if\", \"elif\", \"else\", \"while\", \"for\", \"in\", \"break\",\n    \"continue\", \"try\", \"catch\", \"throw\", \"struct\", \"import\", \"true\", \"false\",\n    \"nil\", \"and\", \"or\", \"not\",\n]\n\n# LSP SymbolKind / CompletionItemKind codes we use.\n_KIND_FUNCTION = 12\n_KIND_STRUCT = 23\n_KIND_VARIABLE = 13\n_KIND_KEYWORD = 14\n_KIND_FUNCTION_C = 3   # CompletionItemKind.Function\n\n\n# ---- pure analysis (testable without the server) ----\n\ndef _point_range(lines, line, col):\n    idx = max(0, line - 1)\n    start = max(0, (col or 1) - 1)\n    end = len(lines[idx]) if idx < len(lines) else start + 1\n    end = max(end, start + 1)\n    return {\"start\": {\"line\": idx, \"character\": start},\n            \"end\": {\"line\": idx, \"character\": end}}\n\n\ndef _line_range(lines, line):\n    idx = max(0, line - 1)\n    if idx < len(lines):\n        s = lines[idx]\n        start = len(s) - len(s.lstrip())\n        return {\"start\": {\"line\": idx, \"character\": start},\n                \"end\": {\"line\": idx, \"character\": max(start + 1, len(s))}}\n    return {\"start\": {\"line\": idx, \"character\": 0},\n            \"end\": {\"line\": idx, \"character\": 1}}\n\n\ndef compute_diagnostics(text, base_dir=None):\n    \"\"\"Return a list of LSP Diagnostic dicts for a Sandy source string.\"\"\"\n    lines = text.split(\"\\n\")\n    try:\n        program = parse(tokenize(text))\n    except (LexError, ParseError) as e:\n        rng = _point_range(lines, e.line or 1, getattr(e, \"col\", None))\n        return [{\"range\": rng, \"severity\": _SEVERITY_ERROR,\n                 \"source\": \"sandy\", \"message\": e.message}]\n    except SandyError as e:\n        return [{\"range\": _line_range(lines, e.line or 1),\n                 \"severity\": _SEVERITY_ERROR, \"source\": \"sandy\",\n                 \"message\": e.message}]\n    diags = []\n    try:\n        errors = TypeChecker(base_dir=base_dir).check(program)\n    except SandyError:\n        errors = []\n    for message, line in errors:\n        diags.append({\"range\": _line_range(lines, line or 1),\n                      \"severity\": _SEVERITY_ERROR, \"source\": \"sandy-types\",\n                      \"message\": message})\n    return diags\n\n\ndef _top_level_names(program):\n    \"\"\"(name, kind) for every top-level definition in a program.\"\"\"\n    out = []\n    for stmt in program.statements:\n        if isinstance(stmt, N.FuncDef):\n            out.append((stmt.name, _KIND_FUNCTION))\n        elif isinstance(stmt, N.StructDef):\n            out.append((stmt.name, _KIND_STRUCT))\n        elif isinstance(stmt, N.Assign) and isinstance(stmt.target, N.Identifier):\n            out.append((stmt.target.name, _KIND_VARIABLE))\n    return out\n\n\ndef completions(text):\n    \"\"\"Completion items: keywords, builtins, and the file's own top-level\n    definitions.\"\"\"\n    items = [{\"label\": kw, \"kind\": _KIND_KEYWORD} for kw in KEYWORDS]\n    items += [{\"label\": b, \"kind\": _KIND_FUNCTION_C} for b in sorted(BUILTIN_NAMES)]\n    try:\n        program = parse(tokenize(text))\n    except SandyError:\n        return items\n    seen = set()\n    for name, kind in _top_level_names(program):\n        if name not in seen:\n            seen.add(name)\n            items.append({\"label\": name, \"kind\": kind})\n    return items\n\n\ndef document_symbols(text):\n    \"\"\"A flat outline of top-level functions, structs, and variables.\"\"\"\n    try:\n        program = parse(tokenize(text))\n    except SandyError:\n        return []\n    syms = []\n    for stmt in program.statements:\n        if isinstance(stmt, N.FuncDef):\n            end = stmt.body.end_line or stmt.line\n            syms.append(_symbol(stmt.name, _KIND_FUNCTION, stmt.line, end))\n        elif isinstance(stmt, N.StructDef):\n            end = stmt.end_line or stmt.line\n            syms.append(_symbol(stmt.name, _KIND_STRUCT, stmt.line, end))\n        elif isinstance(stmt, N.Assign) and isinstance(stmt.target, N.Identifier):\n            syms.append(_symbol(stmt.target.name, _KIND_VARIABLE,\n                                stmt.line, stmt.line))\n    return syms\n\n\ndef _symbol(name, kind, start_line, end_line):\n    rng = {\"start\": {\"line\": start_line - 1, \"character\": 0},\n           \"end\": {\"line\": end_line - 1, \"character\": 0}}\n    return {\"name\": name, \"kind\": kind, \"range\": rng, \"selectionRange\": rng}\n\n\ndef _uri_to_path(uri):\n    if uri.startswith(\"file://\"):\n        from urllib.parse import unquote\n        return unquote(uri[len(\"file://\"):])\n    return uri\n\n\n# ---- hover and go-to-definition (position-based, via token positions) ----\n\ndef _safe_parse(text):\n    try:\n        return parse(tokenize(text))\n    except SandyError:\n        return None\n\n\ndef _ident_at(text, line, character):\n    \"\"\"The identifier token at a 0-based (line, character), or None.\"\"\"\n    try:\n        toks = tokenize(text)\n    except SandyError:\n        return None\n    tl, tc = line + 1, character + 1\n    for t in toks:\n        if t.type == TokenType.IDENT and t.line == tl:\n            if t.col <= tc <= t.col + len(t.value):\n                return t\n    return None\n\n\ndef _func_sig(fn):\n    params = [f\"{p}: {a}\" if a else p\n              for p, a in zip(fn.params, fn.param_types)]\n    sig = f\"fn {fn.name}(\" + \", \".join(params) + \")\"\n    return sig + (f\" -> {fn.ret_type}\" if fn.ret_type else \"\")\n\n\ndef _struct_sig(sd):\n    fields = [f\"{f}: {a}\" if a else f\n              for f, a in zip(sd.fields, sd.field_types)]\n    return f\"struct {sd.name} {{ \" + \", \".join(fields) + \" }\"\n\n\ndef _walk_blocks(block):\n    \"\"\"Yield every Block nested inside `block` (including itself).\"\"\"\n    yield block\n    for stmt in block.statements:\n        t = type(stmt)\n        if t is N.FuncDef:\n            yield from _walk_blocks(stmt.body)\n        elif t is N.If:\n            for _, b in stmt.branches:\n                yield from _walk_blocks(b)\n            if stmt.else_block is not None:\n                yield from _walk_blocks(stmt.else_block)\n        elif t in (N.While, N.For):\n            yield from _walk_blocks(stmt.body)\n        elif t is N.Try:\n            yield from _walk_blocks(stmt.body)\n            yield from _walk_blocks(stmt.handler)\n\n\ndef _definitions(program):\n    \"\"\"name -> (kind, line, detail) for functions, structs, and variables.\"\"\"\n    defs = {}\n    for block in _walk_blocks(program):\n        for stmt in block.statements:\n            t = type(stmt)\n            if t is N.FuncDef:\n                defs.setdefault(stmt.name, (\"function\", stmt.line, _func_sig(stmt)))\n            elif t is N.StructDef:\n                defs.setdefault(stmt.name, (\"struct\", stmt.line, _struct_sig(stmt)))\n            elif t is N.Assign and isinstance(stmt.target, N.Identifier):\n                defs.setdefault(stmt.target.name,\n                                (\"variable\", stmt.line, stmt.target.name))\n    return defs\n\n\ndef _enclosing_function(program, line):\n    \"\"\"The innermost FuncDef whose body spans a 1-based line, or None.\"\"\"\n    best = None\n    for block in _walk_blocks(program):\n        for stmt in block.statements:\n            if type(stmt) is N.FuncDef:\n                end = stmt.body.end_line or stmt.line\n                if stmt.line <= line <= end:\n                    if best is None or stmt.line >= best.line:\n                        best = stmt\n    return best\n\n\ndef hover_info(text, line, character):\n    \"\"\"A short signature/description for the identifier at a position.\"\"\"\n    tok = _ident_at(text, line, character)\n    if tok is None:\n        return None\n    name = tok.value\n    program = _safe_parse(text)\n    if program is not None:\n        fn = _enclosing_function(program, line + 1)\n        if fn is not None:\n            for p, a in zip(fn.params, fn.param_types):\n                if p == name:\n                    return f\"(parameter) {name}\" + (f\": {a}\" if a else \"\")\n        detail = _definitions(program).get(name)\n        if detail is not None:\n            kind, _, text_detail = detail\n            return text_detail if kind != \"variable\" else f\"(variable) {name}\"\n    return BUILTIN_SIGS.get(name)\n\n\ndef definition_line(text, line, character):\n    \"\"\"The 1-based line where the identifier at a position is defined, or None.\"\"\"\n    tok = _ident_at(text, line, character)\n    if tok is None:\n        return None\n    program = _safe_parse(text)\n    if program is None:\n        return None\n    name = tok.value\n    fn = _enclosing_function(program, line + 1)\n    if fn is not None and name in fn.params:\n        return fn.line\n    detail = _definitions(program).get(name)\n    return detail[1] if detail is not None else None\n\n\n# ---- stdio JSON-RPC server ----\n\nclass Server:\n    def __init__(self, stdin=None, stdout=None):\n        self.stdin = stdin or sys.stdin.buffer\n        self.stdout = stdout or sys.stdout.buffer\n        self.docs = {}       # uri -> text\n        self.running = True\n\n    def run(self):\n        while self.running:\n            msg = self._read()\n            if msg is None:\n                break\n            self._dispatch(msg)\n\n    def _read(self):\n        headers = {}\n        while True:\n            line = self.stdin.readline()\n            if not line:\n                return None\n            line = line.decode(\"ascii\").strip()\n            if line == \"\":\n                break\n            if \":\" in line:\n                k, v = line.split(\":\", 1)\n                headers[k.strip().lower()] = v.strip()\n        length = int(headers.get(\"content-length\", 0))\n        body = self.stdin.read(length)\n        return json.loads(body.decode(\"utf-8\"))\n\n    def _write(self, obj):\n        data = json.dumps(obj).encode(\"utf-8\")\n        self.stdout.write(f\"Content-Length: {len(data)}\\r\\n\\r\\n\".encode(\"ascii\"))\n        self.stdout.write(data)\n        self.stdout.flush()\n\n    def _respond(self, id_, result):\n        self._write({\"jsonrpc\": \"2.0\", \"id\": id_, \"result\": result})\n\n    def _notify(self, method, params):\n        self._write({\"jsonrpc\": \"2.0\", \"method\": method, \"params\": params})\n\n    def _dispatch(self, msg):\n        method = msg.get(\"method\")\n        id_ = msg.get(\"id\")\n        params = msg.get(\"params\") or {}\n        if method == \"initialize\":\n            self._respond(id_, {\"capabilities\": {\n                \"textDocumentSync\": 1,   # full document sync\n                \"documentFormattingProvider\": True,\n                \"documentSymbolProvider\": True,\n                \"hoverProvider\": True,\n                \"definitionProvider\": True,\n                \"completionProvider\": {\"triggerCharacters\": [\".\"]},\n            }, \"serverInfo\": {\"name\": \"sandy-lsp\"}})\n        elif method == \"shutdown\":\n            self._respond(id_, None)\n        elif method == \"exit\":\n            self.running = False\n        elif method == \"textDocument/didOpen\":\n            doc = params[\"textDocument\"]\n            self.docs[doc[\"uri\"]] = doc[\"text\"]\n            self._publish(doc[\"uri\"])\n        elif method == \"textDocument/didChange\":\n            uri = params[\"textDocument\"][\"uri\"]\n            self.docs[uri] = params[\"contentChanges\"][-1][\"text\"]\n            self._publish(uri)\n        elif method == \"textDocument/didClose\":\n            uri = params[\"textDocument\"][\"uri\"]\n            self.docs.pop(uri, None)\n            self._notify(\"textDocument/publishDiagnostics\",\n                         {\"uri\": uri, \"diagnostics\": []})\n        elif method == \"textDocument/formatting\":\n            self._respond(id_, self._format(params[\"textDocument\"][\"uri\"]))\n        elif method == \"textDocument/completion\":\n            self._respond(id_, completions(\n                self.docs.get(params[\"textDocument\"][\"uri\"], \"\")))\n        elif method == \"textDocument/documentSymbol\":\n            self._respond(id_, document_symbols(\n                self.docs.get(params[\"textDocument\"][\"uri\"], \"\")))\n        elif method == \"textDocument/hover\":\n            self._respond(id_, self._hover(params))\n        elif method == \"textDocument/definition\":\n            self._respond(id_, self._definition(params))\n        elif id_ is not None:\n            self._respond(id_, None)   # unknown request: don't hang the client\n\n    def _hover(self, params):\n        text = self.docs.get(params[\"textDocument\"][\"uri\"], \"\")\n        pos = params[\"position\"]\n        info = hover_info(text, pos[\"line\"], pos[\"character\"])\n        if info is None:\n            return None\n        return {\"contents\": {\"kind\": \"markdown\",\n                             \"value\": \"```sandy\\n\" + info + \"\\n```\"}}\n\n    def _definition(self, params):\n        uri = params[\"textDocument\"][\"uri\"]\n        pos = params[\"position\"]\n        line = definition_line(self.docs.get(uri, \"\"), pos[\"line\"],\n                               pos[\"character\"])\n        if line is None:\n            return None\n        rng = {\"start\": {\"line\": line - 1, \"character\": 0},\n               \"end\": {\"line\": line - 1, \"character\": 0}}\n        return {\"uri\": uri, \"range\": rng}\n\n    def _publish(self, uri):\n        base_dir = os.path.dirname(_uri_to_path(uri)) or None\n        diags = compute_diagnostics(self.docs.get(uri, \"\"), base_dir=base_dir)\n        self._notify(\"textDocument/publishDiagnostics\",\n                     {\"uri\": uri, \"diagnostics\": diags})\n\n    def _format(self, uri):\n        text = self.docs.get(uri, \"\")\n        try:\n            formatted = format_source(text)\n        except SandyError:\n            return []\n        if formatted == text:\n            return []\n        lines = text.split(\"\\n\")\n        end = {\"line\": len(lines) - 1, \"character\": len(lines[-1])}\n        return [{\"range\": {\"start\": {\"line\": 0, \"character\": 0}, \"end\": end},\n                 \"newText\": formatted}]\n\n\ndef main():\n    Server().run()\n    return 0\n", "/sandy/nodes.py": "\"\"\"AST node definitions for Sandy.\n\nPlain, lightweight classes. Each node keeps the source line for error\nreporting during evaluation.\n\"\"\"\n\n\nclass Node:\n    __slots__ = ()\n\n\n# ---- Expressions ----\n\nclass IntLit(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass FloatLit(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass StrLit(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass InterpStr(Node):\n    # parts: list of (\"lit\", text) or (\"expr\", node)\n    __slots__ = (\"parts\", \"line\")\n    def __init__(self, parts, line):\n        self.parts = parts; self.line = line\n\n\nclass BoolLit(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass NilLit(Node):\n    __slots__ = (\"line\",)\n    def __init__(self, line):\n        self.line = line\n\n\nclass ListLit(Node):\n    __slots__ = (\"items\", \"line\")\n    def __init__(self, items, line):\n        self.items = items; self.line = line\n\n\nclass MapLit(Node):\n    __slots__ = (\"pairs\", \"line\")  # list of (key_node, value_node)\n    def __init__(self, pairs, line):\n        self.pairs = pairs; self.line = line\n\n\nclass Identifier(Node):\n    __slots__ = (\"name\", \"line\")\n    def __init__(self, name, line):\n        self.name = name; self.line = line\n\n\nclass BinaryOp(Node):\n    __slots__ = (\"op\", \"left\", \"right\", \"line\")\n    def __init__(self, op, left, right, line):\n        self.op = op; self.left = left; self.right = right; self.line = line\n\n\nclass UnaryOp(Node):\n    __slots__ = (\"op\", \"operand\", \"line\")\n    def __init__(self, op, operand, line):\n        self.op = op; self.operand = operand; self.line = line\n\n\nclass LogicalOp(Node):\n    __slots__ = (\"op\", \"left\", \"right\", \"line\")  # 'and' / 'or' (short-circuit)\n    def __init__(self, op, left, right, line):\n        self.op = op; self.left = left; self.right = right; self.line = line\n\n\nclass Call(Node):\n    __slots__ = (\"callee\", \"args\", \"line\")\n    def __init__(self, callee, args, line):\n        self.callee = callee; self.args = args; self.line = line\n\n\nclass Index(Node):\n    __slots__ = (\"target\", \"index\", \"line\")\n    def __init__(self, target, index, line):\n        self.target = target; self.index = index; self.line = line\n\n\nclass Attribute(Node):\n    __slots__ = (\"target\", \"name\", \"line\")\n    def __init__(self, target, name, line):\n        self.target = target; self.name = name; self.line = line\n\n\n# ---- Statements ----\n\nclass ExprStmt(Node):\n    __slots__ = (\"expr\", \"line\")\n    def __init__(self, expr, line):\n        self.expr = expr; self.line = line\n\n\nclass Assign(Node):\n    # target: Identifier/Index; annotation: optional type name (str) or None\n    __slots__ = (\"target\", \"op\", \"value\", \"line\", \"annotation\")\n    def __init__(self, target, op, value, line, annotation=None):\n        self.target = target; self.op = op; self.value = value\n        self.line = line; self.annotation = annotation\n\n\nclass Block(Node):\n    __slots__ = (\"statements\", \"end_line\")\n    def __init__(self, statements, end_line=None):\n        self.statements = statements\n        self.end_line = end_line   # source line of the closing '}' (for tooling)\n\n\nclass If(Node):\n    __slots__ = (\"branches\", \"else_block\", \"line\")  # branches: list of (cond, block)\n    def __init__(self, branches, else_block, line):\n        self.branches = branches; self.else_block = else_block; self.line = line\n\n\nclass While(Node):\n    __slots__ = (\"cond\", \"body\", \"line\")\n    def __init__(self, cond, body, line):\n        self.cond = cond; self.body = body; self.line = line\n\n\nclass For(Node):\n    __slots__ = (\"var\", \"iterable\", \"body\", \"line\")\n    def __init__(self, var, iterable, body, line):\n        self.var = var; self.iterable = iterable; self.body = body; self.line = line\n\n\nclass FuncDef(Node):\n    # param_types: list aligned with params (each a type name str or None)\n    # ret_type: return type name str or None\n    __slots__ = (\"name\", \"params\", \"body\", \"line\", \"param_types\", \"ret_type\")\n    def __init__(self, name, params, body, line, param_types=None, ret_type=None):\n        self.name = name; self.params = params; self.body = body; self.line = line\n        self.param_types = param_types if param_types is not None else [None] * len(params)\n        self.ret_type = ret_type\n\n\nclass Return(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass Break(Node):\n    __slots__ = (\"line\",)\n    def __init__(self, line):\n        self.line = line\n\n\nclass Continue(Node):\n    __slots__ = (\"line\",)\n    def __init__(self, line):\n        self.line = line\n\n\nclass Try(Node):\n    # body: Block; catch_var: str; handler: Block\n    __slots__ = (\"body\", \"catch_var\", \"handler\", \"line\")\n    def __init__(self, body, catch_var, handler, line):\n        self.body = body; self.catch_var = catch_var\n        self.handler = handler; self.line = line\n\n\nclass Throw(Node):\n    __slots__ = (\"value\", \"line\")\n    def __init__(self, value, line):\n        self.value = value; self.line = line\n\n\nclass StructDef(Node):\n    # fields: list of field names; field_types: aligned list (str or None)\n    __slots__ = (\"name\", \"fields\", \"field_types\", \"line\", \"end_line\")\n    def __init__(self, name, fields, field_types, line, end_line=None):\n        self.name = name; self.fields = fields\n        self.field_types = field_types; self.line = line\n        self.end_line = end_line\n\n\nclass Import(Node):\n    # path: source string; alias: local name bound to the module\n    __slots__ = (\"path\", \"alias\", \"line\")\n    def __init__(self, path, alias, line):\n        self.path = path; self.alias = alias; self.line = line\n", "/sandy/parser.py": "\"\"\"Recursive-descent parser for Sandy.\n\nProduces an AST (see nodes.py) from the token stream. Operator precedence\nis handled with a small precedence-climbing table.\n\"\"\"\n\nfrom .errors import ParseError, SandyError\nfrom .tokens import TokenType as T\nfrom . import nodes as N\n\n\n# Binary operator precedence (higher binds tighter). Comparison and\n# arithmetic live here; 'and'/'or' are handled separately (short-circuit),\n# and '**' is right-associative.\n_BINARY_PRECEDENCE = {\n    T.EQ: 1, T.NEQ: 1, T.LT: 1, T.GT: 1, T.LE: 1, T.GE: 1,\n    T.PLUS: 2, T.MINUS: 2,\n    T.STAR: 3, T.SLASH: 3, T.PERCENT: 3,\n}\n\n_ASSIGN_OPS = {\n    T.ASSIGN: \"=\", T.PLUS_EQ: \"+=\", T.MINUS_EQ: \"-=\",\n    T.STAR_EQ: \"*=\", T.SLASH_EQ: \"/=\",\n}\n\n# Valid type names that can appear in an annotation (besides 'nil' and 'fn',\n# which are keywords). 'any' opts a binding out of static checking.\n_TYPE_NAMES = {\"int\", \"float\", \"string\", \"bool\", \"list\", \"map\", \"any\"}\n\n\nclass Parser:\n    def __init__(self, tokens):\n        self.tokens = tokens\n        self.pos = 0\n\n    # -- token helpers --\n    def _peek(self, offset=0):\n        i = self.pos + offset\n        return self.tokens[i] if i < len(self.tokens) else self.tokens[-1]\n\n    def _cur(self):\n        return self.tokens[self.pos]\n\n    def _advance(self):\n        tok = self.tokens[self.pos]\n        if self.pos < len(self.tokens) - 1:\n            self.pos += 1\n        return tok\n\n    def _check(self, type_):\n        return self._cur().type == type_\n\n    def _match(self, *types):\n        if self._cur().type in types:\n            return self._advance()\n        return None\n\n    def _expect(self, type_, what):\n        if self._cur().type != type_:\n            tok = self._cur()\n            got = tok.value if tok.value is not None else tok.type\n            raise ParseError(f\"expected {what}, got {got!r}\", tok.line, tok.col)\n        return self._advance()\n\n    def _skip_newlines(self):\n        while self._check(T.NEWLINE):\n            self._advance()\n\n    # -- entry point --\n    def parse(self):\n        statements = []\n        self._skip_newlines()\n        while not self._check(T.EOF):\n            statements.append(self._statement())\n            self._skip_newlines()\n        return N.Block(statements)\n\n    # -- statements --\n    def _statement(self):\n        t = self._cur().type\n        if t == T.FN:\n            return self._func_def()\n        if t == T.IF:\n            return self._if_stmt()\n        if t == T.WHILE:\n            return self._while_stmt()\n        if t == T.FOR:\n            return self._for_stmt()\n        if t == T.RETURN:\n            return self._return_stmt()\n        if t == T.BREAK:\n            line = self._advance().line\n            return N.Break(line)\n        if t == T.CONTINUE:\n            line = self._advance().line\n            return N.Continue(line)\n        if t == T.IMPORT:\n            return self._import_stmt()\n        if t == T.STRUCT:\n            return self._struct_def()\n        if t == T.TRY:\n            return self._try_stmt()\n        if t == T.THROW:\n            line = self._advance().line\n            value = self._expression()\n            return N.Throw(value, line)\n        return self._assign_or_expr()\n\n    def _import_stmt(self):\n        line = self._advance().line  # 'import'\n        tok = self._expect(T.STRING, \"a module path string after 'import'\")\n        path = tok.value\n        # Optional `as NAME` (soft keyword); otherwise derive from the filename.\n        if self._check(T.IDENT) and self._cur().value == \"as\":\n            self._advance()\n            alias = self._expect(T.IDENT, \"a module alias after 'as'\").value\n        else:\n            base = path.rsplit(\"/\", 1)[-1]\n            alias = base[:-3] if base.endswith(\".sy\") else base\n        return N.Import(path, alias, line)\n\n    def _struct_def(self):\n        line = self._advance().line  # 'struct'\n        name = self._expect(T.IDENT, \"struct name\").value\n        self._expect(T.LBRACE, \"'{'\")\n        self._skip_newlines()\n        fields, field_types = [], []\n        while not self._check(T.RBRACE) and not self._check(T.EOF):\n            fields.append(self._expect(T.IDENT, \"field name\").value)\n            field_types.append(self._opt_type_annotation())\n            self._match(T.COMMA)   # comma between fields is optional\n            self._skip_newlines()\n        end_line = self._cur().line\n        self._expect(T.RBRACE, \"'}'\")\n        return N.StructDef(name, fields, field_types, line, end_line)\n\n    def _try_stmt(self):\n        line = self._advance().line  # 'try'\n        body = self._block()\n        self._skip_newlines()\n        self._expect(T.CATCH, \"'catch' after a try block\")\n        catch_var = self._expect(T.IDENT, \"a name to bind the error to\").value\n        handler = self._block()\n        return N.Try(body, catch_var, handler, line)\n\n    def _block(self):\n        self._expect(T.LBRACE, \"'{'\")\n        self._skip_newlines()\n        statements = []\n        while not self._check(T.RBRACE) and not self._check(T.EOF):\n            statements.append(self._statement())\n            self._skip_newlines()\n        end_line = self._cur().line\n        self._expect(T.RBRACE, \"'}'\")\n        return N.Block(statements, end_line)\n\n    def _func_def(self):\n        line = self._advance().line  # 'fn'\n        name = self._expect(T.IDENT, \"function name\").value\n        self._expect(T.LPAREN, \"'('\")\n        params = []\n        param_types = []\n        if not self._check(T.RPAREN):\n            params.append(self._expect(T.IDENT, \"parameter name\").value)\n            param_types.append(self._opt_type_annotation())\n            while self._match(T.COMMA):\n                params.append(self._expect(T.IDENT, \"parameter name\").value)\n                param_types.append(self._opt_type_annotation())\n        self._expect(T.RPAREN, \"')'\")\n        ret_type = None\n        if self._match(T.ARROW):\n            ret_type = self._type_annotation()\n        body = self._block()\n        return N.FuncDef(name, params, body, line, param_types, ret_type)\n\n    def _opt_type_annotation(self):\n        if self._match(T.COLON):\n            return self._type_annotation()\n        return None\n\n    def _type_annotation(self):\n        tok = self._cur()\n        if tok.type == T.NIL:\n            self._advance(); return \"nil\"\n        if tok.type == T.FN:\n            self._advance(); return \"fn\"\n        if tok.type == T.IDENT:\n            # Any identifier is accepted as a type name here; the type checker\n            # validates it (a primitive, list/map, `any`, or a struct name).\n            base = tok.value\n            self._advance()\n            # Parameterized types: list<T>, map<K, V>\n            if base in (\"list\", \"map\") and self._check(T.LT):\n                self._advance()  # '<'\n                args = [self._type_annotation()]\n                if base == \"map\":\n                    self._expect(T.COMMA, \"',' between map key and value types\")\n                    args.append(self._type_annotation())\n                self._expect(T.GT, \"'>' to close the type parameters\")\n                return f\"{base}<{','.join(args)}>\"\n            return base\n        got = tok.value if tok.value is not None else tok.type\n        raise ParseError(\n            f\"expected a type name, got {got!r}\", tok.line, tok.col)\n\n    def _if_stmt(self):\n        line = self._advance().line  # 'if'\n        branches = []\n        cond = self._expression()\n        block = self._block()\n        branches.append((cond, block))\n        else_block = None\n        while self._check(T.ELIF):\n            self._advance()\n            c = self._expression()\n            b = self._block()\n            branches.append((c, b))\n        if self._match(T.ELSE):\n            else_block = self._block()\n        return N.If(branches, else_block, line)\n\n    def _while_stmt(self):\n        line = self._advance().line\n        cond = self._expression()\n        body = self._block()\n        return N.While(cond, body, line)\n\n    def _for_stmt(self):\n        line = self._advance().line\n        var = self._expect(T.IDENT, \"loop variable\").value\n        self._expect(T.IN, \"'in'\")\n        iterable = self._expression()\n        body = self._block()\n        return N.For(var, iterable, body, line)\n\n    def _return_stmt(self):\n        line = self._advance().line\n        if self._check(T.NEWLINE) or self._check(T.RBRACE) or self._check(T.EOF):\n            return N.Return(None, line)\n        value = self._expression()\n        return N.Return(value, line)\n\n    def _assign_or_expr(self):\n        expr = self._expression()\n        # Annotated variable declaration:  name: type = value\n        if isinstance(expr, N.Identifier) and self._check(T.COLON):\n            line = self._advance().line  # ':'\n            annotation = self._type_annotation()\n            self._expect(T.ASSIGN, \"'=' (an annotated variable needs a value)\")\n            value = self._expression()\n            return N.Assign(expr, \"=\", value, line, annotation)\n        op_tok = self._cur()\n        if op_tok.type in _ASSIGN_OPS:\n            if not isinstance(expr, (N.Identifier, N.Index, N.Attribute)):\n                raise ParseError(\"invalid assignment target\", op_tok.line)\n            self._advance()\n            value = self._expression()\n            return N.Assign(expr, _ASSIGN_OPS[op_tok.type], value, op_tok.line)\n        return N.ExprStmt(expr, op_tok.line)\n\n    # -- expressions (precedence climbing) --\n    def _expression(self):\n        return self._or_expr()\n\n    def _or_expr(self):\n        left = self._and_expr()\n        while self._check(T.OR):\n            line = self._advance().line\n            right = self._and_expr()\n            left = N.LogicalOp(\"or\", left, right, line)\n        return left\n\n    def _and_expr(self):\n        left = self._not_expr()\n        while self._check(T.AND):\n            line = self._advance().line\n            right = self._not_expr()\n            left = N.LogicalOp(\"and\", left, right, line)\n        return left\n\n    def _not_expr(self):\n        if self._check(T.NOT):\n            line = self._advance().line\n            operand = self._not_expr()\n            return N.UnaryOp(\"not\", operand, line)\n        return self._binary(1)\n\n    def _binary(self, min_prec):\n        left = self._unary()\n        while True:\n            t = self._cur().type\n            prec = _BINARY_PRECEDENCE.get(t)\n            if prec is None or prec < min_prec:\n                break\n            op_tok = self._advance()\n            right = self._binary(prec + 1)\n            left = N.BinaryOp(op_tok.value, left, right, op_tok.line)\n        return left\n\n    def _unary(self):\n        if self._check(T.MINUS):\n            line = self._advance().line\n            operand = self._unary()\n            return N.UnaryOp(\"-\", operand, line)\n        if self._check(T.PLUS):\n            self._advance()\n            return self._unary()\n        return self._power()\n\n    def _power(self):\n        base = self._postfix()\n        if self._check(T.STARSTAR):\n            line = self._advance().line\n            # right-associative: exponent may itself be a unary/power expr\n            exponent = self._unary()\n            return N.BinaryOp(\"**\", base, exponent, line)\n        return base\n\n    def _postfix(self):\n        expr = self._primary()\n        while True:\n            t = self._cur().type\n            if t == T.LPAREN:\n                line = self._advance().line\n                args = self._arg_list()\n                self._expect(T.RPAREN, \"')'\")\n                expr = N.Call(expr, args, line)\n            elif t == T.LBRACKET:\n                line = self._advance().line\n                index = self._expression()\n                self._expect(T.RBRACKET, \"']'\")\n                expr = N.Index(expr, index, line)\n            elif t == T.DOT:\n                line = self._advance().line\n                name = self._expect(T.IDENT, \"attribute name\").value\n                expr = N.Attribute(expr, name, line)\n            else:\n                break\n        return expr\n\n    def _arg_list(self):\n        args = []\n        if not self._check(T.RPAREN):\n            args.append(self._expression())\n            while self._match(T.COMMA):\n                if self._check(T.RPAREN):\n                    break\n                args.append(self._expression())\n        return args\n\n    def _primary(self):\n        tok = self._cur()\n        t = tok.type\n        if t == T.INT:\n            self._advance(); return N.IntLit(tok.value, tok.line)\n        if t == T.FLOAT:\n            self._advance(); return N.FloatLit(tok.value, tok.line)\n        if t == T.STRING:\n            self._advance(); return N.StrLit(tok.value, tok.line)\n        if t == T.FSTRING:\n            self._advance(); return self._interp_string(tok)\n        if t == T.TRUE:\n            self._advance(); return N.BoolLit(True, tok.line)\n        if t == T.FALSE:\n            self._advance(); return N.BoolLit(False, tok.line)\n        if t == T.NIL:\n            self._advance(); return N.NilLit(tok.line)\n        if t == T.IDENT:\n            self._advance(); return N.Identifier(tok.value, tok.line)\n        if t == T.LPAREN:\n            self._advance()\n            expr = self._expression()\n            self._expect(T.RPAREN, \"')'\")\n            return expr\n        if t == T.LBRACKET:\n            return self._list_literal()\n        if t == T.LBRACE:\n            return self._map_literal()\n        got = tok.value if tok.value is not None else tok.type\n        raise ParseError(f\"unexpected {got!r}\", tok.line, tok.col)\n\n    def _interp_string(self, tok):\n        \"\"\"Build an InterpStr node from an FSTRING token, parsing each\n        embedded expression's raw source into an AST.\"\"\"\n        parts = []\n        for part in tok.value:\n            if part[0] == \"lit\":\n                parts.append((\"lit\", part[1]))\n            else:\n                _, raw, line = part\n                parts.append((\"expr\", _parse_embedded_expr(raw, line)))\n        return N.InterpStr(parts, tok.line)\n\n    def _list_literal(self):\n        line = self._advance().line  # '['\n        items = []\n        if not self._check(T.RBRACKET):\n            items.append(self._expression())\n            while self._match(T.COMMA):\n                if self._check(T.RBRACKET):\n                    break\n                items.append(self._expression())\n        self._expect(T.RBRACKET, \"']'\")\n        return N.ListLit(items, line)\n\n    def _map_literal(self):\n        line = self._advance().line  # '{'\n        pairs = []\n        self._skip_newlines()\n        if not self._check(T.RBRACE):\n            pairs.append(self._map_pair())\n            while self._match(T.COMMA):\n                self._skip_newlines()\n                if self._check(T.RBRACE):\n                    break\n                pairs.append(self._map_pair())\n        self._skip_newlines()\n        self._expect(T.RBRACE, \"'}'\")\n        return N.MapLit(pairs, line)\n\n    def _map_pair(sel
