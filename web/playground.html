f):\n        key = self._expression()\n        self._expect(T.COLON, \"':'\")\n        value = self._expression()\n        return (key, value)\n\n\ndef _parse_embedded_expr(raw, line):\n    \"\"\"Parse the raw source of a string interpolation into a single\n    expression node. Reports errors against the string's line.\"\"\"\n    from .lexer import tokenize\n    try:\n        tokens = tokenize(raw)\n    except SandyError:\n        raise ParseError(\"invalid expression in interpolation\", line)\n    sub = Parser(tokens)\n    if sub._check(T.EOF):\n        raise ParseError(\"empty interpolation in string\", line)\n    node = sub._expression()\n    sub._skip_newlines()\n    if not sub._check(T.EOF):\n        raise ParseError(\"invalid expression in interpolation\", line)\n    return node\n\n\ndef parse(tokens):\n    return Parser(tokens).parse()\n", "/sandy/repl.py": "\"\"\"A small interactive REPL for Sandy.\"\"\"\n\nimport sys\n\nfrom .errors import SandyError\nfrom .lexer import tokenize\nfrom .parser import parse\nfrom . import nodes as N\nfrom .interpreter import Interpreter\nfrom .values import to_str\n\nBANNER = \"Sandy 0.1.0 — type expressions or statements, 'exit' to quit.\"\n\n\ndef repl():\n    interp = Interpreter()\n    print(BANNER)\n    while True:\n        try:\n            line = input(\"sandy> \")\n        except (EOFError, KeyboardInterrupt):\n            print()\n            break\n        if line.strip() in (\"exit\", \"quit\"):\n            break\n        if not line.strip():\n            continue\n        try:\n            program = parse(tokenize(line))\n            # If the last statement is a bare expression, echo its value.\n            _run_and_echo(interp, program)\n        except SandyError as e:\n            print(e.format(\"Error\"), file=sys.stderr)\n            # Point at the offending column when we know it (single line here).\n            if getattr(e, \"col\", None):\n                print(\"  \" + line, file=sys.stderr)\n                print(\"  \" + \" \" * (e.col - 1) + \"^\", file=sys.stderr)\n\n\ndef _run_and_echo(interp, program):\n    stmts = program.statements\n    if stmts and isinstance(stmts[-1], N.ExprStmt):\n        last = stmts[-1]\n        for s in stmts[:-1]:\n            interp._exec(s, interp.globals)\n        value = interp._eval(last.expr, interp.globals)\n        if value is not None:\n            print(to_str(value))\n    else:\n        interp.run(program)\n", "/sandy/runtime.py": "\"\"\"High-level helpers to run Sandy source code.\"\"\"\n\nimport os\nimport sys\n\nfrom .errors import SandyError, LexError, ParseError, RuntimeErrorSandy\nfrom .lexer import tokenize\nfrom .parser import parse\nfrom .interpreter import Interpreter\n\n\ndef load_module_interpreted(source, base_dir, out, cache):\n    \"\"\"Run an imported module on the tree-walker; return its exported names.\"\"\"\n    interp = Interpreter(out=out)\n    interp.base_dir = base_dir\n    interp.module_cache = cache\n    interp.module_loader = load_module_interpreted\n    interp.run(parse(tokenize(source)))\n    return {n: interp.globals.vars[n] for n in interp.user_names()}\n\n\ndef load_module_vm(source, base_dir, out, cache):\n    \"\"\"Run an imported module on the bytecode VM; return its exported names.\"\"\"\n    from .compiler import compile_program\n    from .vm import VM\n    vm = VM(out=out)\n    vm.rt.base_dir = base_dir\n    vm.rt.module_cache = cache\n    vm.rt.module_loader = load_module_vm\n    vm.run(compile_program(parse(tokenize(source))))\n    return {n: vm.rt.globals.vars[n] for n in vm.rt.user_names()}\n\n\ndef run_source(source, interp=None, filename=\"<stdin>\", base_dir=None):\n    \"\"\"Lex, parse and evaluate Sandy source with the tree-walking engine.\n    Returns the interpreter used. Raises SandyError on a Sandy error.\"\"\"\n    if interp is None:\n        interp = Interpreter()\n    if base_dir is not None:\n        interp.base_dir = base_dir\n    interp.module_loader = load_module_interpreted\n    tokens = tokenize(source)\n    program = parse(tokens)\n    interp.run(program)\n    return interp\n\n\ndef run_source_vm(source, out=None, base_dir=None):\n    \"\"\"Lex, parse, compile and execute Sandy source on the bytecode VM.\"\"\"\n    from .compiler import compile_program\n    from .vm import VM\n    program = parse(tokenize(source))\n    vm = VM(out=out)\n    if base_dir is not None:\n        vm.rt.base_dir = base_dir\n    vm.rt.module_loader = load_module_vm\n    vm.run(compile_program(program))\n\n\ndef type_check_source(source, base_dir=None):\n    \"\"\"Return a list of (message, line) type errors for Sandy source.\"\"\"\n    from .typecheck import TypeChecker\n    return TypeChecker(base_dir=base_dir).check(parse(tokenize(source)))\n\n\ndef build_file(path, output=None, run=False, emit_c=False, gc=False):\n    \"\"\"Compile a Sandy program to a native executable via C.\n\n    Handles the typed scalar core; unsupported features are reported clearly.\n    With gc=True, the generated program manages memory with a conservative\n    garbage collector instead of leaking (for long-running programs).\n    \"\"\"\n    import os\n    import shutil\n    import subprocess\n    import tempfile\n    from .cbackend import to_c, NativeUnsupported\n\n    try:\n        with open(path, \"r\", encoding=\"utf-8\") as f:\n            source = f.read()\n    except OSError as e:\n        print(f\"sandy: cannot open {path}: {e.strerror}\", file=sys.stderr)\n        return 1\n\n    try:\n        csrc = to_c(parse(tokenize(source)))\n    except NativeUnsupported as e:\n        _report(e.format(\"NativeError\"), path, e.line, source)\n        print(\"  the native backend supports Sandy's typed scalar core; run \"\n              \"full programs with `sandy --vm` or `sandy run`.\", file=sys.stderr)\n        return 1\n    except (LexError, ParseError) as e:\n        _report(e.format(\"SyntaxError\"), path, e.line, source)\n        return 1\n\n    cc = next((c for c in (\"cc\", \"gcc\", \"clang\") if shutil.which(c)), None)\n    if cc is None:\n        print(\"sandy: no C compiler found (need cc, gcc, or clang)\",\n              file=sys.stderr)\n        return 1\n\n    if output is None:\n        output = os.path.splitext(os.path.basename(path))[0]\n\n    c_path = output + \".c\" if emit_c else None\n    if c_path is None:\n        fd, c_path = tempfile.mkstemp(suffix=\".c\")\n        os.close(fd)\n    with open(c_path, \"w\", encoding=\"utf-8\") as f:\n        f.write(csrc)\n\n    cc_cmd = [cc, \"-O2\", \"-o\", output, c_path, \"-lm\"]\n    if gc:\n        cc_cmd.insert(1, \"-DSANDY_GC\")\n    try:\n        result = subprocess.run(cc_cmd, capture_output=True, text=True)\n    finally:\n        if not emit_c:\n            try:\n                os.remove(c_path)\n            except OSError:\n                pass\n\n    if result.returncode != 0:\n        print(f\"sandy: C compilation failed:\\n{result.stderr}\", file=sys.stderr)\n        return 1\n\n    print(f\"built native executable: {output}\")\n    if emit_c:\n        print(f\"  (C source kept at {c_path})\")\n    if run:\n        return subprocess.run([os.path.abspath(output)]).returncode\n    return 0\n\n\ndef run_file(path, engine=\"walk\", check_types=True):\n    try:\n        with open(path, \"r\", encoding=\"utf-8\") as f:\n            source = f.read()\n    except OSError as e:\n        print(f\"sandy: cannot open {path}: {e.strerror}\", file=sys.stderr)\n        return 1\n\n    base_dir = os.path.dirname(os.path.abspath(path))\n    try:\n        if check_types:\n            type_errors = type_check_source(source, base_dir=base_dir)\n            if type_errors:\n                _report_type_errors(type_errors, path, source)\n                return 1\n        if engine == \"vm\":\n            run_source_vm(source, base_dir=base_dir)\n        else:\n            run_source(source, Interpreter(), filename=path, base_dir=base_dir)\n    except LexError as e:\n        _report(e.format(\"SyntaxError\"), path, e.line, source, e.col)\n        return 1\n    except ParseError as e:\n        _report(e.format(\"SyntaxError\"), path, e.line, source, e.col)\n        return 1\n    except RuntimeErrorSandy as e:\n        _report(e.format(\"RuntimeError\"), path, e.line, source, e.col)\n        return 1\n    except SandyError as e:\n        _report(e.format(\"Error\"), path, e.line, source, e.col)\n        return 1\n    return 0\n\n\ndef _report_type_errors(errors, path, source):\n    lines = source.splitlines()\n    n = len(errors)\n    print(f\"\\n{path}: found {n} type error{'s' if n != 1 else ''} \"\n          f\"before running:\", file=sys.stderr)\n    for message, line in sorted(errors, key=lambda e: (e[1] or 0)):\n        where = f\" (line {line})\" if line is not None else \"\"\n        print(f\"\\n  TypeError{where}: {message}\", file=sys.stderr)\n        if line is not None and 1 <= line <= len(lines):\n            print(f\"    {line} | {lines[line - 1].strip()}\", file=sys.stderr)\n\n\ndef _report(message, path, line, source, col=None):\n    print(f\"\\n{path}: {message}\", file=sys.stderr)\n    if line is not None:\n        lines = source.splitlines()\n        if 1 <= line <= len(lines):\n            gutter = f\"  {line} | \"\n            print(f\"{gutter}{lines[line - 1]}\", file=sys.stderr)\n            if col is not None and col >= 1:\n                print(\" \" * (len(gutter) + col - 1) + \"^\", file=sys.stderr)\n", "/sandy/suggest.py": "\"\"\"Tiny 'did you mean?' helper for friendly error messages.\n\nUses Levenshtein edit distance to find the closest known name to one the\nuser typed. Kept dependency-free and small.\n\"\"\"\n\n\ndef _edit_distance(a, b):\n    if a == b:\n        return 0\n    if not a:\n        return len(b)\n    if not b:\n        return len(a)\n    prev = list(range(len(b) + 1))\n    for i, ca in enumerate(a, 1):\n        cur = [i]\n        for j, cb in enumerate(b, 1):\n            cost = 0 if ca == cb else 1\n            cur.append(min(\n                prev[j] + 1,        # deletion\n                cur[j - 1] + 1,     # insertion\n                prev[j - 1] + cost,  # substitution\n            ))\n        prev = cur\n    return prev[-1]\n\n\ndef closest_name(name, candidates):\n    \"\"\"Return the closest candidate to `name`, or None if none is close\n    enough to be a plausible typo.\"\"\"\n    best = None\n    best_dist = None\n    for cand in candidates:\n        d = _edit_distance(name, cand)\n        if best_dist is None or d < best_dist:\n            best_dist = d\n            best = cand\n    if best is None:\n        return None\n    # Only suggest when it's plausibly a typo, not a wild guess.\n    threshold = max(2, len(name) // 2)\n    if best_dist <= threshold:\n        return best\n    return None\n", "/sandy/tokens.py": "\"\"\"Token definitions for the Sandy lexer.\"\"\"\n\n\nclass TokenType:\n    # Literals\n    INT = \"INT\"\n    FLOAT = \"FLOAT\"\n    STRING = \"STRING\"\n    FSTRING = \"FSTRING\"  # interpolated string: value is a list of parts\n    IDENT = \"IDENT\"\n\n    # Keywords\n    FN = \"FN\"\n    RETURN = \"RETURN\"\n    IF = \"IF\"\n    ELIF = \"ELIF\"\n    ELSE = \"ELSE\"\n    WHILE = \"WHILE\"\n    FOR = \"FOR\"\n    IN = \"IN\"\n    BREAK = \"BREAK\"\n    CONTINUE = \"CONTINUE\"\n    TRY = \"TRY\"\n    CATCH = \"CATCH\"\n    THROW = \"THROW\"\n    STRUCT = \"STRUCT\"\n    IMPORT = \"IMPORT\"\n    TRUE = \"TRUE\"\n    FALSE = \"FALSE\"\n    NIL = \"NIL\"\n    AND = \"AND\"\n    OR = \"OR\"\n    NOT = \"NOT\"\n\n    # Operators\n    PLUS = \"PLUS\"\n    MINUS = \"MINUS\"\n    STAR = \"STAR\"\n    SLASH = \"SLASH\"\n    PERCENT = \"PERCENT\"\n    STARSTAR = \"STARSTAR\"\n    ASSIGN = \"ASSIGN\"\n    PLUS_EQ = \"PLUS_EQ\"\n    MINUS_EQ = \"MINUS_EQ\"\n    STAR_EQ = \"STAR_EQ\"\n    SLASH_EQ = \"SLASH_EQ\"\n    EQ = \"EQ\"\n    NEQ = \"NEQ\"\n    LT = \"LT\"\n    GT = \"GT\"\n    LE = \"LE\"\n    GE = \"GE\"\n\n    # Delimiters\n    LPAREN = \"LPAREN\"\n    RPAREN = \"RPAREN\"\n    LBRACE = \"LBRACE\"\n    RBRACE = \"RBRACE\"\n    LBRACKET = \"LBRACKET\"\n    RBRACKET = \"RBRACKET\"\n    COMMA = \"COMMA\"\n    COLON = \"COLON\"\n    DOT = \"DOT\"\n    ARROW = \"ARROW\"  # -> for return-type annotations\n\n    NEWLINE = \"NEWLINE\"\n    EOF = \"EOF\"\n\n\nKEYWORDS = {\n    \"fn\": TokenType.FN,\n    \"return\": TokenType.RETURN,\n    \"if\": TokenType.IF,\n    \"elif\": TokenType.ELIF,\n    \"else\": TokenType.ELSE,\n    \"while\": TokenType.WHILE,\n    \"for\": TokenType.FOR,\n    \"in\": TokenType.IN,\n    \"break\": TokenType.BREAK,\n    \"continue\": TokenType.CONTINUE,\n    \"try\": TokenType.TRY,\n    \"catch\": TokenType.CATCH,\n    \"throw\": TokenType.THROW,\n    \"struct\": TokenType.STRUCT,\n    \"import\": TokenType.IMPORT,\n    \"true\": TokenType.TRUE,\n    \"false\": TokenType.FALSE,\n    \"nil\": TokenType.NIL,\n    \"and\": TokenType.AND,\n    \"or\": TokenType.OR,\n    \"not\": TokenType.NOT,\n}\n\n# Tokens after which a NEWLINE is treated as line continuation (suppressed),\n# because the statement clearly is not complete yet.\nCONTINUATION_TYPES = {\n    TokenType.PLUS, TokenType.MINUS, TokenType.STAR, TokenType.SLASH,\n    TokenType.PERCENT, TokenType.STARSTAR, TokenType.ASSIGN,\n    TokenType.PLUS_EQ, TokenType.MINUS_EQ, TokenType.STAR_EQ, TokenType.SLASH_EQ,\n    TokenType.EQ, TokenType.NEQ, TokenType.LT, TokenType.GT, TokenType.LE,\n    TokenType.GE, TokenType.AND, TokenType.OR, TokenType.NOT,\n    TokenType.COMMA, TokenType.COLON, TokenType.DOT,\n    TokenType.LPAREN, TokenType.LBRACKET, TokenType.LBRACE,\n}\n\n\nclass Token:\n    __slots__ = (\"type\", \"value\", \"line\", \"col\")\n\n    def __init__(self, type_, value, line, col=1):\n        self.type = type_\n        self.value = value\n        self.line = line\n        self.col = col\n\n    def __repr__(self):\n        return f\"Token({self.type}, {self.value!r}, line={self.line}, col={self.col})\"\n", "/sandy/typecheck.py": "\"\"\"A gradual static type checker for Sandy.\n\nGradual means: annotations are optional. Anything without a type is treated\nas `any`, and `any` is compatible with everything, so fully dynamic Sandy\ncode produces zero type errors and behaves exactly as before. Where you *do*\nadd annotations, the checker proves types line up before the program runs —\ncatching a class of bugs at \"compile\" time instead of at runtime.\n\nThe checker is intentionally conservative: it only reports an error when two\n*known, non-any* types definitely conflict. It never guesses.\n\"\"\"\n\nimport os\n\nfrom . import nodes as N\n\nNUM = (\"int\", \"float\")\n\n# Sentinel marking a module mid-analysis (to break import cycles).\n_ANALYZING = object()\n_PRIMITIVES = (\"int\", \"float\", \"string\", \"bool\", \"nil\", \"list\", \"map\")\n\n\nclass FuncType:\n    __slots__ = (\"params\", \"ret\")\n\n    def __init__(self, params, ret):\n        self.params = params      # list of type names (str), 'any' allowed\n        self.ret = ret            # type name (str)\n\n\nclass Scope:\n    def __init__(self, parent=None):\n        self.vars = {}\n        self.parent = parent\n\n    def get(self, name):\n        s = self\n        while s is not None:\n            if name in s.vars:\n                return s.vars[name]\n            s = s.parent\n        return None\n\n    def define(self, name, type_):\n        self.vars[name] = type_\n\n\nclass StructDecl:\n    \"\"\"A struct type known to the checker: field names and their types.\"\"\"\n    __slots__ = (\"name\", \"fields\", \"field_types\")\n\n    def __init__(self, name, fields, field_types):\n        self.name = name\n        self.fields = fields              # list of field names\n        self.field_types = field_types    # dict field -> normalized type\n\n\nclass ModuleType:\n    \"\"\"An imported module's exported members and their types.\"\"\"\n    __slots__ = (\"name\", \"members\")\n\n    def __init__(self, name, members):\n        self.name = name\n        self.members = members            # dict name -> type / FuncType / StructDecl\n\n\ndef type_name(t):\n    if isinstance(t, FuncType):\n        return \"function\"\n    if isinstance(t, StructDecl):\n        return t.name\n    return t if t is not None else \"any\"\n\n\ndef _norm(t):\n    \"\"\"Normalize an annotation (None -> 'any').\"\"\"\n    return \"any\" if t is None else t\n\n\ndef _base(t):\n    \"\"\"Base name of a (possibly parameterized) type: list<int> -> list.\"\"\"\n    if isinstance(t, str) and \"<\" in t:\n        return t[:t.index(\"<\")]\n    return t\n\n\ndef _split_top(s):\n    \"\"\"Split a comma list at the top nesting level: 'string,list<int>'.\"\"\"\n    parts, depth, start = [], 0, 0\n    for i, ch in enumerate(s):\n        if ch == \"<\":\n            depth += 1\n        elif ch == \">\":\n            depth -= 1\n        elif ch == \",\" and depth == 0:\n            parts.append(s[start:i]); start = i + 1\n    parts.append(s[start:])\n    return parts\n\n\ndef _type_args(t):\n    \"\"\"Type arguments of a parameterized type. An unparameterized list/map is\n    treated as fully gradual (element type `any`).\"\"\"\n    if isinstance(t, str) and \"<\" in t:\n        return tuple(_split_top(t[t.index(\"<\") + 1:-1]))\n    if t == \"list\":\n        return (\"any\",)\n    if t == \"map\":\n        return (\"any\", \"any\")\n    return ()\n\n\ndef assignable(expected, actual):\n    \"\"\"Can a value of `actual` type be used where `expected` is wanted?\"\"\"\n    if expected is None or actual is None:\n        return True\n    if expected == \"any\" or actual == \"any\":\n        return True\n    if isinstance(expected, StructDecl) or isinstance(actual, StructDecl):\n        return True  # struct-type values used as data are gradual\n    if isinstance(expected, FuncType) or isinstance(actual, FuncType):\n        return isinstance(expected, FuncType) and isinstance(actual, FuncType)\n    eb, ab = _base(expected), _base(actual)\n    if eb in (\"list\", \"map\") and ab == eb:\n        # Element/value types checked gradually (any is compatible).\n        return all(assignable(x, y)\n                   for x, y in zip(_type_args(expected), _type_args(actual)))\n    if eb == ab:\n        return True\n    if eb == \"float\" and ab == \"int\":\n        return True  # int widens to float\n    return False\n\n\nclass TypeChecker:\n    def __init__(self, base_dir=None, module_cache=None):\n        self.errors = []  # list of (message, line)\n        self.structs = {}  # struct name -> StructDecl (for field lookups)\n        self.base_dir = base_dir            # for resolving imports\n        self.module_cache = {} if module_cache is None else module_cache\n\n    def error(self, msg, line):\n        self.errors.append((msg, line))\n\n    def check(self, program):\n        scope = Scope()\n        self._check_block(program, scope, expected_ret=None)\n        return self.errors\n\n    # -- module analysis (extract exported member types) --\n    def _resolve_module(self, path):\n        rel = path if path.endswith(\".sy\") else path + \".sy\"\n        base = self.base_dir or os.getcwd()\n        candidate = os.path.abspath(os.path.join(base, rel))\n        if os.path.exists(candidate):\n            return candidate\n        stdlib = os.path.join(os.path.dirname(__file__), \"stdlib\", rel)\n        if os.path.exists(stdlib):\n            return os.path.abspath(stdlib)\n        return None\n\n    def _analyze_module(self, path):\n        \"\"\"Return a ModuleType for an import, or None if it can't be analyzed\n        (missing file, syntax error, or an import cycle — the runtime reports\n        real load failures; the checker just stays gradual).\"\"\"\n        abspath = self._resolve_module(path)\n        if abspath is None:\n            return None\n        cached = self.module_cache.get(abspath)\n        if cached is _ANALYZING:\n            return None  # cycle: treat members as `any`\n        if cached is not None:\n            self._merge_structs(cached)\n            return cached\n        self.module_cache[abspath] = _ANALYZING\n        try:\n            from .lexer import tokenize\n            from .parser import parse\n            with open(abspath, \"r\", encoding=\"utf-8\") as f:\n                program = parse(tokenize(f.read()))\n        except Exception:\n            self.module_cache.pop(abspath, None)\n            return None\n        sub = TypeChecker(base_dir=os.path.dirname(abspath),\n                          module_cache=self.module_cache)\n        scope = Scope()\n        sub._check_block(program, scope, expected_ret=None)  # errors ignored\n        name = os.path.splitext(os.path.basename(abspath))[0]\n        module = ModuleType(name, dict(scope.vars))\n        self.module_cache[abspath] = module\n        self._merge_structs(module)\n        return module\n\n    def _merge_structs(self, module):\n        # Make imported struct types available for field-access checking.\n        for member in module.members.values():\n            if isinstance(member, StructDecl) and member.name not in self.structs:\n                self.structs[member.name] = member\n\n    # -- statements --\n    def _collect_structs(self, block, scope):\n        for stmt in block.statements:\n            if isinstance(stmt, N.StructDef):\n                ftypes = {f: _norm(t)\n                          for f, t in zip(stmt.fields, stmt.field_types)}\n                decl = StructDecl(stmt.name, list(stmt.fields), ftypes)\n                scope.define(stmt.name, decl)\n                self.structs[stmt.name] = decl\n\n    def _collect_functions(self, block, scope):\n        \"\"\"Register function signatures first so recursion and forward\n        references type-check.\"\"\"\n        for stmt in block.statements:\n            if isinstance(stmt, N.FuncDef):\n                params = [_norm(t) for t in stmt.param_types]\n                scope.define(stmt.name, FuncType(params, _norm(stmt.ret_type)))\n\n    def _check_block(self, block, scope, expected_ret):\n        self._collect_structs(block, scope)\n        self._collect_functions(block, scope)\n        for stmt in block.statements:\n            self._check_stmt(stmt, scope, expected_ret)\n\n    def _check_type(self, t, line):\n        \"\"\"Report a type annotation that names no known type.\"\"\"\n        if t is None:\n            return\n        base = _base(t)\n        if base in (\"list\", \"map\"):\n            for arg in _type_args(t):\n                self._check_type(arg, line)\n            return\n        if base in _PRIMITIVES or base in (\"any\", \"fn\"):\n            return\n        if base in self.structs:\n            return\n        self.error(f\"unknown type '{t}'\", line)\n\n    def _check_stmt(self, node, scope, expected_ret):\n        t = type(node)\n        if t is N.Assign:\n            self._check_assign(node, scope)\n        elif t is N.ExprStmt:\n            self._infer(node.expr, scope)\n        elif t is N.If:\n            for cond, block in node.branches:\n                self._infer(cond, scope)\n                self._check_block(block, scope, expected_ret)\n            if node.else_block is not None:\n                self._check_block(node.else_block, scope, expected_ret)\n        elif t is N.While:\n            self._infer(node.cond, scope)\n            self._check_block(node.body, scope, expected_ret)\n        elif t is N.For:\n            self._infer(node.iterable, scope)\n            scope.define(node.var, \"any\")  # element type is not tracked yet\n            self._check_block(node.body, scope, expected_ret)\n        elif t is N.FuncDef:\n            self._check_funcdef(node, scope)\n        elif t is N.Return:\n            self._check_return(node, scope, expected_ret)\n        elif t is N.Try:\n            self._check_block(node.body, scope, expected_ret)\n            # The caught error is always a string message.\n            scope.define(node.catch_var, \"string\")\n            self._check_block(node.handler, scope, expected_ret)\n        elif t is N.Throw:\n            self._infer(node.value, scope)\n        elif t is N.Import:\n            module = self._analyze_module(node.path)\n            scope.define(node.alias, module if module is not None else \"any\")\n        elif t is N.StructDef:\n            for ft in node.field_types:\n                self._check_type(ft, node.line)\n        # Break / Continue: nothing to check\n\n    def _check_assign(self, node, scope):\n        value_t = self._infer(node.value, scope)\n        target = node.target\n        if isinstance(target, N.Identifier):\n            if node.annotation is not None:\n                # Annotated declaration: value must fit the annotation.\n                self._check_type(node.annotation, node.line)\n                if not assignable(node.annotation, value_t):\n                    self.error(\n                        f\"cannot assign {type_name(value_t)} to '{target.name}' \"\n                        f\"declared as {type_name(node.annotation)}\", node.line)\n                scope.define(target.name, node.annotation)\n            else:\n                declared = scope.get(target.name)\n                if isinstance(declared, str) and declared not in (\"any\", None):\n                    # Reassigning a previously-typed variable: must still fit.\n                    if not assignable(declared, value_t):\n                        self.error(\n                            f\"cannot assign {type_name(value_t)} to '{target.name}' \"\n                            f\"declared as {type_name(declared)}\", node.line)\n                elif declared is None:\n                    scope.define(target.name, \"any\")\n        elif isinstance(target, N.Attribute):\n            decl = self.structs.get(self._infer(target.target, scope))\n            if decl is not None:\n                if target.name not in decl.field_types:\n                    self.error(\n                        f\"{decl.name} has no field '{target.name}'\", node.line)\n                elif not assignable(decl.field_types[target.name], value_t):\n                    self.error(\n                        f\"cannot assign {type_name(value_t)} to field \"\n                        f\"'{target.name}' of {decl.name} \"\n                        f\"(expects {type_name(decl.field_types[target.name])})\",\n                        node.line)\n        else:\n            # Index assignment: evaluate parts to surface nested errors.\n            self._infer(target, scope)\n\n    def _check_funcdef(self, node, scope):\n        fn_scope = Scope(scope)\n        for name, ann in zip(node.params, node.param_types):\n            self._check_type(ann, node.line)\n            fn_scope.define(name, _norm(ann))\n        self._check_type(node.ret_type, node.line)\n        ret = _norm(node.ret_type)\n        expected = None if ret == \"any\" else ret\n        self._check_block(node.body, fn_scope, expected)\n\n    def _check_return(self, node, scope, expected_ret):\n        if node.value is None:\n            actual = \"nil\"\n        else:\n            actual = self._infer(node.value, scope)\n        if expected_ret is not None and not assignable(expected_ret, actual):\n            self.error(\n                f\"return type mismatch: expected {type_name(expected_ret)}, \"\n                f\"got {type_name(actual)}\", node.line)\n\n    # -- expression type inference --\n    def _infer(self, node, scope):\n        m = self._INFER.get(type(node))\n        if m is None:\n            return \"any\"\n        return m(self, node, scope)\n\n    def _i_int(self, node, scope):\n        return \"int\"\n\n    def _i_float(self, node, scope):\n        return \"float\"\n\n    def _i_str(self, node, scope):\n        return \"string\"\n\n    def _i_bool(self, node, scope):\n        return \"bool\"\n\n    def _i_nil(self, node, scope):\n        return \"nil\"\n\n    def _i_list(self, node, scope):\n        elems = [self._infer(item, scope) for item in node.items]\n        if elems and all(e == elems[0] and e not in (\"any\", None) for e in elems):\n            return f\"list<{elems[0]}>\"\n        return \"list\"\n\n    def _i_map(self, node, scope):\n        kts, vts = [], []\n        for k, v in node.pairs:\n            kts.append(self._infer(k, scope))\n            vts.append(self._infer(v, scope))\n        if kts and all(k == kts[0] and k not in (\"any\", None) for k in kts) \\\n                and all(v == vts[0] and v not in (\"any\", None) for v in vts):\n            return f\"map<{kts[0]},{vts[0]}>\"\n        return \"map\"\n\n    def _i_interp(self, node, scope):\n        for kind, payload in node.parts:\n            if kind == \"expr\":\n                self._infer(payload, scope)\n        return \"string\"\n\n    def _i_identifier(self, node, scope):\n        t = scope.get(node.name)\n        return t if t is not None else \"any\"\n\n    def _i_binary(self, node, scope):\n        lt = self._infer(node.left, scope)\n        rt = self._infer(node.right, scope)\n        return self._binary_type(node.op, lt, rt, node.line)\n\n    def _i_unary(self, node, scope):\n        t = self._infer(node.operand, scope)\n        if node.op == \"not\":\n            return \"bool\"\n        # negation\n        if t in (\"any\", None):\n            return \"any\"\n        if t in NUM:\n            return t\n        self.error(f\"cannot negate a {type_name(t)}\", node.line)\n        return \"any\"\n\n    def _i_logical(self, node, scope):\n        self._infer(node.left, scope)\n        self._infer(node.right, scope)\n        return \"any\"  # result is one of the two operands\n\n    def _i_call(self, node, scope):\n        callee_t = self._infer(node.callee, scope)\n        arg_types = [self._infer(a, scope) for a in node.args]\n        if isinstance(callee_t, StructDecl):\n            # Struct construction: one argument per field, types must fit.\n            if len(arg_types) != len(callee_t.fields):\n                self.error(\n                    f\"{callee_t.name}() expects {len(callee_t.fields)} \"\n                    f\"field(s), got {len(arg_types)}\", node.line)\n            else:\n                for i, (f, at) in enumerate(zip(callee_t.fields, arg_types)):\n                    ft = callee_t.field_types[f]\n                    if not assignable(ft, at):\n                        self.error(\n                            f\"field '{f}' of {callee_t.name} expects \"\n                            f\"{type_name(ft)}, got {type_name(at)}\",\n                            node.args[i].line)\n            return callee_t.name   # an instance's type is the struct's name\n        if isinstance(callee_t, FuncType):\n            if isinstance(node.callee, (N.Identifier, N.Attribute)):\n                fname = node.callee.name + \"()\"\n            else:\n                fname = \"function\"\n            if len(arg_types) != len(callee_t.params):\n                self.error(\n                    f\"{fname} expects {len(callee_t.params)} argument(s), \"\n                    f\"got {len(arg_types)}\", node.line)\n            else:\n                for i, (pt, at) in enumerate(zip(callee_t.params, arg_types)):\n                    if not assignable(pt, at):\n                        self.error(\n                            f\"argument {i + 1} of {fname} expects \"\n                            f\"{type_name(pt)}, got {type_name(at)}\",\n                            node.args[i].line)\n            return callee_t.ret\n        return \"any\"\n\n    def _i_index(self, node, scope):\n        target_t = self._infer(node.target, scope)\n        self._infer(node.index, scope)\n        if target_t == \"string\":\n            return \"string\"\n        if _base(target_t) == \"list\":\n            return _type_args(target_t)[0]      # element type\n        if _base(target_t) == \"map\":\n            return _type_args(target_t)[1]      # value type\n        return \"any\"\n\n    def _i_attribute(self, node, scope):\n        target_t = self._infer(node.target, scope)\n        if isinstance(target_t, ModuleType):\n            if node.name in target_t.members:\n                return target_t.members[node.name]\n            self.error(\n                f\"module '{target_t.name}' has no member '{node.name}'\",\n                node.line)\n            return \"any\"\n        decl = self.structs.get(target_t)\n        if decl is not None:\n            if node.name in decl.field_types:\n                return decl.field_types[node.name]\n            self.error(f\"{decl.name} has no field '{node.name}'\", node.line)\n        return \"any\"\n\n    def _binary_type(self, op, lt, rt, line):\n        unknown = lt in (\"any\", None) or rt in (\"any\", None)\n        if op in (\"==\", \"!=\"):\n            return \"bool\"\n        if op in (\"<\", \">\", \"<=\", \">=\"):\n            if unknown:\n                return \"bool\"\n            if (lt in NUM and rt in NUM) or (lt == \"string\" and rt == \"string\"):\n                return \"bool\"\n            self.error(\n                f\"cannot compare {type_name(lt)} and {type_name(rt)}\", line)\n            return \"bool\"\n        if unknown:\n            return \"any\"\n        if op == \"+\":\n            if lt in NUM and rt in NUM:\n                return self._num_result(op, lt, rt)\n            if lt == \"string\" and rt == \"string\":\n                return \"string\"\n            if _base(lt) == \"list\" and _base(rt) == \"list\":\n                return lt if lt == rt else \"list\"\n            self.error(f\"cannot add {type_name(lt)} and {type_name(rt)}\", line)\n            return \"any\"\n        if op == \"*\":\n            if lt in NUM and rt in NUM:\n                return self._num_result(op, lt, rt)\n            if (lt == \"string\" and rt == \"int\") or (lt == \"int\" and rt == \"string\"):\n                return \"string\"\n            if (_base(lt) == \"list\" and rt == \"int\"):\n                return lt\n            if (lt == \"int\" and _base(rt) == \"list\"):\n                return rt\n            self.error(f\"cannot multiply {type_name(lt)} and {type_name(rt)}\", line)\n            return \"any\"\n        # - / % **\n        if lt in NUM and rt in NUM:\n            if op == \"/\":\n                return \"float\"\n            return self._num_result(op, lt, rt)\n        verb = {\"-\": \"subtract\", \"/\": \"divide\", \"%\": \"take modulo of\",\n                \"**\": \"raise to a power\"}.get(op, \"combine\")\n        self.error(\n            f\"cannot {verb} {type_name(lt)} and {type_name(rt)}\", line)\n        return \"any\"\n\n    @staticmethod\n    def _num_result(op, lt, rt):\n        if op == \"/\":\n            return \"float\"\n        if lt == \"float\" or rt == \"float\":\n            return \"float\"\n        if op == \"**\":\n            return \"any\"  # int ** negative-int is float; stay conservative\n        return \"int\"\n\n\nTypeChecker._INFER = {\n    N.IntLit: TypeChecker._i_int,\n    N.FloatLit: TypeChecker._i_float,\n    N.StrLit: TypeChecker._i_str,\n    N.BoolLit: TypeChecker._i_bool,\n    N.NilLit: TypeChecker._i_nil,\n    N.ListLit: TypeChecker._i_list,\n    N.MapLit: TypeChecker._i_map,\n    N.InterpStr: TypeChecker._i_interp,\n    N.Identifier: TypeChecker._i_identifier,\n    N.BinaryOp: TypeChecker._i_binary,\n    N.UnaryOp: TypeChecker._i_unary,\n    N.LogicalOp: TypeChecker._i_logical,\n    N.Call: TypeChecker._i_call,\n    N.Index: TypeChecker._i_index,\n    N.Attribute: TypeChecker._i_attribute,\n}\n\n\ndef check(program):\n    \"\"\"Type-check a parsed program. Returns a list of (message, line).\"\"\"\n    return TypeChecker().check(program)\n", "/sandy/values.py": "\"\"\"Runtime values and their display formatting for Sandy.\n\nSandy reuses Python's native types where possible:\n  int   -> int\n  float -> float\n  string-> str\n  bool  -> bool\n  nil   -> None\n  list  -> list\n  map   -> dict\n\nCallable values are represented by Function / BuiltinFunction below.\n\"\"\"\n\n\nclass Function:\n    \"\"\"A user-defined Sandy function (closure).\"\"\"\n    __slots__ = (\"name\", \"params\", \"body\", \"closure\", \"param_types\")\n\n    def __init__(self, name, params, body, closure, param_types=None):\n        self.name = name\n        self.params = params\n        self.body = body\n        self.closure = closure  # defining environment\n        # None means no annotations; otherwise aligned with params.\n        self.param_types = param_types if (param_types and any(param_types)) else None\n\n    def __repr__(self):\n        return f\"<fn {self.name}({', '.join(self.params)})>\"\n\n\nclass BuiltinFunction:\n    \"\"\"A built-in function implemented in Python.\"\"\"\n    __slots__ = (\"name\", \"fn\", \"arity\")\n\n    def __init__(self, name, fn, arity=None):\n        self.name = name\n        self.fn = fn\n        self.arity = arity  # None = variadic; int or (min, max) tuple\n\n    def __repr__(self):\n        return f\"<builtin {self.name}>\"\n\n\nclass StructType:\n    \"\"\"A user-defined struct type (the value bound to the struct's name).\"\"\"\n    __slots__ = (\"name\", \"fields\", \"field_types\")\n\n    def __init__(self, name, fields, field_types):\n        self.name = name\n        self.fields = fields            # list of field names\n        self.field_types = field_types  # aligned list (str or None)\n\n    def __repr__(self):\n        return f\"<struct {self.name}>\"\n\n\nclass StructInstance:\n    \"\"\"An instance of a struct: its type plus a field -> value mapping.\"\"\"\n    __slots__ = (\"struct\", \"values\")\n\n    def __init__(self, struct, values):\n        self.struct = struct\n        self.values = values            # dict field -> value (insertion order)\n\n    def __repr__(self):\n        return to_str(self)\n\n\nclass Module:\n    \"\"\"An imported Sandy module: a named namespace of top-level bindings.\"\"\"\n    __slots__ = (\"name\", \"namespace\")\n\n    def __init__(self, name, namespace):\n        self.name = name\n        self.namespace = namespace   # dict name -> value\n\n    def __repr__(self):\n        return f\"<module '{self.name}'>\"\n\n\ndef type_name(value):\n    if value is None:\n        return \"nil\"\n    if value is True or value is False:\n        return \"bool\"\n    if isinstance(value, int):\n        return \"int\"\n    if isinstance(value, float):\n        return \"float\"\n    if isinstance(value, str):\n        return \"string\"\n    if isinstance(value, list):\n        return \"list\"\n    if isinstance(value, dict):\n        return \"map\"\n    if isinstance(value, StructInstance):\n        return value.struct.name\n    if isinstance(value, StructType):\n        return \"struct\"\n    if isinstance(value, Module):\n        return \"module\"\n    if isinstance(value, (Function, BuiltinFunction)):\n        return \"function\"\n    return \"unknown\"\n\n\ndef is_truthy(value):\n    if value is None or value is False:\n        return False\n    if value is True:\n        return True\n    if isinstance(value, (int, float)):\n        return value != 0\n    if isinstance(value, str):\n        return len(value) != 0\n    if isinstance(value, (list, dict)):\n        return len(value) != 0\n    return True\n\n\ndef to_str(value):\n    \"\"\"Human-facing string form (what print shows).\"\"\"\n    if value is None:\n        return \"nil\"\n    if value is True:\n        return \"true\"\n    if value is False:\n        return \"false\"\n    if isinstance(value, str):\n        return value\n    if isinstance(value, float):\n        # Show a clean float: 3.0 not 3, but avoid trailing noise.\n        if value == int(value) and abs(value) < 1e16:\n            return f\"{value:.1f}\"\n        return repr(value)\n    if isinstance(value, list):\n        return \"[\" + \", \".join(to_repr(v) for v in value) + \"]\"\n    if isinstance(value, dict):\n        inner = \", \".join(f\"{to_repr(k)}: {to_repr(v)}\" for k, v in value.items())\n        return \"{\" + inner + \"}\"\n    if isinstance(value, StructInstance):\n        inner = \", \".join(f\"{k}={to_repr(v)}\" for k, v in value.values.items())\n        return f\"{value.struct.name}({inner})\"\n    if isinstance(value, StructType):\n        return f\"<struct {value.name}>\"\n    if isinstance(value, (Function, BuiltinFunction)):\n        return repr(value)\n    return str(value)\n\n\ndef to_repr(value):\n    \"\"\"Form used inside containers (strings get quotes).\"\"\"\n    if isinstance(value, str):\n        return '\"' + value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"') + '\"'\n    return to_str(value)\n", "/sandy/vm.py": "\"\"\"A stack-based virtual machine that executes Sandy bytecode.\n\nThe VM reuses the tree-walking Interpreter for its runtime helpers\n(operators, indexing, builtins, value formatting) so both engines share\nexactly one set of semantics. What the VM changes is *how* code is driven:\na flat instruction loop with an explicit frame stack, instead of recursive\nAST walking. That removes per-node Python call overhead and lets hot\narithmetic take inlined fast paths.\n\nThe opcode dispatch below is ordered by how often each instruction runs in\ntight loops (name/const loads, jumps, the loop step, add/compare) so the\nhottest paths are found after the fewest comparisons.\n\"\"\"\n\nfrom .errors import RuntimeErrorSandy\nfrom .interpreter import Interpreter, Environment\nfrom .values import (BuiltinFunction, Function, StructType, StructInstance,\n                     is_truthy, to_str, type_name)\nfrom . import bytecode as B\n\n_SENTINEL = object()\n\n\nclass VMFunction:\n    __slots__ = (\"name\", \"params\", \"param_types\", \"code\", \"closure\")\n\n    def __init__(self, name, params, code, closure):\n        self.name = name\n        self.params = params\n        self.param_types = code.param_types\n        self.code = code\n        self.closure = closure\n\n    def __repr__(self):\n        return f\"<fn {self.name}({', '.join(self.params)})>\"\n\n\nclass _Frame:\n    __slots__ = (\"code\", \"ip\", \"stack\", \"env\")\n\n    def __init__(self, code, env):\n        self.code = code\n        self.ip = 0\n        self.stack = []\n        self.env = env\n\n\nclass VM:\n    def __init__(self, out=None):\n        # Reuse an Interpreter purely for its runtime helpers + builtins.\n        self.rt = Interpreter(out=out)\n        self.genv = self.rt.globals\n\n    def run(self, code):\n        frames = [_Frame(code, self.genv)]\n        handlers = []   # (frame, handler_ip, stack_len) for open try blocks\n        while True:\n            try:\n                return self._exec(frames, handlers)\n            except RuntimeErrorSandy as err:\n                if not handlers:\n                    raise\n                # Unwind to the innermost handler's frame, restore its stack,\n                # hand the error message to the catch block, and resume there.\n                hframe, hip, hlen = handlers.pop()\n                while frames and frames[-1] is not hframe:\n                    frames.pop()\n                del hframe.stack[hlen:]\n                hframe.stack.append(err.message)\n                hframe.ip = hip\n\n    def _exec(self, frames, handlers):\n        rt = self.rt\n        _binary = rt._binary\n        _truthy = is_truthy\n\n        while frames:\n            frame = frames[-1]\n            ops = frame.code.ops\n            consts = frame.code.consts\n            lines = frame.code.lines\n            stack = frame.stack\n            env = frame.env\n            push = stack.append\n            switched = False\n            ip = frame.ip\n\n            while True:\n                op, arg = ops[ip]\n                ip += 1\n\n                # --- hottest: loads ---\n                if op == B.LOAD_NAME:\n                    e = env\n                    while e is not None:\n                        d = e.vars\n                        if arg in d:\n                            push(d[arg])\n                            break\n                        e = e.parent\n                    else:\n                        env.get(arg, lines[ip - 1])  # raises with a suggestion\n                elif op == B.LOAD_CONST:\n                    push(consts[arg])\n\n                # --- stack / control that runs every loop turn ---\n                elif op == B.POP:\n                    stack.pop()\n                elif op == B.JUMP:\n                    ip = arg\n                elif op == B.JUMP_IF_FALSE:\n                    if not _truthy(stack.pop()):\n                        ip = arg\n                elif op == B.STORE_NAME:\n                    env.assign(arg, stack.pop())\n                elif op == B.FOR_ITER:\n                    nxt = next(stack[-1], _SENTINEL)\n                    if nxt is _SENTINEL:\n                        stack.pop()\n                        ip = arg\n                    else:\n                        push(nxt)\n                elif op == B.DEFINE_NAME:\n                    env.vars[arg] = stack.pop()\n\n                # --- hot arithmetic / comparison (specialized + generic) ---\n                # The specialized *_NUM ops are emitted when the compiler has\n                # proven both operands numeric, so the common path skips type\n                # dispatch. They stay sound under gradual typing via a cheap\n                # guard: CPython 3.11 exception tables make the try free when\n                # no error occurs, and any surprise value falls back to the\n                # fully-checked operator (raising the proper Sandy error). Each\n                # *_NUM sits next to its generic twin to keep dispatch short\n                # for both typed and untyped code.\n                elif op == B.BINARY_ADD_NUM:\n                    b = stack.pop()\n                    try:\n                        stack[-1] = stack[-1] + b\n                    except TypeError:\n                        stack[-1] = _binary(\"+\", stack[-1], b, lines[ip - 1])\n                elif op == B.BINARY_ADD:\n                    b = stack.pop(); a = stack.pop()\n                    ta = type(a); tb = type(b)\n                    if (ta is int or ta is float) and (tb is int or tb is float):\n                        push(a + b)\n                    else:\n                        push(_binary(\"+\", a, b, lines[ip - 1]))\n                elif op == B.CMP_LT_NUM:\n                    b = stack.pop()\n                    try:\n                        stack[-1] = stack[-1] < b\n                    except TypeError:\n                        stack[-1] = _binary(\"<\", stack[-1], b, lines[ip - 1])\n                elif op == B.CMP_LT:\n                    b = stack.pop(); a = stack.pop()\n                    ta = type(a); tb = type(b)\n                    if (ta is int or ta is float) and (tb is int or tb is float):\n                        push(a < b)\n                    else:\n                        push(_binary(\"<\", a, b, lines[ip - 1]))\n                elif op == B.BINARY_SUB_NUM:\n                    b = stack.pop()\n                    try:\n                        stack[-1] = stack[-1] - b\n                    except TypeError:\n                        stack[-1] = _binary(\"-\", stack[-1], b, lines[ip - 1])\n                elif op == B.BINARY_SUB:\n                    b = stack.pop(); a = stack.pop()\n                    ta = type(a); tb = type(b)\n                    if (ta is int or ta is float) and (tb is int or tb is float):\n                        push(a - b)\n                    else:\n                        push(_binary(\"-\", a, b, lines[ip - 1]))\n\n                # --- calls / returns (once per invocation) ---\n                elif op == B.CALL:\n                    argc = arg\n                    if argc:\n                        args = stack[-argc:]\n rror:\n                        stack[-1] = _binary(\">=\", stack[-1], b, lines[ip - 1])\n                elif op == B.CMP_GE:\n                    b = stack.pop(); a = stack.pop()\n                    ta = type(a); tb = type(b)\n                    if (ta is int or ta is float) and (tb is int or tb is float):\n                        push(a >= b)\n                    else:\n                        push(_binary(\">=\", a, b, lines[ip - 1]))\n\n                # --- remaining arithmetic ---\n                elif op == B.BINARY_MUL_NUM:\n                    b = stack.pop()\n                    try:\n                        stack[-1] = stack[-1] * b\n                    except TypeError:\n                        stack[-1] = _binary(\"*\", stack[-1], b, lines[ip - 1])\n                elif op == B.BINARY_MUL:\n                    b = stack.pop(); a = stack.pop()\n                    ta = type(a); tb = type(b)\n                    if (ta is int or ta is float) and (tb is int or tb is float):\n                        push(a * b)\n                    else:\n                        push(_binary(\"*\", a, b, lines[ip - 1]))\n                elif op == B.BINARY_DIV:\n                    b = stack.pop(); a = stack.pop()\n                    push(_binary(\"/\", a, b, lines[ip - 1]))\n                elif op == B.BINARY_MOD:\n                    b = stack.pop(); a = stack.pop()\n                    push(_binary(\"%\", a, b, lines[ip - 1]))\n                elif op == B.BINARY_POW:\n                    b = stack.pop(); a = stack.pop()\n                    push(_binary(\"**\", a, b, lines[ip - 1]))\n\n                # --- iteration setup, indexing, short-circuit ---\n                elif op == B.GET_ITER:\n                    push(iter(rt._as_iterable(stack.pop(), lines[ip - 1])))\n                elif op == B.INDEX_GET:\n                    idx = stack.pop(); cont = stack.pop()\n                    push(rt._index_get(cont, idx, lines[ip - 1]))\n                elif op == B.INDEX_ \n                        flat = stack[-2 * arg:]\n                        del stack[-2 * arg:]\n                        for i in range(0, len(flat), 2):\n                            k = flat[i]\n                            if isinstance(k, (list, dict)):\n                                raise RuntimeErrorSandy(\n                                    f\"map key cannot be a {type_name(k)}\",\n                                    lines[ip - 1])\n                            d[k] = flat[i + 1]\n                    push(d)\n                elif op == B.BUILD_INTERP:\n                    if arg:\n                        parts = stack[-arg:]\n                        del stack[-arg:]\n                        push(\"\".join(parts))\n                    else:\n                        push(\"\")\n                elif op == B.STR_COERCE:\n                    push(to_str(stack.pop()))\n                elif op == B.MAKE_FUNCTION:\n                    tmpl = consts[arg]\n                    push(VMFunction(tmpl.name, tmpl.params, tmpl, env))\n                else:\n                    raise RuntimeErrorSandy(f\"unknown opcode {op}\", lines[ip - 1])\n\n            if switched:\n                continue\n        return None\n\n\ndef run_program(program, out=None):\n    from .compiler import compile_program\n    from .runtime import load_module_vm\n    vm = VM(out=out)\n    vm.rt.module_loader = load_module_vm   # imports run on the VM too\n    return vm.run(compile_program(program))\n", "/sandy/stdlib/lists.sy": "# Sandy standard library: list helpers, including higher-order functions.\n#\n#     import \"lists\" as lists\n#     fn double(x) { return x * 2 }\n#     print(lists.map(double, [1, 2, 3]))     # [2, 4, 6]\n\nfn map(f, items) {\n    out = []\n    for x in items {\n        push(out, f(x))\n    }\n    return out\n}\n\nfn filter(pred, items) {\n    out = []\n    for x in items {\n        if pred(x) {\n            push(out, x)\n        }\n    }\n    return out\n}\n\nfn reduce(f, acc, items) {\n    for x in items {\n        acc = f(acc, x)\n    }\n    return acc\n}\n\nfn reverse(items) {\n    out = []\n    for x in items {\n        out = [x] + out\n    }\n    return out\n}\n\nfn contains(items, target) {\n    for x in items {\n        if x == target { return true }\n    }\n    return false\n}\n\nfn index_of(items, target) {\n    i = 0\n    for x in items {\n        if x == target { return i }\n        i += 1\n    }\n    return -1\n}\n\nfn unique(items) {\n    out = []\n    for x in items {\n        if not contains(out, x) {\n            push(out, x)\n        }\n    }\n    return out\n}\n\nfn take(items, n) {\n    out = []\n    i = 0\n    for x in items {\n        if i >= n { break }\n        push(out, x)\n        i += 1\n    }\n    return out\n}\n\nfn drop(items, n) {\n    out = []\n    i = 0\n    for x in items {\n        if i >= n { push(out, x) }\n        i += 1\n    }\n    return out\n}\n\nfn first(items) {\n    if len(items) == 0 { throw \"first of an empty list\" }\n    return items[0]\n}\n\nfn last(items) {\n    if len(items) == 0 { throw \"last of an empty list\" }\n    return items[len(items) - 1]\n}\n", "/sandy/stdlib/math.sy": "# Sandy standard library: math helpers.\n#\n#     import \"math\" as math\n#     print(math.gcd(48, 36))\n\npi = 3.141592653589793\ne = 2.718281828459045\ntau = 6.283185307179586\n\nfn sign(x) {\n    if x > 0 { return 1 }\n    if x < 0 { return -1 }\n    return 0\n}\n\nfn clamp(x, lo, hi) {\n    if x < lo { return lo }\n    if x > hi { return hi }\n    return x\n}\n\nfn gcd(a, b) {\n    a = abs(a)\n    b = abs(b)\n    while b != 0 {\n        t = b\n        b = a % b\n        a = t\n    }\n    return a\n}\n\nfn factorial(n) {\n    if n < 0 { throw \"factorial of a negative number\" }\n    result = 1\n    i = 2\n    while i <= n {\n        result = result * i\n        i += 1\n    }\n    return result\n}\n\nfn is_prime(n) {\n    if n < 2 { return false }\n    i = 2\n    while i * i <= n {\n        if n % i == 0 const codeEl = document.getElementById("code");
const outEl = document.getElementById("out");
const statusEl = document.getElementById("status");
const runBtn = document.getElementById("run");
const exSel = document.getElementById("examples");

for (const name of Object.keys(EXAMPLES)) {
  const opt = document.createElement("option");
  opt.value = name; opt.textContent = name; exSel.appendChild(opt);
}
exSel.onchange = () => { codeEl.value = EXAMPLES[exSel.value]; };
codeEl.value = EXAMPLES[Object.keys(EXAMPLES)[0]];

// Insert a tab (4 spaces) instead of leaving the textarea.
codeEl.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, s) + "    " + codeEl.value.slice(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + 4;
  }
});

    if errs:
        out = ["✗ " + str(len(errs)) + " type error(s):"]
        for msg, line in sorted(errs, key=lambda e: (e[1] or 0)):
            where = " (line " + str(line) + ")" if line else ""
            out.append("  TypeError" + where + ": " + msg)
        return {"text": "\\n".join(out), "error": True}
    buf = io.StringIO()
    try:
        run_source(code, Interpreter(out=buf))
    except SandyError as e:
        return {"text": buf.getvalue() + e.format("Error"), "error": True}
    except RecursionError:
        return {"text": buf.getvalue() + "RuntimeError: too much recursion", "error": True}
    return {"text": buf.getvalue(), "error": False}
`);
  statusEl.textContent = "Ready.";
  runBtn.disabled = false;
  runBtn.onclick = run;
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
  });
}

function run() {
  if (!pyodide) return;
  runBtn.disabled = true;
  statusEl.textContent = "Running…";
  outEl.textContent = "";
  // Let the UI paint "Running…" before the (synchronous) run.
  setTimeout(() => {
    let result;
    const t0 = performance.now();
    try {
      const fn = pyodide.globals.get("run_sandy");
      result = fn(codeEl.value).toJs({ dict_converter: Object.fromEntries });
      fn.destroy();
    } catch (err) {
      result = { text: String(err), error: true };
    }
    const ms = (performance.now() - t0).toFixed(0);
    outEl.textContent = result.text || (result.error ? "" : "(no output)");
    outEl.className = "";
    if (result.error) {
      const span = document.createElement("span");
      span.className = "err"; span.textContent = outEl.textContent;
      outEl.textContent = ""; outEl.appendChild(span);
    }
    statusEl.textContent = "Done in " + ms + " ms.";
    runBtn.disabled = false;
  }, 20);
}

boot().catch((e) => { statusEl.textContent = "Failed to load: " + e; });
</script>
</body>
</html>
